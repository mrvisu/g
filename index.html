              const isDelivered = currentStatus === statusesToUse[statusesToUse.length - 1].id;

              const clientArchiveRecords = [
                  ...transactions,
                  ...weddings,
                  ...appointments.map(appointment => ({ ...appointment, type: 'appointment', dateTime: appointment.createdAt || appointment.dateTime || appointment.date, total: appointment.approvedPrice || appointment.price || appointment.requestedPrice || 0, status: appointment.status === 'completed' ? 3 : appointment.status === 'confirmed' ? 1 : 0 }))
              ]
                  .filter(record => normalizeCustomerPhone(record.phone) === normalizeCustomerPhone(trackPhone))
                  .sort((a,b) => new Date(b.dateTime || 0) - new Date(a.dateTime || 0));
              
              const existingProfilePic = txn.clientProfilePic || clientArchiveRecords.find(t => t.clientProfilePic)?.clientProfilePic || null;
              
              const clientPromotions = (!txn.selectedPromos || !settings.promotions) ? [] : settings.promotions.filter(p => txn.selectedPromos.includes(p.id));

              // حساب رصيد المكافآت
              const rewardsInfo = getCustomerRewards(txn.phone, allRecords, settings);
              const availableRewards = rewardsInfo.balance;
              const trackingPhotoItems = Array.isArray(txn.photoNo) ? txn.photoNo.filter(p => typeof p === 'object' ? (p.number || p.serviceType) : p).map(p => typeof p === 'object' ? p : { number: p }) : (txn.photoNo ? [{ number: txn.photoNo }] : []);
              const photoServiceNames = [...new Set(trackingPhotoItems.map(photo => String(photo.serviceType || photo.service || '').trim()).filter(Boolean))];
              const clientPhotoNotes = trackingPhotoItems.map(photo => [photo.serviceType || photo.service, photo.note].map(value => String(value || '').trim()).filter(Boolean).join(' — ')).filter(Boolean).join('، ');
              const cleanedDisplayReqs = String(displayReqs || '').split('\n').filter(line => !photoServiceNames.some(serviceName => serviceName && line.includes(serviceName))).join('\n').trim();
              const clientDisplayReqs = cleanedDisplayReqs;
              const clientPhotoRows = trackingPhotoItems.filter(photo => photo.serviceType || photo.service || photo.note);
              const hasPhotoNameRequest = Boolean(txn.writeNameOnPhoto && String(txn.photoName || '').trim() && String(txn.nationalId || '').trim() && String(txn.branch || '').trim());
              const photoItemsWithNotes = trackingPhotoItems.filter(photo => String(photo.note || '').trim());
              const photoItemsWithoutNotes = trackingPhotoItems.filter(photo => !String(photo.note || '').trim());
              const instantPrintService = (settings.services || []).map(s => typeof s === 'string' ? { name: s, price: 0 } : s).find(s => /فور|فورى|فوري/i.test(s.name || ''));
              const instantPrintName = instantPrintService?.name || 'طباعة فورية';
              const instantPrintCost = Number(instantPrintService?.price || settings.appointmentSettings?.instantPrintPrice || 90);
              const instantPrintPaid = Math.min(instantPrintCost, Number(txn.paid) || 0);
              const instantPrintTotalDue = Math.max(0, instantPrintCost - instantPrintPaid);

              const handleProfilePicUpload = async (e) => {
                  const file = e.target.files[0];
                  if (!file) return;
                  setIsUploadingProfilePic(true);
                  try {
                      const reader = new FileReader();
                      reader.readAsDataURL(file);
                      reader.onload = (event) => {
                          const img = new Image();
                          img.src = event.target.result;
                          img.onload = async () => {
                              const canvas = document.createElement('canvas');
                              const MAX_WIDTH = 250; 
                              let scaleSize = 1;
                              if (img.width > MAX_WIDTH) scaleSize = MAX_WIDTH / img.width;
                              canvas.width = img.width * scaleSize;
                              canvas.height = img.height * scaleSize;
                              const ctx = canvas.getContext('2d');
                              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                              const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                              
                              const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                              const targetCol = isWedding ? 'weddings' : 'transactions';
                              await setDoc(doc(db, `artifacts/${appId}/public/data/${targetCol}`, txn.id), { ...txn, clientProfilePic: dataUrl }, { merge: true });
                              setIsUploadingProfilePic(false);
                          };
                      };
                  } catch (err) {
                      console.error("Error uploading profile pic", err);
                      setIsUploadingProfilePic(false);
                  }
              };

              const handleClientPaymentReceiptChange = (event) => {
                  const file = event.target.files?.[0];
                  if (!file) return;
                  if (!file.type || !file.type.startsWith('image/')) {
                      alert('يرجى اختيار صورة صحيحة لإيصال التحويل.');
                      event.target.value = '';
                      return;
                  }
                  if (file.size > 10 * 1024 * 1024) {
                      alert('حجم الصورة كبير. يرجى اختيار صورة لا يتجاوز حجمها 10 ميجابايت.');
                      event.target.value = '';
                      return;
                  }
                  const reader = new FileReader();
                  reader.onload = () => {
                      setClientPaymentReceiptFile(file);
                      setClientPaymentReceiptPreview(String(reader.result || ''));
                  };
                  reader.onerror = () => alert('تعذر قراءة الصورة. يرجى اختيارها مرة أخرى.');
                  reader.readAsDataURL(file);
              };

              const clearClientPaymentReceipt = () => {
                  setClientPaymentReceiptFile(null);
                  setClientPaymentReceiptPreview('');
                  if (clientPaymentReceiptInputRef.current) clientPaymentReceiptInputRef.current.value = '';
              };

              const sendClientPaymentConfirmation = (paymentMethod) => {
                  const amount = Number(clientPaymentAmount || txn.remaining);
                  if (!Number.isFinite(amount) || amount <= 0) {
                      alert('يرجى إدخال مبلغ صحيح للسداد.');
                      return;
                  }
                  if (paymentMethod === 'electronic' && !clientPaymentReceiptFile) {
                      alert('يرجى إرفاق صورة إيصال التحويل أولاً.');
                      return;
                  }
                  const methodLabel = paymentMethod === 'cash' ? 'نقداً داخل الاستوديو' : 'محفظة إلكترونية / إنستاباي';
                  const message = `السلام عليكم، أؤكد سداد مبلغ ${amount} ج.م من المبلغ المتبقي للإيصال رقم #${txn.receiptNo}.\nطريقة السداد: ${methodLabel}.\nيرجى مراجعة التحويل وتأكيده، وشكراً لكم.`;
                  const directMessage = paymentMethod === 'electronic'
                      ? `${message}\n\nسأرفق صورة إيصال التحويل المختارة في هذه المحادثة قبل الإرسال.`
                      : message;

                  // فتح محادثة رقم الاستوديو مباشرةً؛ لا نستخدم نافذة المشاركة التي تطلب اختيار تطبيق/مستلم.
                  openWhatsApp(settings.studioPhone || '01201260040', directMessage);
                  if (paymentMethod === 'electronic') {
                      alert('تم فتح محادثة الاستوديو مباشرةً مع نص التحويل. أرفق صورة الإيصال المختارة داخل واتساب ثم اضغط إرسال؛ لا تُرسل الصورة تلقائياً من صفحة العميل.');
                  }
              };

              const handleInstantPrintRequest = () => {
                  const msg = `مرحباً فريق ${settings.studioName || 'الاستوديو'}،
أرغب في طلب طباعة فورية للصور الخاصة بي.

رقم الإيصال: #${txn.receiptNo}
الاسم: ${txn.photoName || txn.clientName || displayName || 'العميل'}
الخدمة: ${instantPrintName}
تكلفة الطباعة الفورية: ${formatCurrencyEnglish(instantPrintCost)}
المدفوع المحتسب للطباعة الفورية: ${formatCurrencyEnglish(instantPrintPaid)}
المتبقي لاستكمال الطباعة الفورية: ${formatCurrencyEnglish(instantPrintTotalDue)}

برجاء تأكيد الطلب وموعد جاهزية الطباعة. شكراً لحضراتكم.`;
                  openWhatsApp(settings.studioPhone || '01201260040', msg);
              };

              const handleShareTracking = async () => {
                  try {
                      const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                      const targetCol = isWedding ? 'weddings' : 'transactions';
                      await setDoc(doc(db, `artifacts/${appId}/public/data/${targetCol}`, txn.id), { hasSharedLink: true }, { merge: true });
                  } catch (err) {
                      console.error("Error updating share status", err);
                  }

                  const shareUrl = window.location.href.split('?')[0] + "?client=true";

                  if (navigator.share) {
                      try {
                          await navigator.share({
                              title: settings.studioName,
                              text: 'تابع حالة طلبك واكتشف أحدث العروض من الاستوديو!',
                              url: shareUrl
                          });
                      } catch (err) {
                          console.log('Share canceled or failed', err);
                      }
                  } else {
                      navigator.clipboard.writeText(shareUrl);
                      alert("تم نسخ رابط الاستوديو بنجاح! يمكنك الآن مشاركته.");
                  }
              };

              return (
                  <div className="min-h-screen bg-gradient-to-b from-[#0d1424] via-slate-950 to-[#070b14] text-slate-100 p-4 md:p-6 flex flex-col items-center pb-32">
                      <FloatingPortalMessage navigateTo={navigateTo} />
                      <div className="mb-3 flex w-full max-w-md items-center justify-between gap-2">
                          <div className="flex items-center gap-2">
                              <button type="button" onClick={handleShareTracking} className="flex h-9 w-9 items-center justify-center rounded-full border border-blue-500/30 bg-blue-950/40 text-blue-300 transition hover:bg-blue-800/50" title="مشاركة رابط العميل" aria-label="مشاركة رابط العميل"><i className="ph-fill ph-share-network text-base"></i></button>
                          </div>
                          <button type="button" onClick={() => navigateTo('?client=true')} className="inline-flex h-10 items-center justify-center gap-2 rounded-xl border border-cyan-300/25 bg-gradient-to-l from-cyan-950/70 to-slate-900 px-3.5 text-xs font-black text-cyan-100 shadow-lg shadow-cyan-950/20 transition-all hover:-translate-y-0.5 hover:border-cyan-200/60 hover:from-cyan-900/70 hover:text-white focus:outline-none focus:ring-2 focus:ring-cyan-300/30">
                              <i className="ph-fill ph-arrow-right text-base"></i><span>العودة إلى بوابة العملاء</span>
                          </button>
                      </div>
                      

                      {/* 1. البطاقة المدمجة (الصورة الشخصية + الترحيب) */}
                      <div className={`w-full max-w-md bg-gradient-to-br ${isWedding ? 'from-pink-950/50' : 'from-blue-950/50'} to-slate-900 p-6 md:p-8 rounded-3xl border ${isWedding ? 'border-pink-500/30 shadow-pink-900/20' : 'border-blue-500/30 shadow-blue-900/20'} mb-6 shadow-2xl relative overflow-hidden mt-2`}>
                          <div className={`absolute top-0 right-0 w-full h-2 bg-gradient-to-l ${isWedding ? 'from-pink-400 to-rose-500' : 'from-blue-400 to-indigo-500'}`}></div>
                          <div className="flex flex-col sm:flex-row items-center text-center sm:text-right gap-5 relative z-10">
                              <div className="relative group shrink-0">
                                  <div className={`w-24 h-24 sm:w-20 sm:h-20 rounded-full overflow-hidden border-4 ${isWedding ? 'border-pink-500/40' : 'border-blue-500/40'} shadow-lg bg-slate-800 flex items-center justify-center`}>
                                      {existingProfilePic ? (
                                          <img src={existingProfilePic} alt="Profile" className="w-full h-full object-cover" />
                                      ) : (
                                          <i className="ph-fill ph-user text-4xl text-slate-500"></i>
                                      )}
                                  </div>
                                  <label className="absolute -bottom-1 -left-1 w-8 h-8 bg-yellow-500 text-slate-900 rounded-full flex items-center justify-center cursor-pointer shadow-lg hover:bg-yellow-400 hover:scale-110 transition-all border-2 border-slate-900" title="إضافة/تغيير صورتك الشخصية">
                                      {isUploadingProfilePic ? <i className="ph ph-spinner animate-spin"></i> : <i className="ph-fill ph-camera-plus text-sm"></i>}
                                      <input type="file" accept="image/*" className="hidden" onChange={handleProfilePicUpload} disabled={isUploadingProfilePic} />
                                  </label>
                              </div>
                              <div>
                                  <h1 className={`text-xl md:text-2xl font-black mb-1.5 tracking-wide ${isWedding ? 'text-pink-100' : 'text-blue-100'}`}>أهلاً بك أ. {displayName} 👋</h1>
                                  <p className="text-sm font-bold text-slate-300">شكراً لثقتكم واختياركم <span className="text-yellow-400">{settings.studioName}</span> ✨ لتوثيق لحظاتكم السعيدة.</p>
                              </div>
                          </div>
                      </div>

                      {Number(txn.paid || 0) <= 0 && (
                          <div className="w-full max-w-md mb-5 rounded-2xl border border-amber-400/45 bg-gradient-to-br from-amber-950/80 via-slate-900 to-red-950/50 p-4 text-center shadow-2xl shadow-amber-950/30 animate-fadeIn">
                              <div className="mx-auto mb-2 flex h-11 w-11 items-center justify-center rounded-full border border-amber-300/40 bg-amber-500/15 text-amber-300"><i className="ph-fill ph-warning-circle text-2xl"></i></div>
                              <p className="text-sm font-black text-amber-100">تنبيه مهم قبل الطباعة</p>
                              <p className="mt-1 text-xs leading-relaxed text-amber-100/80">{depositWarningText}</p>
                              <div className="mt-3 grid grid-cols-1 gap-2 sm:grid-cols-2">
                                  {settings.instapayLink ? <a href={settings.instapayLink} target="_blank" rel="noopener noreferrer" className="inline-flex items-center justify-center gap-1.5 rounded-xl bg-cyan-600 px-3 py-2.5 text-xs font-black text-white shadow-lg transition hover:bg-cyan-500"><i className="ph-fill ph-lightning text-base"></i> ادفع الآن / ادفع عربون</a> : <button type="button" onClick={(e) => { if (settings.vodafoneCashNumber) copyToClipboard(settings.vodafoneCashNumber, e); else document.getElementById('client-payment-area')?.scrollIntoView({behavior:'smooth', block:'center'}); }} className="inline-flex items-center justify-center gap-1.5 rounded-xl bg-cyan-600 px-3 py-2.5 text-xs font-black text-white shadow-lg transition hover:bg-cyan-500"><i className="ph-fill ph-wallet text-base"></i> {settings.vodafoneCashNumber ? 'نسخ رقم التحويل' : 'عرض طرق الدفع'}</button>}
                                  <button type="button" onClick={() => { const msg = `مرحباً، أرسلت صورة التحويل الخاصة بالإيصال رقم #${txn.receiptNo}. أرجو مراجعة التحويل وتأكيد دفع العربون. شكراً لكم.`; openWhatsApp(settings.studioPhone || '01201260040', msg); }} className="inline-flex items-center justify-center gap-1.5 rounded-xl border border-emerald-400/40 bg-emerald-600/20 px-3 py-2.5 text-xs font-black text-emerald-100 transition hover:bg-emerald-600/30"><i className="ph-fill ph-whatsapp-logo text-base"></i> أرسل صورة التحويل</button>
                              </div>
                          </div>
                      )}

                      <div className="w-full max-w-md mb-5 rounded-2xl border border-blue-500/25 bg-gradient-to-br from-blue-950/60 via-slate-900 to-indigo-950/40 p-4 shadow-xl">
                          {isDelivered ? (
                              <div className="bg-gradient-to-b from-green-950/40 to-slate-900 p-5 rounded-2xl border border-green-500/30 text-center relative overflow-hidden">
                                  <div className="w-14 h-14 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-3 border border-green-500/50 shadow-lg shadow-green-900/40"><i className="ph-fill ph-check-circle text-3xl"></i></div>
                                  <h3 className="font-black text-lg mb-1.5 text-white">تم تسليم الطلب بنجاح! 🎉</h3>
                                  <p className="text-slate-400 text-xs leading-relaxed">شكراً لاختيارك {settings.studioName}. نتمنى أن تكون الصور والأعمال قد نالت إعجابكم.</p>
                              </div>
                          ) : (
                              <>
                                  <div className="flex items-center justify-between gap-2 mb-4"><p className="text-sm font-black text-blue-100 flex items-center gap-2"><i className="ph-fill ph-chart-line-up text-blue-300"></i> مراحل الطلب</p><span className="text-[10px] font-black text-blue-200 bg-blue-500/10 border border-blue-400/25 rounded-full px-2.5 py-1">{statusProgress}%</span></div>
                                  <div className="flex items-start gap-1" dir="rtl">
                                      {statusesToUse.map((status, index) => { const done = index <= currentStatusIndex; const active = index === currentStatusIndex; return <div key={status.id} className="flex min-w-0 flex-1 flex-col items-center text-center">
                                          <div className="flex w-full items-center"><div className={`h-2 w-full rounded-full ${index === 0 ? 'opacity-0' : done ? 'bg-blue-500' : 'bg-slate-800'}`}></div><div className={`relative z-10 flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 ${done ? status.clientIconCompleted : 'border-slate-700 bg-slate-900 text-slate-600'} ${active ? 'ring-4 ring-blue-500/15' : ''}`}><i className={`ph-fill ${status.icon} text-base`}></i></div><div className={`h-2 w-full rounded-full ${index === statusesToUse.length - 1 ? 'opacity-0' : index < currentStatusIndex ? 'bg-blue-500' : 'bg-slate-800'}`}></div></div>
                                          <span className={`mt-2 px-1 text-[9px] font-black leading-tight ${active ? status.clientTextCurrent : done ? 'text-slate-300' : 'text-slate-600'}`}>{status.label}</span>
                                      </div>; })}
                                  </div>
                              </>
                          )}
                      </div>

                      {txn.paymentPending && <div className="w-full max-w-md mb-5 bg-gradient-to-l from-amber-950/70 to-slate-900 border border-amber-400/35 rounded-2xl p-4 flex items-start gap-3 shadow-lg"><div className="w-11 h-11 rounded-xl bg-amber-500/15 border border-amber-400/30 text-amber-300 flex items-center justify-center shrink-0"><i className="ph-fill ph-hourglass-medium text-2xl"></i></div><div><p className="text-amber-200 text-sm font-black">حجزك قيد المراجعة</p><p className="text-amber-100/75 text-xs leading-relaxed mt-1">استلمنا طلبك بنجاح. يراجع الاستوديو الموعد والخدمات والمبلغ، وستظهر هنا أي تعديلات أو تأكيدات جديدة تلقائيًا.</p>{typeof Notification !== 'undefined' && Notification.permission !== 'granted' && <button type="button" onClick={async()=>{const result=await Notification.requestPermission(); if(result==='granted') showBrowserNotification('تم تفعيل إشعارات الحجز','سنخبرك عند تأكيد أو إكمال طلبك.');}} className="mt-2 text-[10px] bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/30 text-amber-100 px-2.5 py-1.5 rounded-lg font-black"><i className="ph-fill ph-bell-ringing ml-1"></i> تفعيل إشعارات الحالة</button>}</div></div>}

                      {hasPhotoNameRequest && <div className="w-full max-w-md mb-5 rounded-2xl border border-indigo-500/30 bg-indigo-950/30 shadow-lg overflow-hidden">
                          <button type="button" onClick={() => { setShowConfirmData(v => !v); setEditingConfirmData(false); }} className="w-full p-4 flex items-center gap-3 text-right hover:bg-indigo-900/30 transition-colors">
                              <div className="w-10 h-10 rounded-xl bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 flex items-center justify-center shrink-0"><i className={`ph-fill ${txn.identityConfirmed ? 'ph-check-circle' : 'ph-identification-card'} text-xl`}></i></div>
                              <div className="flex-1 min-w-0"><p className="text-indigo-100 font-black text-sm">تأكيد بيانات الإيصال</p><p className="text-[11px] text-slate-400 mt-1 truncate">{txn.identityConfirmed ? `تم التأكيد: ${txn.photoName || txn.clientName || 'الاسم'} • ${txn.nationalId || 'بدون رقم قومي'} • ${txn.branch || 'بدون شعبة'}` : 'راجع الاسم والرقم القومي قبل الطباعة'}</p></div>
                              <i className={`ph-bold ph-caret-${showConfirmData ? 'up' : 'down'} text-indigo-300 text-lg`}></i>
                          </button>
                          {showConfirmData && <div className="border-t border-indigo-500/20 p-4 animate-fadeIn">
                              {!editingConfirmData && txn.identityConfirmed ? <div className="flex items-start justify-between gap-3 bg-slate-950/70 border border-emerald-500/20 rounded-xl p-3"><div className="min-w-0 flex-1"><p className="text-emerald-300 text-xs font-black flex items-center gap-1"><i className="ph-fill ph-check-circle"></i> البيانات معتمدة</p><div className="mt-3 rounded-lg border border-slate-800 bg-slate-900/80 px-3 py-2"><p className="text-[10px] text-slate-500 font-bold mb-1">الاسم على الصورة</p><p className="text-white text-sm font-bold truncate">{txn.photoName || txn.clientName || '—'}</p></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3"><div className="min-w-0"><p className="text-[10px] text-slate-500 font-bold mb-1">الرقم القومي</p><p className="text-slate-300 text-xs font-mono truncate" dir="ltr">{txn.nationalId || '—'}</p></div><div className="min-w-0 sm:border-r sm:border-slate-800 sm:pr-3"><p className="text-[10px] text-slate-500 font-bold mb-1">الشعبة / المسار</p><p className="text-purple-300 text-xs font-bold truncate">{txn.branch || '—'}</p></div></div></div><button type="button" onClick={() => setEditingConfirmData(true)} className="w-9 h-9 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shrink-0" title="تعديل البيانات"><i className="ph ph-pencil-simple"></i></button></div> : <div className="space-y-3"><p className="text-xs text-slate-300 leading-relaxed">يمكنك تعديل الاسم المنفصل للطباعة والرقم القومي والشعبة ثم حفظها. الاسم الأساسي للإيصال ثابت من الاستوديو.</p><div className="space-y-3"><div className="min-w-0"><label className="text-xs text-slate-400 font-bold block mb-1">الاسم المنفصل المطلوب كتابته على الصورة</label><input id="client-confirm-name" defaultValue={txn.photoName || txn.clientName || ''} placeholder="الاسم المطلوب كتابته على الصورة" className="w-full min-w-0 p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-indigo-500" /></div><div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div className="min-w-0"><label className="text-xs text-slate-400 font-bold block mb-1">الرقم القومي للصورة</label><input id="client-confirm-national-id" defaultValue={txn.nationalId || ''} inputMode="numeric" maxLength="14" placeholder="الرقم القومي (14 رقمًا)" className="w-full min-w-0 p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-indigo-500" /></div><div className="min-w-0 sm:border-r sm:border-slate-800 sm:pr-4"><label className="text-xs text-slate-400 font-bold block mb-1">الشعبة / المسار</label><input id="client-confirm-branch" defaultValue={txn.branch || ''} placeholder="الشعبة / المسار" className="w-full min-w-0 p-3 bg-slate-950 border border-slate-700 rounded-xl text-white outline-none focus:border-indigo-500" /></div></div></div><p className="text-[11px] leading-relaxed text-amber-200 bg-amber-950/40 border border-amber-500/30 p-3 rounded-xl"><i className="ph-fill ph-warning-circle ml-1"></i>تأكد من صحة الاسم والرقم القومي قبل الحفظ، لأن إعادة الطباعة بسبب بيانات خاطئة تكون على مسؤولية العميل.</p><label className="flex items-start gap-2 text-xs text-indigo-100 bg-slate-950/80 p-3 rounded-xl"><input id="client-confirm-consent" type="checkbox" defaultChecked={txn.identityConfirmed} className="mt-0.5 accent-indigo-500" /><span>أؤكد صحة البيانات وأوافق على كتابتها على الصورة.</span></label><div className="flex gap-2"><button type="button" onClick={async()=>{const name=document.getElementById('client-confirm-name').value.trim(); const nationalId=document.getElementById('client-confirm-national-id').value.trim(); const branch=document.getElementById('client-confirm-branch').value.trim(); if(!name || !/^\d{14}$/.test(nationalId)){alert('يرجى إدخال الاسم والرقم القومي المكوّن من 14 رقمًا.');return;} const consent=document.getElementById('client-confirm-consent'); if(!consent || !consent.checked){alert('يرجى تأكيد صحة البيانات والموافقة على كتابتها على الصورة.');return;} const editedAt=new Date().toISOString(); const previousValues={name:txn.photoName || txn.clientName || '', nationalId:txn.nationalId || '', branch:txn.branch || ''}; const nextValues={name, nationalId, branch}; const clientFieldChanges={...(txn.clientFieldChanges || {})}; Object.keys(nextValues).forEach(key=>{if(nextValues[key] !== previousValues[key]) clientFieldChanges[key]={at:editedAt, previous:previousValues[key], value:nextValues[key]};}); const targetCol=isWedding?'weddings':'transactions'; const appId=typeof __app_id!=='undefined'?__app_id:'studio-marakby'; await setDoc(doc(db,`artifacts/${appId}/public/data/${targetCol}`,txn.id),{nationalId,photoName:name,branch,writeNameOnPhoto:true,identityConfirmed:true,clientFieldChanges},{merge:true}); setShowConfirmData(false); setEditingConfirmData(false); alert('تم حفظ بيانات الإيصال بنجاح.');}} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl font-bold flex items-center justify-center gap-2"><i className="ph ph-check"></i> حفظ البيانات</button>{editingConfirmData && <button type="button" onClick={() => { setEditingConfirmData(false); setShowConfirmData(false); }} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 rounded-xl font-bold">إلغاء</button>}</div></div>}
                          </div>}

                          {/* Header */}
                          <div className="flex justify-between items-center mb-5 pb-4 border-b border-slate-800">

                              </div>
                              <div className="bg-gradient-to-br from-emerald-950/60 to-slate-900 border border-emerald-500/30 rounded-2xl p-4 text-center shadow-inner">
                                  <p className="text-[11px] text-emerald-200/80 font-bold flex items-center justify-center gap-1.5"><i className="ph-fill ph-check-circle text-emerald-300"></i> المدفوع</p>
                                  <p className="text-emerald-300 text-xl font-black mt-1">{formatCurrencyEnglish(txn.paid)}</p>
                              </div>
                          </div>

                          {/* Payment Area if Remaining > 0 */}
                          {txn.remaining > 0 && (
                              <div id="client-payment-area" className="mt-4 mb-6 overflow-hidden rounded-2xl border border-red-400/25 bg-gradient-to-br from-slate-950 via-slate-950 to-red-950/35 shadow-xl shadow-red-950/20">
                                  <button type="button" onClick={() => { setShowPaymentCard(v => !v); setShowClientPaymentPopup(false); }} aria-expanded={showPaymentCard} aria-controls="client-payment-details" className="flex w-full items-center justify-between gap-2.5 bg-gradient-to-l from-red-950/50 via-slate-900/70 to-slate-900/40 p-3 text-right transition hover:from-red-900/40 hover:to-slate-900/70 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-red-400/50">
                                      <span className="flex min-w-0 items-center gap-2.5"><span className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-red-500/25 to-rose-500/10 text-red-200 border border-red-300/25 shadow-inner"><i className="ph-fill ph-wallet text-lg"></i></span><span><span className="block text-xs font-black text-white">سداد المبلغ المتبقي</span><span className="mt-0.5 block text-[9px] text-slate-400">طرق دفع آمنة وسريعة</span></span></span>

                                              <button type="button" disabled={!settings.vodafoneCashNumber} onClick={(e) => copyToClipboard(settings.vodafoneCashNumber, e)} className="inline-flex min-h-9 w-full items-center justify-center gap-1.5 rounded-lg border border-indigo-300/20 bg-indigo-700/90 px-2.5 py-2 text-[11px] font-black text-white transition hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-300/50 disabled:cursor-not-allowed disabled:opacity-50"><i className="ph-fill ph-copy"></i> نسخ الرقم</button>

                                      {!showClientPaymentPopup ? (

                                                      <button type="button" onClick={() => sendClientPaymentConfirmation('electronic')} className="flex min-h-[62px] min-w-0 flex-col items-center justify-center gap-1 rounded-lg border border-indigo-400/15 bg-indigo-950/20 p-2 text-center text-white transition hover:border-indigo-300/40 hover:bg-indigo-900/25 focus:outline-none focus:ring-2 focus:ring-indigo-300/30"><i className="ph-fill ph-device-mobile text-lg text-indigo-300"></i><span className="text-[10px] font-black leading-tight">تحويل إلكتروني</span></button>

                      {clientPromotions.length > 0 && (

                          >

                                  <i className="ph-fill ph-ticket text-6xl transform rotate-12"></i>

                                  </div>
                                  <div className="flex-1">
                                      <h3 className="font-black text-lg text-white mb-1">عرض خاص مقدم لك! 🎁</h3>
                                      <p className="text-[11px] sm:text-xs font-bold text-yellow-50 leading-tight">اضغط هنا لمعرفة التفاصيل والخصم المتاح لك.</p>
                                  </div>
                                  <i className={`ph-bold ph-caret-${showPromoDetails ? 'up' : 'down'} text-white text-xl transition-transform`}></i>
                              </div>
                              
                              {/* Details section that expands */}
                              <div className={`relative z-10 overflow-hidden transition-all duration-300 ease-in-out ${showPromoDetails ? 'max-h-[600px] opacity-100 mt-2' : 'max-h-0 opacity-0'}`}>
                                  <div className="bg-white/20 backdrop-blur-md p-4 rounded-xl border border-white/30 shadow-inner flex flex-col gap-3">
                                      {clientPromotions.map((promo, idx) => (
                                          <div key={idx} className="bg-white/90 p-3 rounded-lg border border-yellow-200/50 flex flex-col gap-2">
                                              <div className="flex justify-between items-start">
                                                  <div className="flex items-center gap-2 font-black text-amber-900">
                                                      <i className={`ph-fill ${promo.icon || 'ph-gift'} text-xl`}></i> {promo.title}
                                                  </div>
                                                  {promo.discount && <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[10px] font-black border border-amber-300">{promo.discount}</span>}
                                              </div>
                                              <p className="text-xs text-amber-800 font-bold">{promo.shortDesc}</p>
                                              {promo.fullDesc && <p className="text-[10px] text-amber-700 leading-relaxed">{promo.fullDesc}</p>}
                                          </div>
                                      ))}

                                      <button 
                                          onClick={(e) => {
                                              e.stopPropagation();
                                              const msg = `مرحباً ${settings.studioName} 👋\nلقد رأيت العروض المخصصة لي في صفحة تتبع الطلب (إيصال #${txn.receiptNo}) وأود الاستفسار أو الحجز.`;
                                              openWhatsApp(settings.studioPhone || '01201260040', msg);
                                          }}
                                          className="mt-1 w-full bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 text-white font-bold py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-lg transition-transform hover:scale-[1.02] border border-green-400/50"
                                      >
                                          <i className="ph-fill ph-whatsapp-logo text-xl"></i>
                                          تواصل للاستفسار أو الحجز
                                      </button>
                                      <p className="text-[10px] text-yellow-900 mt-1 font-bold bg-white/40 p-2 rounded-lg text-center">
                                          * يرجى إبراز هذه الشاشة في الاستوديو للحصول على العروض.
                                      </p>
                                  </div>
                              </div>
                          </div>
                      )}

                      {/* 4. Download Link */}
                      {txn.photosLink && (
                          <a href={txn.photosLink} target="_blank" rel="noopener noreferrer" className="w-full max-w-md bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-500 hover:to-emerald-400 text-white p-5 rounded-3xl shadow-xl shadow-green-900/20 mb-8 flex items-center justify-center gap-3 font-bold text-lg hover:scale-[1.02] transition-all border border-green-400/30 group">
                             <div className="bg-white/20 p-2 rounded-full group-hover:animate-bounce">
                                 <i className="ph-bold ph-download-simple text-2xl"></i>
                             </div>
                             <span>تحميل الصور (رابط خارجي)</span>
                          </a>
                      )}

                      {/* 5. أرشيف الزيارات */}
                      <div className="w-full max-w-md bg-slate-900 rounded-3xl shadow-xl border border-slate-800 mb-8 relative overflow-hidden flex flex-col">
                          {/* Tabs Header */}
                          <div className="flex border-b border-slate-800 bg-slate-950/50">

                          </div>

                          <button type="button" onClick={() => setActiveClientTab(activeClientTab === 'archive' ? '' : 'archive')} aria-expanded={activeClientTab === 'archive'} aria-controls="client-archive-content" className="flex w-full items-center justify-between gap-3 bg-gradient-to-l from-slate-900 to-slate-950 px-5 py-4 text-right text-sm font-black text-white transition hover:from-slate-800 hover:to-slate-900 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-yellow-400/40"><span className="flex items-center gap-2"><i className={`ph-fill ${activeClientTab === 'archive' ? 'ph-folder-open' : 'ph-folder'} text-xl text-yellow-500`}></i> أرشيف الزيارات{clientArchiveRecords.length > 0 && <span className="rounded-full border border-slate-700 bg-slate-800 px-2 py-0.5 text-[10px] font-black text-slate-300">{clientArchiveRecords.length}</span>}</span><i className={`ph-bold ph-caret-${activeClientTab === 'archive' ? 'up' : 'down'} text-slate-400 transition-transform`}></i></button>
                          {/* Tab Content */}
                          <div id="client-archive-content" className={activeClientTab === 'archive' ? 'p-5 sm:p-6 transition-all duration-300' : 'hidden'}>
                              {/* Stages Content */}
                              {/* Archive Content */}
                              {activeClientTab === 'archive' && (
                                  <div className="animate-fadeIn space-y-3 max-h-[400px] overflow-y-auto custom-scrollbar pr-1">
                                      {clientArchiveRecords.map(record => {
                                          const isWedRec = record.type === 'wedding';
                                          const recStatuses = isWedRec ? WEDDING_STATUSES : ORDER_STATUSES;
                                          const recStatusObj = recStatuses.find(s => s.id === (record.status || 0)) || recStatuses[0];
                                          const isActive = record.id === txn.id;
                                          const recordUrl = `?phone=${encodeURIComponent(record.phone)}&receipt=${encodeURIComponent(record.receiptNo)}&type=${isWedRec ? 'w' : 't'}`;
                                          
                                          return (
                                              <a key={record.id} href={recordUrl} onClick={(e) => { e.preventDefault(); navigateTo(recordUrl); }} className={`block p-4 rounded-2xl border transition-all ${isActive ? 'bg-blue-950/20 border-blue-500/50 shadow-inner' : 'bg-slate-950 border-slate-800 hover:border-slate-600'}`}>
                                                  <div className="flex justify-between items-start mb-2">
                                                       <div className="flex items-center gap-2">
                                                           <i className={`text-xl ${isWedRec ? 'ph-fill ph-heart text-pink-500' : 'ph-fill ph-camera text-blue-500'}`}></i>
                                                           <span className="font-bold text-sm text-slate-200">{record.type === 'appointment' ? 'موعد' : 'إيصال'} #{record.receiptNo}</span>
                                                       </div>
                                                       <span className="text-xs text-slate-500 font-mono">{formatDateOnly(record.dateTime)}</span>
                                                  </div>
                                                  <div className="flex justify-between items-center mt-3">
                                                       <span className={`text-xs font-bold px-2.5 py-1 rounded-md flex items-center gap-1 ${recStatusObj.clientIconCompleted.split(' ')[0]} ${recStatusObj.clientIconCompleted.split(' ')[1]} bg-opacity-20 text-opacity-100 border ${recStatusObj.clientIconCompleted.split(' ')[4]}`}>
                                                           <i className={`ph ${recStatusObj.icon}`}></i> {recStatusObj.label}
                                                       </span>
                                                       <span className="text-sm font-black text-slate-300">{record.total} ج.م</span>
                                                  </div>
                                              </a>
                                          );
                                      })}
                                  </div>
                              )}
                          </div>
                      </div>

                      {/* Feedback Box */}
                      <div className="w-full max-w-md bg-gradient-to-br from-slate-900 to-slate-950 p-6 rounded-3xl shadow-xl border border-slate-800 mb-8 relative overflow-hidden">
                          <div className="absolute top-0 right-0 w-1 h-full bg-yellow-500"></div>
                          <h3 className="font-bold text-lg mb-3 flex items-center gap-2 text-slate-100">
                              <i className="ph-fill ph-star text-yellow-500 text-2xl"></i> رأيك يهمنا
                          </h3>
                          <p className="text-xs text-slate-400 mb-4 leading-relaxed">
                              نسعى دائماً لتقديم الأفضل لكم. كيف كانت تجربتكم معنا؟ يسعدنا سماع رأيكم أو أي ملاحظات لتطوير خدماتنا.
                          </p>
                          
                          {feedbackSubmitted || txn.clientRating > 0 ? (
                              <div className="bg-green-950/40 border border-green-500/30 p-4 rounded-xl text-center">
                                  <i className="ph-fill ph-check-circle text-4xl text-green-500 mb-2"></i>
                                  <p className="text-green-400 font-bold">شكراً لك! تم حفظ وإرسال تقييمك بنجاح.</p>
                              </div>
                          ) : (
                              <>
                                  <div className="flex justify-center gap-3 mb-5" dir="ltr">
                                      {[1, 2, 3, 4, 5].map(star => (
                                          <i
                                              key={star}
                                              className={`ph-fill ph-star text-4xl cursor-pointer transition-transform hover:scale-110 ${
                                                  star <= (hoveredStar || rating) ? 'text-yellow-500 drop-shadow-[0_0_8px_rgba(234,179,8,0.5)]' : 'text-slate-700'
                                              }`}
                                              onMouseEnter={() => setHoveredStar(star)}
                                              onMouseLeave={() => setHoveredStar(0)}
                                              onClick={() => setRating(star)}
                                          ></i>
                                      ))}
                                  </div>
                                  <textarea 
                                      value={feedbackText}
                                      onChange={(e) => setFeedbackText(e.target.value)}
                                      placeholder="اكتب رسالتك وتفاصيل تقييمك هنا (اختياري)..." 
                                      className="w-full p-4 rounded-xl bg-slate-950/50 border border-slate-700 text-sm text-white mb-4 outline-none focus:border-yellow-500 focus:bg-slate-900 transition-colors custom-scrollbar resize-none shadow-inner"
                                      rows="4"
                                  ></textarea>
                                  <button 
                                      onClick={async () => {
                                          if(rating === 0 && !feedbackText.trim()) return;
                                          setIsSubmittingFeedback(true);
                                          try {
                                              const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                                              const targetCol = isWedding ? 'weddings' : 'transactions';
                                              await setDoc(doc(db, `artifacts/${appId}/public/data/${targetCol}`, txn.id), { clientRating: rating, clientFeedback: feedbackText, clientFeedbackAt: new Date().toISOString() }, { merge: true });
                                              
                                              setFeedbackSubmitted(true);
                                          } catch(err) {
                                              console.error("Error saving feedback:", err);
                                          }
                                          setIsSubmittingFeedback(false);
                                      }}
                                      disabled={isSubmittingFeedback || (rating === 0 && !feedbackText.trim())}
                                      className={`w-full text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 text-sm border shadow-md group ${
                                          (rating === 0 && !feedbackText.trim()) || isSubmittingFeedback
                                              ? 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed'
                                              : 'bg-slate-800 hover:bg-slate-700 border-slate-700 hover:border-yellow-500/50'
                                      }`}
                                  >
                                      {isSubmittingFeedback ? (
                                          <div className="w-5 h-5 border-2 border-slate-400 border-t-transparent rounded-full animate-spin"></div>
                                      ) : (
                                          <><i className="ph-fill ph-paper-plane-right text-lg text-yellow-500 group-hover:scale-110 transition-transform"></i> حفظ التقييم وإرساله للإدارة</>
                                      )}
                                  </button>
                              </>
                          )}
                      </div>
                  </div>
              );
          }

          if (!isTracking && !isAuthenticatedAdmin) {
              return <LoginScreen validPassword={settings.adminPassword || '1234'} onLogin={() => { setIsAuthenticatedAdmin(true); localStorage.setItem('studioAdminAuth', 'true'); }} navigateTo={navigateTo} />;
          }

          return (
            <div className={`min-h-screen bg-slate-950 text-slate-100 pb-20 ${!isTracking ? 'admin-app' : ''}`}>
              {authError && <div className="bg-red-600 text-white text-center py-1 font-bold text-xs">{authError}</div>}
              {isTracking ? null : <Navigation activeTab={activeTab} setActiveTab={setActiveTab} settings={settings} onLogout={handleLogout} feedbacks={feedbacks} unreadCount={unreadFeedbackCount} onViewFeedback={handleViewFeedback} />}
              {appointmentNotice && !isTracking && <div className="fixed top-24 left-3 right-3 sm:left-auto sm:right-6 z-[100] sm:w-96 bg-gradient-to-l from-yellow-500 to-amber-500 text-slate-950 rounded-2xl shadow-2xl border border-yellow-200 p-4 animate-fadeIn cursor-pointer" onClick={() => { setActiveTab('appointments'); setAppointmentNotice(null); }}><div className="flex items-start gap-3"><div className="w-10 h-10 rounded-xl bg-white/25 flex items-center justify-center shrink-0"><i className="ph-fill ph-bell-ringing text-2xl"></i></div><div className="min-w-0"><p className="font-black text-sm">حجز تصوير جديد</p><p className="text-xs font-bold mt-1 truncate">{appointmentNotice.name} {appointmentNotice.phone && `— ${appointmentNotice.phone}`}</p><p className="text-[10px] mt-2 font-bold opacity-75">اضغط لعرض الحجوزات الجديدة</p></div><button onClick={(e) => { e.stopPropagation(); setAppointmentNotice(null); }} className="text-slate-900/70 hover:text-slate-950"><i className="ph ph-x"></i></button></div></div>}
              <main className={`${isTracking ? '' : 'w-full p-4 md:p-6'}`}>
                {isTracking ? null : (
                    <>
                        {activeTab === 'dashboard' && <DashboardTab settings={settings} setSettings={setSettings} transactions={transactions} inventory={inventory} db={db} allRecords={allRecords} uniqueCustomersCount={uniqueCustomersCount} avgRating={avgRating} feedbacks={feedbacks} onDeleteCustomer={deleteCustomerPermanently} />}
                        {activeTab === 'appointments' && <AppointmentsTab appointments={appointments} db={db} settings={settings} onDeleteCustomer={deleteCustomerPermanently} />}
                        {activeTab === 'weddings' && <WeddingsTab settings={settings} setSettings={setSettings} weddings={weddings} inventory={inventory} db={db} allRecords={allRecords} uniqueCustomersCount={uniqueCustomersCount} avgRating={avgRating} feedbacks={feedbacks} onDeleteCustomer={deleteCustomerPermanently} />}
                        {activeTab === 'expenses' && <ExpensesTab settings={settings} setSettings={setSettings} expenses={expenses} inventory={inventory} db={db} />}
                        {activeTab === 'reports' && <ReportsTab settings={settings} inventory={inventory} transactions={transactions} weddings={weddings} expenses={expenses} setReceiptImageModal={setReceiptImageModal} />}
                        {activeTab === 'settings' && <SettingsTab settings={settings} setSettings={setSettings} inventory={inventory} updateInventoryExact={updateInventoryExact} saveSettingsToDB={saveSettingsToDB} />}
                    </>
                )}
              </main>
              
              <VisitHistoryModal phone={historyPhone} allRecords={allRecords} onClose={() => setHistoryPhone(null)} />
              <ReceiptModal imageUrl={receiptImageModal} onClose={() => setReceiptImageModal(null)} />
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
