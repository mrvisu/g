            }, [appointments]);

            const handleUpdateStatus = async (id, newStatus) => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                
                if (newStatus === 'completed') {
                    const appt = appointments.find(a => a.id === id);
                    if (appt) {
                        const suggestedTotal = appt.approvedPrice || appt.requestedPrice || appt.price || 0;
                        setCompletionModal({
                            appt,
                            total: String(suggestedTotal),
                            paid: String(appt.approvedPaid || 0),
                            paymentStatus: (appt.approvedPaid || 0) >= suggestedTotal && suggestedTotal > 0 ? 'full' : (appt.approvedPaid > 0 ? 'partial' : 'none'),
                            paymentMethod: appt.paymentMethod || 'cash'
                        });
                    }
                    return;
                }
                
                const appt = appointments.find(a => a.id === id);
                const approval = newStatus === 'confirmed' && appt ? { approvedPrice: appt.requestedPrice || appt.price || 0, price: appt.requestedPrice || appt.price || 0, paymentStatus: 'confirmed_by_studio', confirmedAt: new Date().toISOString(), statusUpdatedAt: new Date().toISOString(), statusNotificationId: `${id}-confirmed-${Date.now()}`, confirmationMessage: 'تم تأكيد موعدك بنجاح، وننتظرك في الموعد المحدد بكل ترحاب. شكراً لثقتك بنا.' } : { statusUpdatedAt: new Date().toISOString(), statusNotificationId: `${id}-${newStatus}-${Date.now()}` };
                if (newStatus === 'confirmed' && appt) {
                    const msg = `مرحباً أ. ${appt.clientName || ''} 👋\nيسعدنا إبلاغك بأنه تم تأكيد موعد التصوير الخاص بك يوم ${formatDateOnly(appt.date)} الساعة ${appt.time} في ${settings.studioName}.\nننتظرك بكل ترحاب، وشكراً لاختيارك لنا. 📸✨`;
                    openWhatsApp(appt.phone, msg);
                }
                await setDoc(doc(db, `artifacts/${appId}/public/data/appointments`, id), { status: newStatus, ...approval }, { merge: true });
            };

            const completeAppointmentWithPayment = async () => {
                if (!completionModal?.appt) return;
                const appt = completionModal.appt;
                const total = Math.max(0, parseFloat(completionModal.total) || 0);
                const paid = completionModal.paymentStatus === 'full' ? total : completionModal.paymentStatus === 'none' ? 0 : Math.min(total, Math.max(0, parseFloat(completionModal.paid) || 0));
                if (completionModal.paymentStatus === 'partial' && paid <= 0) { setActionError('أدخل قيمة المدفوع عند اختيار دفع جزء من الحساب.'); return; }
                if (paid > total) { setActionError('قيمة المدفوع لا يمكن أن تتجاوز إجمالي الحساب.'); return; }
                const now = new Date().toISOString();
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                const newTxn = {
                    id: Date.now().toString(), receiptNo: appt.receiptNo, dateTime: appt.createdAt || now,
                    clientName: appt.clientName, nationalId: appt.nationalId || '', branch: appt.branch || '', photoName: appt.photoName || '',
                    identityConfirmed: !!appt.identityConfirmed, phone: safeCustomerPhone(appt.phone),
                    photoNo: [{ number: 'بدون', note: appt.photoType || 'حجز أونلاين', needsName: false }], writeNameOnPhoto: appt.writeName || false,
                    requirements: appt.details || '', appointmentConfirmed: appt.status === 'confirmed', confirmationMessage: appt.confirmationMessage || '',
                    total, paid, electronicPaid: completionModal.paymentMethod === 'electronic' ? paid : 0,
                    remaining: Math.max(0, total - paid), rewardDiscount: 0, status: 3,
                    month: new Date().getMonth() + 1, year: new Date().getFullYear(), photosLink: '', selectedPromos: [], statusUpdatedAt: now, statusNotificationId: `${appt.id}-completed-${Date.now()}`,
                    paymentType: completionModal.paymentStatus, paymentMethod: completionModal.paymentMethod,
                    payments: paid > 0 ? [{ amount: paid, method: completionModal.paymentMethod, date: now }] : []
                };
                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/transactions`, newTxn.id), newTxn);
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/appointments`, appt.id));
                    setCompletionModal(null); setActionError('');
                } catch (err) {
                    console.error('Complete appointment error', err);
                    setActionError('تعذر حفظ الإيصال، حاول مرة أخرى.');
                }
            };

            const handleDelete = async (id) => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                await deleteDoc(doc(db, `artifacts/${appId}/public/data/appointments`, id));
                setDeleteModalId(null);
            };

            const filtered = appointments.filter(a => (filterStatus === 'all' || a.status === filterStatus) && (!invalidPhoneOnly || !isValidCustomerPhone(a.phone)));

            return (
                <div className="space-y-6" onClick={() => setOpenWaMenuId(null)}>
                     <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                         <div onClick={() => setFilterStatus('all')} className={`bg-slate-900 p-4 rounded-2xl shadow-sm border cursor-pointer transition-colors flex flex-col justify-center ${filterStatus === 'all' ? 'border-purple-500 bg-slate-800' : 'border-slate-800 hover:border-slate-600'}`}>
                             <p className="text-slate-400 text-xs font-bold mb-1">إجمالي الحجوزات</p>
                             <p className="text-2xl font-black text-white">{appointments.length}</p>
                         </div>
                         <div onClick={() => setFilterStatus('pending')} className={`bg-slate-900 p-4 rounded-2xl shadow-sm border cursor-pointer transition-colors flex flex-col justify-center relative ${filterStatus === 'pending' ? 'border-yellow-500 bg-slate-800' : 'border-slate-800 hover:border-slate-600'}`}>
                             {recentIds.length > 0 && <span className="absolute top-2 left-2 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span></span>}
                             <p className="text-yellow-400 text-xs font-bold mb-1">جديد / في الانتظار</p>
                             <p className="text-2xl font-black text-white">{appointments.filter(a => a.status === 'pending').length}</p>
                         </div>
                         <div onClick={() => setFilterStatus('confirmed')} className={`bg-slate-900 p-4 rounded-2xl shadow-sm border cursor-pointer transition-colors flex flex-col justify-center ${filterStatus === 'confirmed' ? 'border-blue-500 bg-slate-800' : 'border-slate-800 hover:border-slate-600'}`}>
                             <p className="text-blue-400 text-xs font-bold mb-1">تم التأكيد</p>
                             <p className="text-2xl font-black text-white">{appointments.filter(a => a.status === 'confirmed').length}</p>
                         </div>
                         <div onClick={() => setFilterStatus('completed')} className={`bg-slate-900 p-4 rounded-2xl shadow-sm border cursor-pointer transition-colors flex flex-col justify-center ${filterStatus === 'completed' ? 'border-green-500 bg-slate-800' : 'border-slate-800 hover:border-slate-600'}`}>
                             <p className="text-green-400 text-xs font-bold mb-1">مكتمل</p>
                             <p className="text-2xl font-black text-white">{appointments.filter(a => a.status === 'completed').length}</p>
                         </div>
                     </div>
                     
                     <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                          <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
                              <h2 className="text-xl font-bold text-slate-100"><i className="ph-fill ph-calendar-plus ml-2 text-purple-400 text-2xl"></i> قائمة حجوزات الأونلاين المباشرة</h2>
                              <button type="button" onClick={() => setInvalidPhoneOnly(value => !value)} aria-pressed={invalidPhoneOnly} className={`rounded-xl border px-3 py-2 text-xs font-bold transition-colors ${invalidPhoneOnly ? 'border-red-400 bg-red-950/50 text-red-200' : 'border-slate-700 bg-slate-950 text-slate-300 hover:border-red-400/50'}`}>
                                  <i className="ph-fill ph-phone-slash ml-1"></i>{invalidPhoneOnly ? 'عرض كل الحجوزات' : `حجوزات بلا هاتف مكتمل (${appointments.filter(a => !isValidCustomerPhone(a.phone)).length})`}
                              </button>
                          </div>
                          <div className="mb-4 flex items-center justify-end border-b border-slate-800 pb-4 text-slate-100">
                             <span className="bg-purple-900/30 text-purple-400 px-3 py-1 rounded border border-purple-500/30 text-xs font-bold">{filtered.length} طلب معروض</span>
                          </div>
                          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                              {filtered.map(appt => (
                                  <div key={appt.id} className="bg-slate-950 p-5 rounded-2xl border border-slate-800 flex flex-col gap-3 relative overflow-hidden group hover:border-purple-500/50 transition-all shadow-md animate-fadeIn">
                                      <div className={`absolute top-0 right-0 w-2 h-full ${appt.status === 'pending' ? 'bg-yellow-500' : appt.status === 'confirmed' ? 'bg-blue-500' : appt.status === 'completed' ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                      {recentIds.includes(appt.id) && <span className="absolute top-2 left-2 bg-yellow-500 text-slate-900 font-bold text-[10px] px-2 py-0.5 rounded shadow-sm animate-pulse">طلب جديد</span>}
                                      
                                      <div className="flex justify-between items-start">
                                          <div>
                                              <h3 className="font-bold text-slate-200 text-lg flex items-center gap-2"><i className="ph-fill ph-user-circle text-purple-400 text-xl"></i> {appt.clientName}</h3>
                                              <p className="text-sm text-slate-400 font-mono mt-1 flex items-center gap-1 cursor-pointer hover:text-white transition-colors" onClick={(e) => copyToClipboard(appt.phone, e)}><i className="ph-fill ph-phone text-xs"></i> {appt.phone}</p>
                                              <div className="flex flex-wrap gap-2 mt-2"><button type="button" onClick={(e)=>copyToClipboard(appt.clientName || '',e)} className="text-xs bg-slate-900 text-slate-200 border border-slate-700 px-2 py-1 rounded-lg"><i className="ph ph-copy ml-1"></i> نسخ الاسم</button><button type="button" onClick={(e)=>copyToClipboard(appt.nationalId || '',e)} className="text-xs bg-amber-950/30 text-amber-200 border border-amber-900/40 px-2 py-1 rounded-lg"><i className="ph ph-identification-card ml-1"></i> الرقم القومي: {appt.nationalId || 'غير مسجل'}</button></div>
                                          </div>
                                          <span className="bg-slate-800 text-slate-400 text-[10px] px-2 py-1.5 rounded-lg font-mono border border-slate-700 shadow-inner">#{appt.receiptNo}</span>
                                      </div>
                                      
                                      <div className="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm space-y-3 mt-2 shadow-inner">
                                          <div className="flex justify-between items-center pb-2 border-b border-slate-800/50">
                                              <span className="text-slate-500 text-xs flex items-center gap-1"><i className="ph-fill ph-clock"></i> الموعد:</span>
                                              <span className="font-black text-white bg-slate-950 px-2 py-1 rounded border border-slate-700 tracking-wider">{formatDateOnly(appt.date)} | {appt.time}</span>
                                          </div>
                                          <div className="flex justify-between items-center pb-2 border-b border-slate-800/50">
                                              <span className="text-slate-500 text-xs flex items-center gap-1"><i className="ph-fill ph-camera"></i> الخدمات:</span>
                                              <span className="font-bold text-purple-400 max-w-[150px] truncate" title={appt.photoType || 'غير محدد'}>{appt.photoType || 'غير محدد'}</span>
                                          </div>
                                          <div className="flex justify-between items-center">
                                              <span className="text-slate-500 text-xs flex items-center gap-1"><i className="ph-fill ph-wallet"></i> الدفع المفضل:</span>
                                              <span className={`font-bold px-2 py-1 rounded border ${appt.paymentMethod === 'electronic' ? 'text-indigo-400 bg-indigo-950/30 border-indigo-500/30' : 'text-emerald-400 bg-emerald-950/20 border-emerald-500/20'}`}>
                                                  {appt.paymentMethod === 'electronic' ? 'إلكتروني' : 'كاش بالاستوديو'}
                                              </span>
                                          </div>
                                          {settings.appointmentSettings?.showPrice !== false && (
                                              <div className="flex justify-between items-center border-t border-slate-800/50 pt-2 mt-2">
                                                  <span className="text-slate-500 text-xs flex items-center gap-1"><i className="ph-fill ph-coins"></i> إجمالي التكلفة:</span>
                                                  <span className="font-black text-yellow-400">{appt.status === 'confirmed' && appt.approvedPrice ? `${appt.approvedPrice} ج.م (معتمد)` : appt.requestedPrice > 0 ? `${appt.requestedPrice} ج.م — بانتظار اعتماد الاستوديو` : (appt.isFreeSchool ? 'مجاناً (مدرسي)' : 'يحدد بالاستوديو')}</span>
                                              </div>
                                          )}
                                      </div>
                                      
                                      <div className="flex flex-wrap gap-2 mt-1">
                                          {appt.branch && <div className="text-xs text-purple-300 font-bold flex items-center gap-1 bg-purple-950/30 px-2 py-1.5 rounded-lg border border-purple-900/30">الشعبة / المسار: {appt.branch}</div>}
                                          {appt.writeName && <div className="text-xs text-red-400 font-bold flex items-center gap-1 bg-red-950/30 px-2 py-1.5 rounded-lg border border-red-900/30"><i className="ph-fill ph-text-t text-base"></i> طباعة الاسم: {appt.photoName || appt.clientName} — الرقم القومي: {appt.nationalId || 'غير مسجل'}</div>}
                                          {appt.requireFemalePhotographer && <div className="text-xs text-pink-400 font-bold flex items-center gap-1 bg-pink-950/30 px-2 py-1.5 rounded-lg border border-pink-900/30"><i className="ph-fill ph-camera text-base"></i> طلب مصورة سيدة</div>}
                                          {appt.isFreeSchool && <div className="text-xs text-blue-400 font-bold flex items-center gap-1 bg-blue-950/30 px-2 py-1.5 rounded-lg border border-blue-900/30"><i className="ph-fill ph-heart text-base"></i> صور مدرسية (مجاناً)</div>}
                                      </div>

                                      {appt.details && <div className="text-xs text-slate-300 bg-slate-900/50 p-3 rounded-xl border border-slate-800 leading-relaxed relative mt-1 italic"><i className="ph-fill ph-quotes absolute top-2 right-2 text-slate-600 text-lg"></i> <span className="relative z-10 mr-6 block">"{appt.details}"</span></div>}
                                      
                                      <div className="flex flex-col gap-2 mt-auto pt-4 border-t border-slate-800">
                                          <select value={appt.status} onChange={(e) => handleUpdateStatus(appt.id, e.target.value)} className={`w-full appearance-none border text-xs sm:text-sm rounded-xl p-3 outline-none font-bold shadow-sm transition-colors cursor-pointer text-center ${appt.status === 'pending' ? 'bg-yellow-950/40 text-yellow-400 border-yellow-500/50' : appt.status === 'confirmed' ? 'bg-blue-950/40 text-blue-400 border-blue-500/50' : appt.status === 'completed' ? 'bg-green-950/40 text-green-400 border-green-500/50' : 'bg-red-950/40 text-red-400 border-red-500/50'}`}>
                                              <option value="pending" className="bg-slate-900 text-yellow-400">قيد الانتظار (طلب جديد)</option>
                                              <option value="confirmed" className="bg-slate-900 text-blue-400">تم تأكيد الموعد</option>
                                              <option value="completed" className="bg-slate-900 text-green-400">مكتمل (ينقل لعمليات اليوم)</option>
                                              <option value="cancelled" className="bg-slate-900 text-red-400">تم إلغاء الموعد</option>
                                          </select>
                                          
                                          <div className="grid grid-cols-2 gap-2 mt-2">
                                              <div className="relative">
                                                  <button onClick={(e) => { e.stopPropagation(); setOpenWaMenuId(openWaMenuId === appt.id ? null : appt.id); }} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl transition-colors border border-slate-700 flex justify-center items-center gap-1.5 text-xs font-bold" title="خيارات الرسائل"><i className="ph-fill ph-whatsapp-logo text-base"></i> خيارات الرسائل</button>
                                                  {openWaMenuId === appt.id && (
                                                      <div className="absolute bottom-full left-0 w-full mb-1 bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-1 flex flex-col z-10 animate-fadeIn">
                                                          <button onClick={(e) => {
                                                              e.stopPropagation();
                                                              const msg = `مرحباً أ. ${appt.clientName} 👋\nبخصوص طلب الحجز الخاص بك لموعد التصوير يوم ${formatDateOnly(appt.date)} الساعة ${appt.time} في ${settings.studioName}. \nتم تأكيد موعدك، ننتظرك بكل حب! 📸✨`;
                                                              openWhatsApp(appt.phone, msg);
                                                              setOpenWaMenuId(null);
                                                          }} className="text-right px-2 py-2 text-xs text-blue-300 hover:bg-slate-700 font-bold border-b border-slate-700">تأكيد الموعد</button>
                                                          <button onClick={(e) => {
                                                              e.stopPropagation();
                                                              const msg = `أهلاً بك أ. ${appt.clientName} 👋\nنعتذر جداً لعدم تمكننا من استقبالك في الموعد المحدد (يوم ${formatDateOnly(appt.date)} الساعة ${appt.time}) بسبب ظروف طارئة وضغط العمل في الاستوديو. سنقوم بالتواصل معك لتحديد موعد آخر يناسبك. شكرًا لتفهمك! 🙏`;
                                                              openWhatsApp(appt.phone, msg);
                                                              setOpenWaMenuId(null);
                                                          }} className="text-right px-2 py-2 text-xs text-red-400 hover:bg-slate-700 font-bold border-b border-slate-700">اعتذار عن الموعد</button>
                                                          <button onClick={(e) => {
                                                              e.stopPropagation();
                                                              const msg = `أهلاً بك أ. ${appt.clientName} 👋\nنرجو المعذرة، نظراً لضغط العمل نود تأجيل موعدك المحدد (يوم ${formatDateOnly(appt.date)} الساعة ${appt.time}) قليلاً. هل يناسبك تحديد موعد آخر قريب؟ شكرًا لمرونتك! 📸`;
                                                              openWhatsApp(appt.phone, msg);
                                                              setOpenWaMenuId(null);
                                                          }} className="text-right px-2 py-2 text-xs text-orange-400 hover:bg-slate-700 font-bold">تأجيل الموعد</button>
                                                      </div>
                                                  )}
                                              </div>
                                              
                                              <button onClick={(e) => { e.stopPropagation(); setDeleteModalId(appt.id); }} className="bg-red-950/40 text-red-400 hover:bg-red-600 hover:text-white p-2.5 rounded-xl transition-colors border border-red-900/30 flex justify-center items-center gap-1 text-xs font-bold shadow-sm" title="حذف الطلب"><i className="ph ph-trash text-base"></i> حذف</button>
                                          </div>
                                      </div>
                                  </div>
                              ))}
                              {filtered.length === 0 && <div className="col-span-full flex flex-col items-center justify-center py-16 text-slate-500 bg-slate-950/50 rounded-2xl border border-slate-800 border-dashed"><i className="ph-fill ph-calendar-x text-6xl mb-4 opacity-50"></i><p className="text-lg font-bold">لا توجد حجوزات في هذه القائمة.</p></div>}
                          </div>
                     </div>

                     {/* Completion and payment confirmation modal */}
                     {completionModal && (
                        <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-[120] p-4 animate-fadeIn" onClick={() => setCompletionModal(null)}>
                           <div className="bg-slate-900 p-5 sm:p-6 rounded-3xl shadow-2xl border border-emerald-500/30 max-w-md w-full relative overflow-hidden" onClick={e => e.stopPropagation()}>
                               <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-emerald-500 via-blue-500 to-indigo-500"></div>
                               <div className="flex items-center gap-3 mb-5"><div className="w-12 h-12 rounded-2xl bg-emerald-500/15 border border-emerald-400/30 text-emerald-300 flex items-center justify-center"><i className="ph-fill ph-receipt text-2xl"></i></div><div><h3 className="text-lg font-black text-white">تأكيد الدفع قبل إكمال الحجز</h3><p className="text-xs text-slate-400 mt-1">سيتم تسجيل البيانات داخل إيصال العميل وعمليات اليوم.</p></div></div>
                               <div className="bg-slate-950/70 border border-slate-800 rounded-2xl p-3 mb-4 flex items-center justify-between gap-3"><div><p className="text-[10px] text-slate-500">العميل</p><p className="text-sm font-black text-white">{completionModal.appt.clientName}</p></div><span className="font-mono text-blue-300 font-black">#{completionModal.appt.receiptNo}</span></div>
                               <label className="block text-xs text-slate-300 font-bold mb-2">إجمالي الحساب المعتمد (ج.م)</label>
                               <div className="flex items-center gap-2 bg-slate-950 border border-slate-700 rounded-xl p-2 mb-4"><input type="number" min="0" value={completionModal.total} onChange={e => setCompletionModal({...completionModal, total: e.target.value})} className="w-full bg-transparent text-white text-lg font-black text-center outline-none" /><span className="text-slate-500 text-xs">ج.م</span></div>
                               <p className="text-xs text-slate-300 font-bold mb-2">حالة السداد</p>
                               <div className="grid grid-cols-3 gap-2 mb-4"><button type="button" onClick={() => setCompletionModal({...completionModal, paymentStatus: 'full', paid: completionModal.total})} className={`p-2.5 rounded-xl border text-[11px] font-black ${completionModal.paymentStatus === 'full' ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>دفع كامل</button><button type="button" onClick={() => setCompletionModal({...completionModal, paymentStatus: 'partial'})} className={`p-2.5 rounded-xl border text-[11px] font-black ${completionModal.paymentStatus === 'partial' ? 'bg-amber-600 text-white border-amber-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>دفع جزء</button><button type="button" onClick={() => setCompletionModal({...completionModal, paymentStatus: 'none', paid: '0'})} className={`p-2.5 rounded-xl border text-[11px] font-black ${completionModal.paymentStatus === 'none' ? 'bg-slate-600 text-white border-slate-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>لم يدفع</button></div>
                               {completionModal.paymentStatus === 'partial' && <div className="animate-fadeIn mb-4"><label className="block text-xs text-amber-200 font-bold mb-2">المبلغ المدفوع فعليًا (ج.م)</label><input type="number" min="0" max={completionModal.total || 0} value={completionModal.paid} onChange={e => setCompletionModal({...completionModal, paid: e.target.value})} className="w-full p-3 bg-slate-950 border border-amber-500/40 rounded-xl text-white font-black text-center outline-none focus:border-amber-400" /></div>}
                               <p className="text-xs text-slate-300 font-bold mb-2">طريقة الدفع</p><div className="grid grid-cols-2 gap-2 mb-5"><button type="button" onClick={() => setCompletionModal({...completionModal, paymentMethod: 'cash'})} className={`p-2.5 rounded-xl border text-xs font-bold ${completionModal.paymentMethod === 'cash' ? 'bg-emerald-700 text-white border-emerald-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}><i className="ph-fill ph-money ml-1"></i> نقدي</button><button type="button" onClick={() => setCompletionModal({...completionModal, paymentMethod: 'electronic'})} className={`p-2.5 rounded-xl border text-xs font-bold ${completionModal.paymentMethod === 'electronic' ? 'bg-indigo-700 text-white border-indigo-400' : 'bg-slate-800 text-slate-400 border-slate-700'}`}><i className="ph-fill ph-device-mobile ml-1"></i> إلكتروني</button></div>
                               <div className="flex gap-3"><button type="button" onClick={completeAppointmentWithPayment} className="flex-1 bg-gradient-to-l from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 text-white py-3 rounded-xl font-black flex items-center justify-center gap-2"><i className="ph-fill ph-check-circle"></i> حفظ ونقل لعمليات اليوم</button><button type="button" onClick={() => setCompletionModal(null)} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-4 rounded-xl font-bold">إلغاء</button></div>
                           </div>
                        </div>
                     )}

                     {/* Delete Confirmation Modal */}
                     {deleteModalId && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4 animate-fadeIn" onClick={() => setDeleteModalId(null)}>
                           <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl border border-red-500/30 max-w-sm w-full text-center relative overflow-hidden" onClick={e => e.stopPropagation()}>
                               <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-rose-500"></div>
                               <div className="w-20 h-20 bg-red-500/20 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5 border border-red-500/30 shadow-lg shadow-red-900/20">
                                   <i className="ph-fill ph-warning-circle text-4xl"></i>
                               </div>
                               <h3 className="text-xl font-black text-white mb-2">تأكيد الحذف نهائياً</h3>
                               <p className="text-slate-400 text-sm mb-6 leading-relaxed">
                                   اختر الإجراء المناسب لهذا الحجز. الحذف نهائي ولا يمكن التراجع عنه.
                               </p>
                               <div className="grid grid-cols-1 gap-2.5">
                                   <div className="grid grid-cols-2 gap-2">
                                       <button onClick={() => handleDelete(deleteModalId)} className="w-full min-h-12 rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-xs font-bold text-slate-100 transition hover:bg-slate-700">
                                           حذف الموعد فقط
                                       </button>
                                       <button onClick={() => { const appointment = appointments.find(item => item.id === deleteModalId); if (appointment) onDeleteCustomer(appointment.phone, appointment.id, 'appointments'); setDeleteModalId(null); }} className="w-full min-h-12 rounded-xl border border-red-500/40 bg-red-950/30 px-3 py-2 text-xs font-black text-red-200 transition-colors hover:bg-red-900/50">
                                           {(() => { const appointment = appointments.find(item => item.id === deleteModalId); return isValidCustomerPhone(appointment?.phone) ? 'حذف كل بيانات العميل المرتبطة بهاتفه' : 'حذف هذا الحجز فقط (رقم الهاتف غير مكتمل)'; })()}
                                       </button>
                                   </div>
                                   <button onClick={() => setDeleteModalId(null)} className="w-full rounded-xl bg-slate-700 px-4 py-2.5 text-sm font-bold text-white transition-colors hover:bg-slate-600">
                                       إلغاء
                                   </button>
                               </div>
                           </div>
                        </div>
                     )}

                </div>
            );
        };

        const StatCard = ({title, value, color, highlight, onClick, hideValue = false, valueType = 'currency'}) => {
            const colors = { green: "bg-green-950/30 text-green-400 border-green-900/50", red: "bg-red-950/30 text-red-400 border-red-900/50", blue: "bg-blue-950/30 text-blue-400 border-blue-900/50", pink: "bg-pink-950/30 text-pink-400 border-pink-900/50", indigo: "bg-indigo-950/30 text-indigo-400 border-indigo-900/50", emerald: "bg-emerald-950/30 text-emerald-400 border-emerald-900/50", rose: "bg-rose-950/30 text-rose-400 border-rose-900/50", yellow: "bg-yellow-950/30 text-yellow-400 border-yellow-900/50", amber: "bg-amber-950/30 text-amber-300 border-amber-900/50", slate: "bg-slate-800/60 text-slate-300 border-slate-700" };
            const formattedValue = valueType === 'percent' ? `${Number(value || 0).toFixed(1)}%` : valueType === 'number' ? Number(value || 0).toLocaleString('en-US') : formatCurrency(value);
            return (
              <div onClick={onClick} className={`flex flex-col justify-center p-3 sm:p-4 rounded-xl border ${colors[color] || colors.blue} ${highlight ? 'shadow-lg scale-105' : ''} ${onClick ? 'cursor-pointer hover:opacity-80 transition-all hover:scale-[1.02]' : ''}`}>
                <h4 className="text-[10px] sm:text-xs font-bold opacity-80 mb-1 leading-tight">{title}</h4>
                <div className="text-sm sm:text-lg font-black">{hideValue ? '••••••' : formattedValue}</div>
              </div>
            );
        };

        const QuickServiceCard = ({ srvObj, onAdd, onPhotoPick, colorTheme = 'blue' }) => {
            const [qty, setQty] = useState(1);
            const [customPrice, setCustomPrice] = useState(srvObj.price || 0);
            useEffect(() => { setCustomPrice(srvObj.price || 0); }, [srvObj.price]);
            const themeColors = { blue: { text: 'text-blue-400', hoverText: 'group-hover:text-blue-300', btn: 'bg-blue-600 hover:bg-blue-500' }, purple: { text: 'text-purple-400', hoverText: 'group-hover:text-purple-300', btn: 'bg-purple-600 hover:bg-purple-500' } };
            const currentTheme = themeColors[colorTheme] || themeColors.blue;
            return (
              <div className="bg-slate-900 p-2.5 rounded-xl border border-slate-800 transition-all shadow-sm flex flex-col gap-1.5 group hover:border-slate-700">
                <div className="flex flex-col xl:flex-row justify-between items-start gap-1.5">
                  <span className={`${currentTheme.text} text-[11px] sm:text-xs font-bold ${currentTheme.hoverText} flex-1 leading-snug line-clamp-2`}>{srvObj.name}</span>
                  <div className="flex items-center bg-slate-950 rounded-md border border-slate-700 px-1 py-0.5 focus-within:border-slate-500 transition-colors shrink-0">
                     <input type="number" value={customPrice} onChange={e => setCustomPrice(parseFloat(e.target.value) || 0)} className="w-10 sm:w-12 bg-transparent text-white text-center outline-none text-[10px] sm:text-xs font-bold" />
                     <span className="text-[8px] sm:text-[9px] text-slate-500 mr-0.5">ج.م</span>
                  </div>
                </div>
                {srvObj.desc && <span className="text-[9px] sm:text-[10px] text-slate-500 leading-relaxed truncate" title={srvObj.desc}>{srvObj.desc}</span>}
                <div className="flex items-center gap-1.5 mt-auto pt-1.5 border-t border-slate-800/50">
                  <div className="flex items-center bg-slate-950 rounded-lg border border-slate-700 overflow-hidden shrink-0">
                    <button type="button" onClick={(e) => { e.preventDefault(); setQty(Math.max(1, qty - 1)); }} className="px-1.5 py-0.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors font-black text-xs">-</button>
                    <input type="number" min="1" value={qty} onChange={e => setQty(parseInt(e.target.value) || 1)} className="w-5 bg-transparent text-white text-center outline-none text-[11px] font-bold" />
                    <button type="button" onClick={(e) => { e.preventDefault(); setQty(qty + 1); }} className="px-1.5 py-0.5 text-slate-400 hover:text-white hover:bg-slate-800 transition-colors font-black text-xs">+</button>
                  </div>
                  <button type="button" onClick={(e) => { e.preventDefault(); onAdd({...srvObj, price: customPrice}, qty); if (onPhotoPick) onPhotoPick({...srvObj, price: customPrice}, qty); setQty(1); setCustomPrice(srvObj.price||0); }} className={`flex-1 text-white text-[10px] sm:text-xs font-bold py-1 rounded-lg transition-colors flex justify-center items-center gap-1 ${currentTheme.btn}`}><i className="ph ph-plus-circle text-xs"></i> <span className="hidden sm:inline">إضافة</span></button>
                </div>
              </div>
            );
        };

        const ServicesSettingsList = ({title, items, onAdd, onRemove, colorTheme = 'blue'}) => {
            const [newName, setNewName] = useState('');
            const [newPrice, setNewPrice] = useState('');
            const [newDesc, setNewDesc] = useState('');
            const handleEditClick = (item, idx) => { const obj = typeof item === 'string' ? {name: item, price: 0, desc: ''} : item; setNewName(obj.name); setNewPrice(obj.price); setNewDesc(obj.desc); onRemove(idx); };
            const isBlue = colorTheme === 'blue'; const isPink = colorTheme === 'pink';
            const colorClass = isBlue ? 'focus:border-blue-500' : isPink ? 'focus:border-pink-500' : 'focus:border-purple-500';
            const btnClass = isBlue ? 'bg-blue-600 hover:bg-blue-500' : isPink ? 'bg-pink-600 hover:bg-pink-500' : 'bg-purple-600 hover:bg-purple-500';
            const textClass = isBlue ? 'text-blue-400' : isPink ? 'text-pink-400' : 'text-purple-400';
            return (
              <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                <h3 className="font-bold text-slate-100 mb-4 border-b border-slate-800 pb-2">{title}</h3>
                <div className="flex flex-col gap-3 mb-5">
                  <div className="flex gap-2">
                    <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} className={`flex-1 p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none ${colorClass} placeholder-slate-500 text-sm`} placeholder="الاسم..."/>
                    <input type="number" value={newPrice} onChange={e=>setNewPrice(e.target.value)} className={`w-24 p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none ${colorClass} placeholder-slate-500 text-sm`} placeholder="السعر..."/>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={newDesc} onChange={e=>setNewDesc(e.target.value)} className={`flex-1 p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none ${colorClass} placeholder-slate-500 text-sm`} placeholder="تفاصيل صغيرة (اختياري)..."/>
                    <button onClick={()=>{if(newName){onAdd({name:newName, price:parseFloat(newPrice)||0, desc:newDesc});setNewName('');setNewPrice('');setNewDesc('');}}} className={`${btnClass} text-white px-5 rounded-lg transition-colors flex items-center justify-center`}><i className="ph ph-plus text-xl"></i></button>
                  </div>
                </div>
                <div className="flex flex-col gap-2 overflow-y-auto max-h-[300px] custom-scrollbar pr-2">
                  {items.map((item, idx) => {
                    const srv = typeof item === 'string' ? {name: item, price: 0, desc: ''} : item;
                    return (
                    <div key={idx} className="bg-slate-800 p-3 rounded-xl flex justify-between items-start border border-slate-700">
                      <div className="flex flex-col">
                        <span className="text-slate-300 text-sm font-bold flex items-center gap-2">{srv.name} {srv.price > 0 && <span className={`text-[10px] bg-slate-950 px-1.5 py-0.5 rounded ${textClass}`}>{srv.price} ج.م</span>}</span>
                        {srv.desc && <span className="text-xs text-slate-500 mt-1">{srv.desc}</span>}
                      </div>
                      <div className="flex items-center">
                          <button onClick={()=>handleEditClick(item, idx)} className="text-blue-400 hover:text-blue-300 bg-transparent rounded-full mr-2"><i className="ph ph-pencil-simple text-base"></i></button>
                          <button onClick={()=>onRemove(idx)} className="text-red-400 hover:text-red-300 bg-transparent rounded-full mr-2"><i className="ph ph-x text-base"></i></button>
                      </div>
                    </div>
                  )})}
                </div>
              </div>
            );
        };

        const MiniProductsSettingsList = ({title, items, onAdd, onRemove, onUpdateAll}) => {
            const [newTitle, setNewTitle] = useState('');
            const [newDesc, setNewDesc] = useState('');
            const [newPrice, setNewPrice] = useState('');
            const [newOriginalPrice, setNewOriginalPrice] = useState('');
            const [newImages, setNewImages] = useState([]);
            const [isUploading, setIsUploading] = useState(false);

            const handleImageUpload = async (e) => {
                const files = Array.from(e.target.files).slice(0, 3 - newImages.length);
                if (files.length === 0) return;
                setIsUploading(true);
                try {
                    const processed = await Promise.all(files.map(f => processImage(f, 600)));
                    setNewImages(prev => [...prev, ...processed.filter(Boolean)]);
                } finally {
                    setIsUploading(false);
                    if (e.target) e.target.value = '';
                }
            };

            const handleEditClick = (item, idx) => {
                setNewTitle(item.title); setNewDesc(item.desc); setNewPrice(item.price); setNewOriginalPrice(item.originalPrice || ''); 
                setNewImages(item.images?.length > 0 ? item.images : (item.img ? [item.img] : []));
                onRemove(idx);
            };

            const handleSave = () => {
                if(newTitle && newImages.length > 0){
                    onAdd({ id: Date.now().toString(), title: newTitle, desc: newDesc, price: newPrice, originalPrice: newOriginalPrice, images: newImages });
                    setNewTitle(''); setNewDesc(''); setNewPrice(''); setNewOriginalPrice(''); setNewImages([]);
                } else {
                    alert("يرجى إدخال اسم البطاقة وإرفاق صورة واحدة على الأقل.");
                }
            };
            
            const handleMoveUp = (idx) => {
                if (idx === 0) return;
                const newItems = [...items];
                [newItems[idx - 1], newItems[idx]] = [newItems[idx], newItems[idx - 1]];
                if(onUpdateAll) onUpdateAll(newItems);
            };

            const handleMoveDown = (idx) => {
                if (idx === items.length - 1) return;
                const newItems = [...items];
                [newItems[idx], newItems[idx + 1]] = [newItems[idx + 1], newItems[idx]];
                if(onUpdateAll) onUpdateAll(newItems);
            };

            return (
              <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                <h3 className="font-bold text-slate-100 mb-4 border-b border-slate-800 pb-2">{title} <span className="text-yellow-400 text-xs bg-yellow-900/30 px-2 py-1 rounded">(يتم عرض أول 4 فقط للعملاء)</span></h3>
                <div className="flex flex-col gap-3 mb-5 bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input type="text" value={newTitle} onChange={e=>setNewTitle(e.target.value)} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg outline-none focus:border-yellow-500 text-sm" placeholder="اسم البطاقة..."/>
                        <input type="text" value={newPrice} onChange={e=>setNewPrice(e.target.value)} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg outline-none focus:border-yellow-500 text-sm" placeholder="السعر (مثال: 100 ج.م)..."/>
                        <input type="text" value={newOriginalPrice} onChange={e=>setNewOriginalPrice(e.target.value)} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg outline-none focus:border-yellow-500 text-sm" placeholder="السعر قبل الخصم (اختياري)..."/>
                    </div>
                    <input type="text" value={newDesc} onChange={e=>setNewDesc(e.target.value)} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg outline-none focus:border-yellow-500 text-sm" placeholder="وصف قصير..."/>
                    <div className="flex items-center gap-4 mt-2 flex-wrap">
                        {newImages.map((img, i) => (
                            <div key={i} className="relative w-16 h-16 rounded border border-slate-600 group">
                                <img src={img} className="w-full h-full object-cover rounded" />
                                <button onClick={() => setNewImages(newImages.filter((_, idx) => idx !== i))} className="absolute inset-0 bg-red-900/70 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity rounded"><i className="ph ph-trash"></i></button>
                            </div>
                        ))}
                        {newImages.length < 3 && (
                            <label className="w-16 h-16 flex items-center justify-center border border-dashed border-slate-600 rounded-lg cursor-pointer hover:border-yellow-500 hover:text-yellow-500 text-slate-500 transition-colors bg-slate-900 shrink-0" title="إضافة صورة (حتى 3 صور)">
                                {isUploading ? <i className="ph ph-spinner animate-spin text-xl"></i> : <i className="ph ph-plus text-xl"></i>}
                                <input type="file" accept="image/*" multiple className="hidden" onChange={handleImageUpload} disabled={isUploading} />
                            </label>
                        )}
                    </div>
                    <button onClick={handleSave} className="w-full bg-yellow-600 hover:bg-yellow-500 text-slate-900 font-black py-3 rounded-lg transition-colors flex items-center justify-center gap-2 mt-2 shadow-lg"><i className="ph-bold ph-plus"></i> إضافة للبطاقات</button>
                </div>
                <div className="flex flex-col gap-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2">
                    {items.map((item, idx) => {
                        const imgs = item.images?.length > 0 ? item.images : (item.img ? [item.img] : []);
                        return (
                        <div key={idx} className="p-3 bg-slate-800 rounded-xl flex items-center gap-4 border border-slate-700 group hover:border-yellow-500/50 transition-colors">
                            <span className="font-bold text-slate-500 text-xs w-4">{idx + 1}.</span>
                            {imgs.length > 0 && <img src={imgs[0]} className="w-16 h-16 rounded-lg object-cover shadow-sm" />}
                            <div className="flex-1">
                                <div className="font-bold text-slate-200">{item.title}</div>
                                <div className="text-xs text-slate-400 mt-1">{item.desc}</div>
                                <div className="flex items-center gap-2 mt-1">
                                    <span className="text-xs text-yellow-400 font-bold bg-yellow-900/20 px-2 py-0.5 rounded inline-block">{item.price}</span>
                                    {item.originalPrice && <span className="text-[10px] text-slate-400 line-through">{item.originalPrice}</span>}
                                </div>
                            </div>
                            <div className="flex flex-col gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                <div className="flex gap-1">
                                    <button onClick={()=>handleMoveUp(idx)} disabled={idx===0} className="text-slate-300 bg-slate-700 hover:bg-slate-600 p-1.5 rounded-lg transition-colors disabled:opacity-50"><i className="ph ph-arrow-up text-sm"></i></button>
                                    <button onClick={()=>handleMoveDown(idx)} disabled={idx===items.length-1} className="text-slate-300 bg-slate-700 hover:bg-slate-600 p-1.5 rounded-lg transition-colors disabled:opacity-50"><i className="ph ph-arrow-down text-sm"></i></button>
                                </div>
                                <div className="flex gap-1">
                                    <button onClick={()=>handleEditClick(item, idx)} className="text-blue-400 bg-slate-700 hover:bg-slate-600 p-1.5 rounded-lg transition-colors flex-1"><i className="ph ph-pencil-simple text-sm"></i></button>
                                    <button onClick={()=>onRemove(idx)} className="text-red-400 bg-slate-700 hover:bg-slate-600 p-1.5 rounded-lg transition-colors flex-1"><i className="ph ph-trash text-sm"></i></button>
                                </div>
                            </div>
                        </div>
                    )})}
                    {items.length === 0 && <p className="text-center text-slate-500 py-4 text-sm">لا توجد بطاقات مضافة.</p>}
                </div>
              </div>
            );
        };

        const ProductsSettingsList = ({title, items, inventory, onAdd, onRemove, updateInventoryExact}) => {
            const [newName, setNewName] = useState(''); const [newPrice, setNewPrice] = useState(''); const [newWholesale, setNewWholesale] = useState(''); const [newTotalQty, setNewTotalQty] = useState(''); const [newDesc, setNewDesc] = useState('');
            const handleEditClick = (item, idx) => { const obj = typeof item === 'string' ? {name: item, price: 0, wholesalePrice: 0, totalQty: 0, desc: ''} : item; setNewName(obj.name); setNewPrice(obj.price); setNewWholesale(obj.wholesalePrice || ''); setNewTotalQty(obj.totalQty || ''); setNewDesc(obj.desc); onRemove(idx); };
            const handleSave = () => { if(newName){ const tQty = parseInt(newTotalQty) || 0; onAdd({ name: newName, price: parseFloat(newPrice) || 0, wholesalePrice: parseFloat(newWholesale) || 0, totalQty: tQty, desc: newDesc }); if (inventory[newName] === undefined) { updateInventoryExact(newName, tQty); } setNewName(''); setNewPrice(''); setNewWholesale(''); setNewTotalQty(''); setNewDesc(''); } };
            return (
              <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                <h3 className="font-bold text-slate-100 mb-4 border-b border-slate-800 pb-2">{title}</h3>
                <div className="flex flex-col gap-3 mb-5">
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    <input type="text" value={newName} onChange={e=>setNewName(e.target.value)} className="sm:col-span-1 p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none focus:border-purple-500 placeholder-slate-500 text-sm" placeholder="اسم المنتج..."/>
                    <input type="number" value={newPrice} onChange={e=>setNewPrice(e.target.value)} className="p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none focus:border-purple-500 placeholder-slate-500 text-sm" placeholder="سعر البيع..."/>
                    <input type="number" value={newWholesale} onChange={e=>setNewWholesale(e.target.value)} className="p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none focus:border-purple-500 placeholder-slate-500 text-sm" placeholder="سعر الجملة..."/>
                    <input type="number" value={newTotalQty} onChange={e=>setNewTotalQty(e.target.value)} className="p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none focus:border-purple-500 placeholder-slate-500 text-sm" placeholder="العدد الكلي..."/>
                  </div>
                  <div className="flex gap-2">
                    <input type="text" value={newDesc} onChange={e=>setNewDesc(e.target.value)} className="flex-1 p-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none focus:border-purple-500 placeholder-slate-500 text-sm" placeholder="تفاصيل وملاحظات (اختياري)..."/>
                    <button onClick={handleSave} className="bg-purple-600 hover:bg-purple-500 text-white px-5 rounded-lg transition-colors flex items-center justify-center"><i className="ph ph-plus text-xl"></i></button>
                  </div>
                </div>
                <div className="flex flex-col gap-3 overflow-y-auto max-h-[400px] custom-scrollbar pr-2">
                  {items.map((item, idx) => {
                    const prod = typeof item === 'string' ? {name: item, price: 0, wholesalePrice: 0, totalQty: 0, desc: ''} : item;
                    return (
                    <div key={idx} className="bg-slate-800 p-4 rounded-xl flex flex-col gap-3 border border-slate-700 relative group hover:border-purple-500/50 transition-colors">
                      <div className="flex justify-between items-start">

        const PromoSelector = ({ settings, selectedPromos, onChange }) => {

        const PaymentModal = ({ payModal, setPayModal, db }) => {

              const method = e.target.paymentMethod.value;
              const pDate = e.target.paymentDate.value ? new Date(e.target.paymentDate.value).toISOString() : new Date().toISOString();
              const newPayment = { amount, method: method, date: pDate };
              const updated = { ...payModal, paid: payModal.paid + amount, electronicPaid: (payModal.electronicPaid || 0) + (method === 'electronic' ? amount : 0), remaining: payModal.total - (payModal.paid + amount), payments: [...(payModal.payments || []), newPayment] };
              if (updated.pendingReceipt && method === 'electronic') { updated.confirmedReceipts = [...(updated.confirmedReceipts || []), updated.pendingReceipt]; }
              if (updated.pendingReceipt) delete updated.pendingReceipt;
              delete updated.paymentType;
              const targetCol = updated.type === 'wedding' ? 'weddings' : 'transactions';
              const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';

                  </div>
                  <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                        <label className="text-slate-400 text-xs font-bold block mb-1">المبلغ المراد تحصيله (ج.م)</label>

                    </div>

        const TransactionCard = ({ txn, onDelete, onEdit, onPayRemaining, onViewReceipt, sendInvoice, updateStatus, onViewHistory, settings, allRecords, db }) => {
            const [showWaMenu, setShowWaMenu] = useState(false);
            const waMenuRef = useRef(null);
            useEffect(() => {
                if (!showWaMenu) return;
                const closeMenuOnOutside = (event) => {
                    if (waMenuRef.current && !waMenuRef.current.contains(event.target)) setShowWaMenu(false);
                };
                document.addEventListener('mousedown', closeMenuOnOutside);
                document.addEventListener('touchstart', closeMenuOnOutside, { passive: true });
                return () => {
                    document.removeEventListener('mousedown', closeMenuOnOutside);
                    document.removeEventListener('touchstart', closeMenuOnOutside);
                };
            }, [showWaMenu]);
            const [showDetails, setShowDetails] = useState(false);
            const [showPhotoDetails, setShowPhotoDetails] = useState(false);
            const [confirmDelete, setConfirmDelete] = useState(false);
            const [actionError, setActionError] = useState('');
            const [showPhotosLinkInput, setShowPhotosLinkInput] = useState(false);
            const [photosLinkDraft, setPhotosLinkDraft] = useState(txn.photosLink || '');
            
            const currentStatus = txn.status || 0;
            const cashPaid = (txn.paid || 0) - (txn.electronicPaid || 0);
            const isWedding = txn.type === 'wedding';
            const instantPrintText = [
                txn.requirements, txn.details, txn.serviceType, txn.service, txn.services,
                ...(Array.isArray(txn.photoNo) ? txn.photoNo.flatMap(photo => typeof photo === 'object' ? [photo.serviceType, photo.service, photo.note, photo.name] : [photo]) : [txn.photoNo]),
                ...(Array.isArray(txn.soldProducts) ? txn.soldProducts.flatMap(product => typeof product === 'object' ? [product.name, product.serviceType, product.service] : [product]) : []),
                ...(Array.isArray(txn.extraServices) ? txn.extraServices.flatMap(service => typeof service === 'object' ? [service.name, service.serviceType] : [service]) : [])
            ].flat().filter(Boolean).join(' ').toLocaleLowerCase('ar-EG');
            const hasInstantPrint = !isWedding && (
                txn.pickupOption === 'instant' ||
                /فور[ىي]|فوري[ةه]|instant/i.test(String(txn.pickupOption || '')) ||
                /فور[ىي]|فوراً|فوري[ةه]|طباعة\s*فورية|instant\s*print/i.test(instantPrintText)
            );
            const displayName = isWedding ? `${txn.groomName || ''} و ${txn.brideName || ''}`.trim() : txn.clientName;
            const clientTrackingUrl = `${window.location.origin}${window.location.pathname}?phone=${encodeURIComponent(txn.phone || '')}&receipt=${encodeURIComponent(txn.receiptNo || '')}&type=${isWedding ? 'w' : 't'}`;
            const canSendPrintReview = Boolean(txn.phone && txn.writeNameOnPhoto && String(txn.photoName || '').trim() && String(txn.nationalId || '').trim() && String(txn.branch || '').trim());
            const buildPrintReviewMessage = () => {
                const reviewTemplate = settings.waTemplates?.printReview || DEFAULT_WA_TEMPLATES.printReview;
                return reviewTemplate
                    .replace(/{name}/g, displayName || 'العميل العزيز')
                    .replace(/{studio}/g, settings.studioName || 'ستوديو المراكبي')
                    .replace(/{photo_name}/g, txn.photoName || txn.clientName || '—')
                    .replace(/{national_id}/g, txn.nationalId || '—')
                    .replace(/{branch}/g, txn.branch || '—')
                    .replace(/{receipt}/g, txn.receiptNo || '—')
                    .replace(/{track_url}/g, clientTrackingUrl)
                    .replace(/{receipt_url}/g, clientTrackingUrl);
            };

                  <div ref={waMenuRef} className="relative w-full">

                    {showWaMenu && (

                        {txn.photosLink && <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, `أهلاً ${displayName} 👋\nصورك جاهزة للتحميل بجودة عالية! يمكنك تحميلها وحفظها من هذا الرابط:\n${txn.photosLink}`); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-green-400 hover:bg-slate-700 font-bold border-b border-slate-700 flex items-center gap-2"><i className="ph ph-download-simple"></i> إرسال رابط الصور</button>}
                        {isRepeat && <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('vipDiscount', txn, settings, isWedding, allRecords)); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-pink-400 hover:bg-slate-700 font-bold">🎁 إرسال هدية خصم (VIP)</button>}
                        {isRepeat ? <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('welcomeBack', txn, settings, isWedding, allRecords)); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-yellow-400 hover:bg-slate-700 font-bold">🌟 ترحيب بالعودة</button> : <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('welcome', txn, settings, isWedding, allRecords)); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-slate-200 hover:bg-slate-700">👋 رسالة ترحيب</button>}
                        <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('ready', txn, settings, isWedding, allRecords)); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-slate-200 hover:bg-slate-700">🎉 الشغل خلص</button>
                        <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('reminder', txn, settings, isWedding, allRecords)); setShowWaMenu(false);}} className="text-right px-3 py-2 text-sm text-slate-200 hover:bg-slate-700">⚠️ تذكير بالباقي</button>
