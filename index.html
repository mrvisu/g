                    const gain = ctx.createGain();
                    gain.gain.setValueAtTime(0.0001, ctx.currentTime);

            const date = dateOnly ? new Date(`${dateOnly[1]}-${dateOnly[2]}-${dateOnly[3]}T12:00:00`) : new Date(value);

        };

            if (!value) return '';

            if (timeOnly) {

                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let scaleSize = 1;
                        if (img.width > maxWidth) scaleSize = maxWidth / img.width;
                        canvas.width = img.width * scaleSize;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = () => resolve(null);

                // القوالب القديمة المحفوظة لا تحتوي على placeholder الجديد؛ نضيف القسم تلقائيًا لرسائل السداد.
                let renderTemplate = template;
                // لا نضيف أي نص خارج القالب الذي يحرره صاحب الاستوديو؛ الرابط يظهر فقط إذا وضعه القالب عبر {receipt_url} أو {track_url}.
                const paymentLink = receiptUrl;
                const portalDescription = `🌟 *وصف الرابط — بوابة العميل*\nيفتح الرابط صفحة الإيصال الخاصة بك لعرض تفاصيل الطلب، مراحل التنفيذ، إجمالي الحساب والمدفوع والمتبقي وموعد الاستلام، مع أحدث صور الإعلانات والعروض ووصف خدمات الاستوديو بشكل مختصر.`;
                const receiptLinkDescription = `🔗 *رابط الإيصال والمتابعة والسداد*\nافتح الرابط لمراجعة إيصالك وتأكيد بيانات الطباعة وسداد المتبقي إلكترونيًا عند توفره:\n${receiptUrl}`;
                const portalBlock = `🧾 إجمالي الحساب: *${formatCurrency(txn.total)}*\n✅ المدفوع: *${formatCurrency(txn.paid)}*\n${remaining > 0 ? `💳 المتبقي: *${formatCurrency(remaining)}*` : '🎉 الحالة: *تم سداد الحساب بالكامل*'}\n\n${portalDescription}\n\n${receiptLinkDescription}\n\n📲 يسعدنا خدمتك دائمًا في {studio}`;
                const depositWarningTemplate = settings.waTemplates?.depositWarning || DEFAULT_WA_TEMPLATES.depositWarning;
                const depositWarning = depositWarningTemplate
                    .replace(/{name}/g, clientName || 'العميل')
                    .replace(/{receipt}/g, txn.receiptNo || '')
                    .replace(/{remaining}/g, remaining)
                    .replace(/{studio}/g, settings.studioName || 'الاستوديو')
                    .replace(/{receipt_url}/g, receiptUrl);
                const selectedPromotions = (Array.isArray(settings.promotions) ? settings.promotions : [])
                    .filter(promo => Array.isArray(txn.selectedPromos) && txn.selectedPromos.includes(promo.id));
                const promotionsBlock = selectedPromotions.length
                    ? `\n🎁 *عروضك المخصصة*\n${selectedPromotions.map((promo, index) => `${index + 1}) ${safe(promo.title, 'عرض خاص')}${safe(promo.shortDesc) ? ` — ${safe(promo.shortDesc)}` : ''}${safe(promo.fullDesc) ? `\n   ${safe(promo.fullDesc)}` : ''}${safe(promo.discount) ? `\n   القيمة: ${safe(promo.discount)}` : ''}`).join('\n')}\n`
                    : '';
                const detailsContent = `${detailsBlock}${photoBlock}`;
                return renderTemplate
                    .replace(/{payment_link}/g, paymentLink)
                    .replace(/{deposit_warning}/g, depositWarning)
                    .replace(/{total}/g, txn.total || 0)
                    .replace(/{paid}/g, txn.paid || 0)
                    .replace(/{remaining}/g, remaining)
                    .replace(/{name}/g, clientName || 'العميل')
                    .replace(/{receipt}/g, txn.receiptNo || '')
                    .replace(/{date}/g, formatDateTimeEnglish(txn.dateTime) || 'غير محدد')
                    .replace(/{phone_line}/g, phoneLine)
                    .replace(/{pickup_line}/g, pickupLine)
                    .replace(/{details_block}/g, detailsContent)
                    .replace(/{identity_block}/g, identityBlock)
                    .replace(/{promotions_block}/g, promotionsBlock)
                    .replace(/{account_summary}/g, accountSummary)
                    .replace(/{identity_note}/g, identityNote)
                    .replace(/{receipt_url}/g, receiptUrl)
                    .replace(/{portal_description}/g, portalDescription)
                    .replace(/{portal_block}/g, portalBlock.replace(/{studio}/g, settings.studioName || 'الاستوديو'))
                    .replace(/{studio}/g, settings.studioName || 'الاستوديو');
            }

            let msg = settings.waTemplates[templateKey] || '';
            let reqs = '';
            if (isWedding) {
                const pkgs = txn.packages?.length > 0 ? txn.packages.map(p=>p.name).join(' + ') : (txn.package ? txn.package.name : 'بدون باقة محددة');
                reqs = [`📦 الباقات: ${pkgs}`, `📸 نوع السيشن: ${safe(txn.sessionType, 'غير محدد')}`, txn.weddingDate ? `📅 موعد الزفاف: ${formatDateOnly(txn.weddingDate)}` : '', txn.requirements ? `📝 تفاصيل إضافية: ${txn.requirements.trim()}` : ''].filter(Boolean).join('\n');
            } else reqs = safe(txn.requirements, 'خدمات تصوير');
            return msg.replace(/{name}/g, clientName || 'العميل').replace(/{receipt}/g, txn.receiptNo || '').replace(/{national_id}/g, txn.nationalId || 'غير مسجل').replace(/{total}/g, txn.total || 0).replace(/{paid}/g, txn.paid || 0).replace(/{remaining}/g, txn.remaining || 0).replace(/{services}/g, reqs).replace(/{studio}/g, settings.studioName || 'الاستوديو').replace(/{date}/g, formatDateOnly(txn.dateTime)).replace(/{time}/g, formatTimeOnly(txn.dateTime)).replace(/{pickup_date}/g, txn.pickupDate ? formatDateOnly(txn.pickupDate) : 'سيتم تحديده مع الاستوديو').replace(/{reward_balance}/g, rewards.balance).replace(/{track_url}/g, receiptUrl);
        };

        const normalizeWhatsAppText = (value) => String(value ?? '')
            .normalize('NFC')
            .replace(/\r\n?/g, '\n');

        // Put the clean portal URL first: WhatsApp uses the first URL for the rich preview.
        // Its OG metadata contains the studio advertisement image and the short program description.
        const ensurePortalPreviewLink = (message) => normalizeWhatsAppText(message);

        const buildWhatsAppUrl = (phone, message) => {
            // Normalize Arabic-Indic digits as well as the usual Egyptian format.
            let formattedPhone = normalizeCustomerPhone(phone);
            if (formattedPhone.startsWith('+')) formattedPhone = formattedPhone.slice(1);
            if (formattedPhone.startsWith('0')) formattedPhone = '2' + formattedPhone;
            else if (!formattedPhone.startsWith('2')) formattedPhone = '20' + formattedPhone;
            const normalizedMessage = ensurePortalPreviewLink(message);
            // Encode the complete message exactly once. WhatsApp decodes this query value.
            // فتح WhatsApp Web مباشرة يتجنب تحويل wa.me الوسيط الذي قد يسلم النص
            // إلى تطبيق سطح المكتب بترميز مختلف على بعض إصدارات Windows.
            return `https://web.whatsapp.com/send?phone=${formattedPhone}&text=${encodeURIComponent(normalizedMessage)}`;
        };

        // نافذة واحدة لكل رسائل الاستوديو؛ الضغط المتكرر يعيد استخدام نفس نافذة واتساب.
        const WHATSAPP_WINDOW_NAME = 'mrakby_whatsapp_web';
        let whatsappWindow = null;

        const openWhatsApp = (phone, msg) => {
            const normalizedPhone = normalizeCustomerPhone(phone);
            if (!normalizedPhone || normalizedPhone.length < 10) {
                alert('لا يمكن إرسال الفاتورة: رقم هاتف العميل غير مسجل أو غير صحيح. يرجى تعديل بيانات العميل أولاً.');
                return false;
            }
            try {
                const whatsappUrl = buildWhatsAppUrl(normalizedPhone, msg);
                // الاسم الثابت يجعل window.open يعيد استخدام نفس التبويب الذي فتحه التطبيق.
                whatsappWindow = window.open(whatsappUrl, WHATSAPP_WINDOW_NAME);
                if (whatsappWindow && !whatsappWindow.closed) {
                    whatsappWindow.focus();
                } else {
                    // إذا منع المتصفح النوافذ المنبثقة، افتح الرابط الحالي بدل إنشاء تبويب جديد.
                    window.location.assign(whatsappUrl);
                }
                return true;
            } catch (error) {
                console.error('تعذر فتح واتساب:', error);
                alert('تعذر فتح واتساب تلقائيًا. سيتم فتح الرابط في نفس النافذة.');
                window.location.assign(buildWhatsAppUrl(normalizedPhone, msg));
                return false;
            }
        };

        const addToCalendar = (txn) => {
            if (!txn.weddingDate) return false;
            let description = `✨ تفاصيل حجز الزفاف ✨\n──────────────────\n`;
            if (txn.groomName || txn.brideName) description += `🤵👰 العروسين: ${txn.groomName || ''} و ${txn.brideName || ''}\n`.trim();
            if (txn.phone) description += `📱 الهاتف: ${txn.phone}\n`;
            if (txn.location) description += `📍 اللوكيشن/القاعة: ${txn.location}\n`;
            if (txn.groomAddress) description += `🏠 عنوان العريس: ${txn.groomAddress}\n\n⏰ المواعيد والترتيبات\n──────────────────\n`;
            if (txn.makeupArtist) description += `💄 الميك أب: ${txn.makeupArtist}\n`;
            if (txn.leaveTime) description += `🚗 وقت الخروج: ${txn.leaveTime}\n`;
            if (txn.sessionType) description += `📸 نوع السيشن: ${txn.sessionType}\n`;
            if (txn.casualShootDate) description += `👕 تصوير الكاجوال: ${txn.casualShootDate}\n`;

            let pkgs = txn.packages?.length > 0 ? txn.packages.map(p => p.name).join(' + ') : (txn.package ? txn.package.name : '');
            let addonsText = txn.addons?.length > 0 ? txn.addons.map(a => a.name).join(' + ') : '';

            if (pkgs || addonsText) {
                description += `\n💼 الباقات والإضافات\n──────────────────\n`;
                if (pkgs) description += `📦 الباقات: ${pkgs}\n`;
                if (addonsText) description += `➕ إضافات: ${addonsText}\n`;
            }
            
            description += `\n💰 الحسابات\n──────────────────\n💵 الإجمالي: ${txn.total} ج.م\n✅ المدفوع: ${txn.paid} ج.م\n🔴 الباقي: ${txn.remaining} ج.م\n`;
            description += `\n🔗 رابط تتبع العميل:\n${window.location.href.split('?')[0]}?phone=${encodeURIComponent(txn.phone)}&receipt=${encodeURIComponent(txn.receiptNo)}&type=w`;

            let startStr = '', endStr = '';
            if (txn.leaveTime) {
                const startDate = new Date(`${txn.weddingDate}T${txn.leaveTime}`);
                const endDate = new Date(startDate.getTime() + 5 * 60 * 60 * 1000); 
                const f = (date) => date.getFullYear() + String(date.getMonth() + 1).padStart(2, '0') + String(date.getDate()).padStart(2, '0') + 'T' + String(date.getHours()).padStart(2, '0') + String(date.getMinutes()).padStart(2, '0') + '00';
                startStr = f(startDate); endStr = f(endDate);
            } else {
                startStr = txn.weddingDate.replace(/-/g, '');
                const nextDay = new Date(txn.weddingDate); nextDay.setDate(nextDay.getDate() + 1);
                endStr = nextDay.getFullYear() + String(nextDay.getMonth() + 1).padStart(2, '0') + String(nextDay.getDate()).padStart(2, '0');
            }

            const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`حجز زفاف: ${txn.groomName || ''} و ${txn.brideName || ''}`.trim() || 'حجز زفاف جديد')}&dates=${startStr}/${endStr}&details=${encodeURIComponent(description)}&location=${encodeURIComponent(txn.location || '')}`;
            window.open(url, '_blank');
            return true;
        };

        const getTransactionStatuses = (txn) => {
            if (txn.type !== 'wedding') return ORDER_STATUSES;
            return WEDDING_STATUSES.filter(s => {
                if (s.id === 1 && !txn.casualShootDate) return false;
                if (s.id === 2 && !(txn.addons && txn.addons.some(a => a.name.includes('حنة') || a.name.includes('حنه')))) return false;
                return true;
            });
        };

        // الطباعة الفورية لا تُستنتج من نصوص الخدمات؛ لا تدخل الإحصائيات إلا إذا سجّلها الموظف صراحة.
        const isInstantPrintLabel = (value) => /فور[ىي]|فوري[ةه]|instant\s*print/i.test(String(value || ''));
        const getExplicitInstantPrintItems = (txn) => {
            const items = Array.isArray(txn?.instantPrintItems) ? txn.instantPrintItems : [];
            const explicit = items.map(item => ({
                name: String(item?.name || 'طباعة فورية'),
                qty: Math.max(1, Number(item?.qty || item?.quantity || 1)),
                unitPrice: Math.max(0, Number(item?.unitPrice ?? item?.price ?? 0) || 0)
            })).filter(item => item.qty > 0);
            if (explicit.length) return explicit;
            // توافق مع الإيصالات القديمة: نقرأ فقط صفوف الصور التي تحمل خدمة فورية، ولا نعد الصور العادية.
            const rows = Array.isArray(txn?.photoNo) ? txn.photoNo : [];
            const legacy = rows.filter(row => isInstantPrintLabel(typeof row === 'object' ? (row.serviceType || row.service) : row)).map(row => {
                const name = String(typeof row === 'object' ? (row.serviceType || row.service || 'طباعة فورية') : row);
                const match = name.match(/^\s*(\d+)\s*[×x]\s*(.+)$/i);
                return { name: (match ? match[2] : name).trim(), qty: Math.max(1, Number(typeof row === 'object' ? row.instantQty || row.qty || 1 : 1) * (match ? Number(match[1]) : 1)), unitPrice: Math.max(0, Number(typeof row === 'object' ? row.instantPrice || row.unitPrice || 0 : 0) || 0) };
            });
            if (legacy.length) return legacy;
            return txn?.pickupOption === 'instant' ? [{ name: 'طباعة فورية', qty: 1, unitPrice: 0 }] : [];
        };
        const getLocalDateKey = (date = new Date()) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        const getInstantStatsStartDate = (settings) => {
            const configured = String(settings?.instantStatsStartDate || '');
            return /^\d{4}-\d{2}-\d{2}$/.test(configured) ? configured : getLocalDateKey();
        };
        const isInstantStatsRecordIncluded = (record, settings) => {
            const rawDate = String(record?.dateTime || record?.createdAt || record?.date || '');
            const dateOnly = rawDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            const date = dateOnly ? new Date(Number(dateOnly[1]), Number(dateOnly[2]) - 1, Number(dateOnly[3])) : new Date(rawDate);
            return !Number.isNaN(date.getTime()) && getLocalDateKey(date) >= getInstantStatsStartDate(settings);
        };
        const getRecordDisplayName = (record) => record?.type === 'wedding'
            ? `${record.groomName || ''} و ${record.brideName || ''}`.trim()
            : (record?.clientName || 'عميل');

        const calculatePeriodRevenue = (records, targetDateObj, period = 'day') => {
            let total = 0, cash = 0, electronic = 0;
            records.forEach(rec => {
                if (rec.payments?.length > 0) {
                    rec.payments.forEach(p => {
                        const pDate = new Date(p.date);
                        if ((period === 'day' && pDate.toDateString() === targetDateObj.toDateString()) || (period === 'month' && pDate.getMonth() === targetDateObj.getMonth() && pDate.getFullYear() === targetDateObj.getFullYear())) {
                            total += p.amount;
                            if (p.method === 'electronic') electronic += p.amount; else cash += p.amount;
                        }
                    });
                } else {
                    const rDate = new Date(rec.dateTime);
                    if ((period === 'day' && rDate.toDateString() === targetDateObj.toDateString()) || (period === 'month' && rDate.getMonth() === targetDateObj.getMonth() && rDate.getFullYear() === targetDateObj.getFullYear())) {
                        const recTotalPaid = parseFloat(rec.paid) || 0;
                        const recElecPaid = parseFloat(rec.electronicPaid) || 0;
                        total += recTotalPaid; electronic += recElecPaid; cash += (recTotalPaid - recElecPaid);
                    }
                }
            });
            return { total, cash, electronic };
        };

        const requestNotificationPermission = () => { if (Notification.permission !== "granted" && Notification.permission !== "denied") Notification.requestPermission(); };
        const showBrowserNotification = (title, body) => {
            if (Notification.permission === "granted") new Notification(title, { body: body, icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23eab308"%3E%3Cpath d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/%3E%3C/svg%3E' });
        };

        // --- UI Components ---
        
        const MiniProductCard = ({ prod, onClick, spanTwo }) => {
            const [imgIdx, setImgIdx] = useState(0);
            const images = prod.images?.length > 0 ? prod.images : (prod.img ? [prod.img] : []);
            
            useEffect(() => {
                if (images.length <= 1) return;
                const timer = setInterval(() => {
                    setImgIdx(prev => (prev + 1) % images.length);
                }, 7000);
                return () => clearInterval(timer);
            }, [images.length]);

            return (
                <div onClick={() => onClick(prod)} className="group relative bg-slate-900/80 backdrop-blur-md rounded-2xl sm:rounded-3xl border border-slate-700/50 hover:border-yellow-500/50 transition-all duration-500 overflow-hidden cursor-pointer flex flex-col hover:shadow-[0_8px_30px_rgba(234,179,8,0.15)] hover:-translate-y-1 h-full">
                    {/* Image Section */}
                    <div className={`relative ${spanTwo ? 'h-40 sm:h-56' : 'h-28 sm:h-40'} w-full overflow-hidden bg-slate-950 shrink-0`}>
                        {images.map((img, i) => (
                            <img key={i} src={img} className={`absolute inset-0 w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110 ${i === imgIdx ? 'opacity-100 z-10' : 'opacity-0 z-0'}`} alt={prod.title} />
                        ))}
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent z-20"></div>
                        {prod.originalPrice && (
                            <div className="absolute top-2 left-2 z-30 bg-rose-500/90 backdrop-blur-md text-white px-2 py-0.5 rounded-lg text-[10px] sm:text-xs font-bold line-through shadow-sm border border-rose-400/30">
                                {prod.originalPrice}
                            </div>
                        )}
                    </div>

                    {/* Content Section */}
                    <div className="p-3 sm:p-4 flex flex-col flex-1 relative z-20">
                        <div className="absolute -top-4 sm:-top-5 right-3 sm:right-4 z-30 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 px-3 sm:px-4 py-1 sm:py-1.5 rounded-xl font-black text-xs sm:text-sm shadow-lg border border-yellow-200/50 flex items-center gap-1.5 transition-transform group-hover:scale-105">
                            <i className="ph-fill ph-tag"></i>
                            {prod.price}
                        </div>
                        <h3 className="text-white text-sm sm:text-base font-black leading-tight mt-1 sm:mt-1 mb-1 line-clamp-1 group-hover:text-yellow-400 transition-colors">{prod.title}</h3>
                        <p className="text-slate-400 text-[10px] sm:text-xs font-bold line-clamp-2 w-full leading-relaxed">{prod.desc}</p>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ validPassword, onLogin, navigateTo }) => {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (password === validPassword) onLogin(); else setError('كلمة المرور غير صحيحة');
            };
            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center text-slate-100 p-4">
                    <div className="bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-sm text-center relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-full h-1 bg-gradient-to-r from-yellow-500 to-yellow-300"></div>
                        <div className="w-20 h-20 bg-yellow-500/20 text-yellow-500 rounded-full flex items-center justify-center mx-auto mb-6 border border-yellow-500/30 shadow-lg shadow-yellow-900/20"><i className="ph-fill ph-lock-key text-4xl"></i></div>
                        <h2 className="text-2xl font-black mb-2 text-white">نظام الإدارة والتتبع</h2>
                        <p className="text-slate-400 text-sm mb-8">الرجاء إدخال كلمة المرور للمتابعة</p>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <input type="password" value={password} onChange={(e) => { setPassword(e.target.value); setError(''); }} placeholder="كلمة المرور..." className="w-full p-4 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-yellow-500 outline-none text-center font-black tracking-widest text-xl shadow-inner transition-colors" autoFocus />
                                {error && <p className="text-red-400 text-xs font-bold mt-3 bg-red-950/40 p-2 rounded-lg border border-red-900/50 flex items-center justify-center gap-1"><i className="ph ph-warning-circle text-base"></i> {error}</p>}
                            </div>
                            <button type="submit" className="w-full bg-gradient-to-l from-yellow-600 to-yellow-500 hover:from-yellow-500 hover:to-yellow-400 text-slate-900 font-black py-4 rounded-xl shadow-lg shadow-yellow-900/20 transition-all text-lg flex justify-center items-center gap-2"><i className="ph-bold ph-sign-in text-xl"></i> تسجيل الدخول</button>
                        </form>
                        <div className="mt-6 pt-6 border-t border-slate-800">
                            <p className="text-slate-500 text-xs mb-3">هل أنت عميل تبحث عن طلبك أو عروضنا؟</p>
                            <a href="?client=true" onClick={(e) => { e.preventDefault(); navigateTo('?client=true'); }} className="w-full bg-slate-800 hover:bg-slate-700 text-blue-400 font-bold py-3 rounded-xl transition-all text-sm flex justify-center items-center gap-2 border border-slate-700"><i className="ph-fill ph-user"></i> دخول بوابة العملاء</a>
                        </div>
                    </div>
                </div>
            );
        };

        const ClientPortalScreen = ({ db, settings, transactions, weddings, appointments, uniqueCustomersCount, recordsLoaded, settingsLoaded, settingsLoadError, studioLikes, onLikeStudio, navigateTo }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [hasSearched, setHasSearched] = useState(false);
            const [results, setResults] = useState([]);
            const [errorMsg, setErrorMsg] = useState('');
            const [showPhoneInput, setShowPhoneInput] = useState(false);
            const [selectedPromoModal, setSelectedPromoModal] = useState(null);
            const [promoImgIndex, setPromoImgIndex] = useState(0);
            
            const [hasLiked, setHasLiked] = useState(getSafeLocal('studio_liked') === 'true');
            const [selectedMiniProd, setSelectedMiniProd] = useState(null);
            const [miniProdImgIndex, setMiniProdImgIndex] = useState(0);
            const [localVisits, setLocalVisits] = useState(settings.portalVisits || 1);

            // Tab state for the combined Details Card (Stages & Archive)
            const [activeSubTab, setActiveSubTab] = useState('stages');
            
            // Booking Modal State
            const [showBookingModal, setShowBookingModal] = useState(false);
            const [bookingData, setBookingData] = useState({
                clientName: '', name: '', nationalId: '', branch: '', photoName: '', phone: '', details: '', writeName: false, date: '', time: '', paymentMethod: 'cash', paymentType: 'full', depositAmount: '',
                requireFemalePhotographer: false, isFreeSchool: false, extraServices: []
            });
            const [bookingSuccess, setBookingSuccess] = useState(null);
            const [showBookingReview, setShowBookingReview] = useState(false);

            const allRecords = useMemo(() => [...transactions, ...weddings], [transactions, weddings]);
            const reviews = useMemo(() => allRecords.filter(r => r.clientRating > 0).sort((a,b) => new Date(b.dateTime) - new Date(a.dateTime)), [allRecords]);
            const avgRating = useMemo(() => { const rated = reviews.filter(r => Number(r.clientRating) >= 1 && Number(r.clientRating) <= 5); return rated.length ? (rated.reduce((sum, r) => sum + Number(r.clientRating), 0) / rated.length).toFixed(1) : 0; }, [reviews]);

            useEffect(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const view = urlParams.get('view');
                if (view === 'booking') setShowBookingModal(true);
                if (view === 'archive') setShowPhoneInput(true);
                if (view === 'products') setTimeout(() => document.getElementById('customer-products')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 250);
                const cardId = urlParams.get('card');
                const promoId = urlParams.get('promo');
                if (cardId && settings.miniProducts) {
                    const card = settings.miniProducts.find(p => p.id === cardId);
                    if (card) setSelectedMiniProd(card);
                }
                if (promoId && settings.promotions) {
                    const promo = settings.promotions.find(p => p.id === promoId);
                    if (promo) { setSelectedPromoModal(promo); setPromoImgIndex(0); }
                }
            }, [settings.miniProducts, settings.promotions]);

            useEffect(() => {
                if (selectedMiniProd) {
                    document.title = selectedMiniProd.title + " - " + settings.studioName;
                    const img = selectedMiniProd.images?.[0] || selectedMiniProd.img;
                    if (img) {
                        const ogImage = document.querySelector('meta[property="og:image"]');
                        if (ogImage) ogImage.setAttribute('content', img);
                    }
                } else if (selectedPromoModal) {
                    document.title = selectedPromoModal.title + " - " + settings.studioName;
                    const img = selectedPromoModal.images?.[0];
                    if (img) {
                        const ogImage = document.querySelector('meta[property="og:image"]');
                        if (ogImage) ogImage.setAttribute('content', img);
                    }
                } else {
                    document.title = `بوابة العملاء | ${settings.studioName}`;
                }
            }, [selectedMiniProd, selectedPromoModal, settings.studioName]);

            useEffect(() => {
                setLocalVisits(settings.portalVisits || 1);
            }, [settings.portalVisits]);

            useEffect(() => {
                const recordVisit = async () => {
                    if (!db) return;
                    if (getSafeSession('portal_visited')) return;
                    setSafeSession('portal_visited', 'true');
                    try {
                        const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                        await updateDoc(doc(db, `artifacts/${appId}/public/data/settings`, 'main'), {
                            portalVisits: increment(1)
                        });
                        setLocalVisits(prev => prev + 1);
                    } catch (e) {
                        console.error("Error recording visit", e);
                    }
                };
                recordVisit();
            }, [db]);

            useEffect(() => {
                if(selectedMiniProd) {
                     const imgs = selectedMiniProd.images?.length > 0 ? selectedMiniProd.images : (selectedMiniProd.img ? [selectedMiniProd.img] : []);
                     if(imgs.length > 1) {
                         const t = setInterval(() => setMiniProdImgIndex(prev => (prev + 1) % imgs.length), 7000);
                         return () => clearInterval(t);
                     }
                }
            }, [selectedMiniProd]);

            const handleLike = () => {
                if(hasLiked) return;
                setHasLiked(true);
                setSafeLocal('studio_liked', 'true');
                onLikeStudio();
            };

            const handleShare = async () => {
                const shareUrl = window.location.href;
                const shareText = `📸 سجل أجمل لحظاتك مع ${settings.studioName}!\nأحدث عروض التصوير، منتجات حصرية، وأعلى جودة. احجز جلستك الآن واكتشف عالمنا ✨\n\nتصفح العروض من هنا:`;
                
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: settings.studioName,
                            text: shareText,
                            url: shareUrl
                        });
                    } catch (err) {
                        console.log('Share canceled or failed', err);
                    }
                } else {
                    navigator.clipboard.writeText(`${shareText}\n${shareUrl}`);
                    alert("تم نسخ الرابط النص التسويقي بنجاح! يمكنك الآن مشاركته.");
                }
            };

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!recordsLoaded) { setErrorMsg('جارٍ تحميل سجل الزيارات، انتظر لحظات ثم أعد البحث.'); return; }
                const cleanQuery = searchQuery.trim();
                if (!cleanQuery) { setErrorMsg('يرجى إدخال رقم الهاتف المسجل أو رقم الصورة'); return; }
                setErrorMsg('');
                const records = [
                    ...transactions.map(record => ({ ...record, _portalType: 't', _portalDate: record.dateTime || record.createdAt || record.date })),
                    ...weddings.map(record => ({ ...record, _portalType: 'w', _portalDate: record.dateTime || record.createdAt || record.date })),
                    ...(appointments || []).map(record => ({ ...record, _portalType: 't', _portalAppointment: true, _portalDate: record.createdAt || record.dateTime || record.date }))
                ];
                const normalizedPhone = normalizeCustomerPhone(cleanQuery);
                const phoneMatches = records.filter(record => normalizeCustomerPhone(record.phone) === normalizedPhone && normalizedPhone && record.receiptNo);
                phoneMatches.sort((a, b) => new Date(b._portalDate || 0) - new Date(a._portalDate || 0));
                if (phoneMatches.length) {
                    setResults(phoneMatches);
                    setHasSearched(true);
                    return;
                }

                // إبقاء البحث برقم الصورة كخيار مساعد، لا كوسيلة لإثبات هوية العميل.
                const photoMatches = records.filter(record => {
                    if (Array.isArray(record.photoNo)) return record.photoNo.some(photo => String(photo && typeof photo === 'object' ? photo.number || '' : photo) === cleanQuery);
                    return record.photoNo && String(record.photoNo) === cleanQuery;
                });
                photoMatches.sort((a, b) => new Date(b._portalDate || 0) - new Date(a._portalDate || 0));
                setResults(photoMatches);
                setHasSearched(true);
            };

            const handleOpenCard = (prod) => {
                setSelectedMiniProd(prod);
                const newUrl = `${window.location.pathname}?client=true&card=${prod.id}`;
                window.history.pushState({}, '', newUrl);
            };

            const handleCloseCard = () => {
                setSelectedMiniProd(null);
                const newUrl = `${window.location.pathname}?client=true`;
                window.history.pushState({}, '', newUrl);
            };

            const handleClosePromo = () => {
                setSelectedPromoModal(null);
                const newUrl = `${window.location.pathname}?client=true`;
                window.history.pushState({}, '', newUrl);
            };
            
            const handleExtraServiceChange = (srv, action) => {
                let current = [...bookingData.extraServices];
                let existing = current.find(s => s.name === srv.name);
                
                if (action === 'add') {
                    if (existing) existing.qty += 1;
                    else current.push({...srv, qty: 1});
                } else if (action === 'sub') {
                    if (existing) {
                        existing.qty -= 1;
                        if (existing.qty <= 0) current = current.filter(s => s.name !== srv.name);
                    }
                } else if (action === 'toggle') {
                    if (existing) current = current.filter(s => s.name !== srv.name);
                    else current.push({...srv, qty: 1});
                }
                setBookingData({...bookingData, extraServices: current});
            };

            // حاسبة إجمالي السعر المتوقع (تأخذ الكمية في الاعتبار)
            const expectedTotalPrice = useMemo(() => {
                if (bookingData.isFreeSchool) return 0;
                return bookingData.extraServices.reduce((sum, s) => sum + (parseFloat(s.price) || 0) * (s.qty || 1), 0);
            }, [bookingData.extraServices, bookingData.isFreeSchool]);

            const handleBookAppointment = async (e) => {
                e.preventDefault();
                if(!showBookingReview) { setShowBookingReview(true); return; }
                if(!bookingData.clientName || !bookingData.date || !bookingData.time) return;
                if(bookingData.paymentMethod === 'electronic' && bookingData.paymentType === 'deposit' && !(parseFloat(bookingData.depositAmount) > 0)) { alert('يرجى إدخال قيمة العربون المراد تحويله.'); return; }
                if(bookingData.writeName && (!bookingData.name.trim() || !/^\d{14}$/.test(bookingData.nationalId || '') || !bookingData.branch.trim())) { alert('للطباعة على الصورة، يرجى إدخال الاسم بالكامل والرقم القومي المكوّن من 14 رقمًا والشعبة / المسار.'); return; }
                
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                const receiptNo = settings.nextReceiptNo || 1000;
                
                // تحديد المبلغ المدفوع كعربون إذا اختار الدفع الإلكتروني والعربون
                let electronicPaidValue = 0;
                if(bookingData.paymentMethod === 'electronic') {
                    if(bookingData.paymentType === 'deposit') {
                        electronicPaidValue = parseFloat(bookingData.depositAmount) || 0;
                    } else {
                        electronicPaidValue = expectedTotalPrice;
                    }
                }

                const newAppt = {
                    id: Date.now().toString(),
                    receiptNo: receiptNo,
                    clientName: bookingData.clientName,
                    fullName: bookingData.writeName ? bookingData.name.trim() : '',
                    nationalId: bookingData.writeName ? bookingData.nationalId : '',
                    branch: bookingData.writeName ? bookingData.branch.trim() : '',
                    photoName: bookingData.writeName ? bookingData.name.trim() : '',
                    phone: safeCustomerPhone(bookingData.phone),
                    photoType: bookingData.extraServices.map(s => `${s.name} ${s.qty > 1 ? '(x'+s.qty+')' : ''}`).join(' + ') || 'خدمات أخرى',
                    details: bookingData.details,
                    writeName: bookingData.writeName,
                    requireFemalePhotographer: bookingData.requireFemalePhotographer,
                    isFreeSchool: bookingData.isFreeSchool,
                    extraServices: bookingData.extraServices,
                    date: bookingData.date,
                    time: bookingData.time,
                    paymentMethod: bookingData.paymentMethod,
                    paymentType: bookingData.paymentType || 'full',
                    depositAmount: bookingData.paymentType === 'deposit' ? (parseFloat(bookingData.depositAmount) || 0) : 0,
                    requestedPaymentAmount: bookingData.paymentMethod === 'electronic' ? electronicPaidValue : 0,
                    requestedPrice: expectedTotalPrice,
                    price: 0,
                    approvedPrice: 0,
                    electronicPaid: 0,
                    approvedPaid: 0,
                    paymentStatus: 'pending_studio_confirmation',
                    status: 'pending',
                    createdAt: new Date().toISOString()
                };
                
                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/appointments`, newAppt.id), newAppt);
                    await setDoc(doc(db, `artifacts/${appId}/public/data/settings`, 'main'), { nextReceiptNo: increment(1) }, { merge: true });
                    
                    setBookingSuccess(newAppt);
                    setBookingData({ clientName: '', name: '', nationalId: '', branch: '', photoName: '', phone: '', details: '', writeName: false, date: '', time: '', paymentMethod: 'cash', paymentType: 'full', depositAmount: '', requireFemalePhotographer: false, isFreeSchool: false, extraServices: [] });
                } catch(err) {
                    console.error("Booking error:", err);
                }
            };

            const promoColors = {
                yellow: 'from-yellow-900/40 to-slate-900 border-yellow-500/30 text-yellow-400 bg-yellow-500/20',
                pink: 'from-pink-900/40 to-slate-900 border-pink-500/30 text-pink-400 bg-pink-500/20',
                blue: 'from-blue-900/40 to-slate-900 border-blue-500/30 text-blue-400 bg-blue-500/20',
                amber: 'from-amber-900/40 to-slate-900 border-amber-500/30 text-amber-400 bg-amber-500/20'
            };

            const displayMiniProducts = Array.isArray(settings.miniProducts) ? settings.miniProducts.slice(0, 4) : [];

            return (
                <div className="min-h-screen bg-slate-950 flex flex-col items-center py-10 px-4 text-slate-100 pb-20">
                    <div className="w-full max-w-md animate-fadeIn">
                        <div className="bg-gradient-to-br from-slate-900 to-slate-950 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl mb-8 relative overflow-hidden flex flex-col items-center text-center group">
                            <div className="absolute top-0 w-full h-1.5 bg-gradient-to-r from-yellow-400 via-amber-500 to-yellow-600"></div>
                            
                            {/* Logo */}
                            <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-800 shadow-lg mb-4 bg-slate-900 flex items-center justify-center transform group-hover:scale-105 transition-transform duration-500">
                                {settings.studioLogo ? <img src={settings.studioLogo} className="w-full h-full object-cover" alt="Studio Logo" /> : <i className="ph-fill ph-camera text-5xl text-yellow-500"></i>}
                            </div>
                            
                            <h1 className="text-2xl sm:text-3xl font-black text-white mb-2 tracking-wide">{settings.studioName}</h1>
                            <p className="text-slate-400 text-sm leading-relaxed max-w-sm font-bold mb-6">
                                أهلاً بك في مساحتك الخاصة ✨ نحن هنا لتوثيق أجمل لحظاتك وتحويلها إلى ذكريات لا تُنسى.
                            </p>
                            
                            {/* Statistics Row */}
                            <div className="flex justify-center items-center gap-4 sm:gap-6 w-full border-t border-slate-800/80 pt-5 mt-2 bg-slate-950/30 rounded-2xl p-4 shadow-inner">
                                <div className="flex flex-col items-center">
                                    <span className="text-xl sm:text-2xl font-black text-white mb-1">{recordsLoaded ? uniqueCustomersCount : <span className="inline-block w-7 h-5 rounded bg-slate-700 animate-pulse align-middle" aria-label="جاري التحميل"></span>}</span>
                                    <span className="text-[10px] sm:text-xs text-slate-400 font-bold flex items-center gap-1"><i className="ph-fill ph-users"></i> عميل</span>
                                </div>
                                <div className="w-px h-8 bg-slate-800"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xl sm:text-2xl font-black text-yellow-400 mb-1">{localVisits}</span>
                                    <span className="text-[10px] sm:text-xs text-slate-400 font-bold flex items-center gap-1"><i className="ph-fill ph-eye"></i> زيارة</span>
                                </div>
                                <div className="w-px h-8 bg-slate-800"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xl sm:text-2xl font-black text-pink-400 mb-1">{studioLikes}</span>
                                    <span className="text-[10px] sm:text-xs text-slate-400 font-bold flex items-center gap-1"><i className="ph-fill ph-heart"></i> إعجاب</span>
                                </div>
                                <div className="w-px h-8 bg-slate-800"></div>
                                <div className="flex flex-col items-center">
                                    <span className="text-xl sm:text-2xl font-black text-amber-400 mb-1 flex items-center gap-1">{recordsLoaded ? avgRating : <span className="inline-block w-7 h-5 rounded bg-slate-700 animate-pulse" aria-label="جاري التحميل"></span>} <i className="ph-fill ph-star text-sm sm:text-base"></i></span>
                                    <span className="text-[10px] sm:text-xs text-slate-400 font-bold flex items-center gap-1">من {reviews.length} تقييم</span>
                                </div>
                            </div>
                            
                            {/* Socials & Like */}
                            <div className="flex justify-center gap-4 w-full mt-6 mb-4">
                                <button onClick={handleLike} className={`w-12 h-12 rounded-full flex items-center justify-center border shadow-md transition-all ${hasLiked ? 'bg-pink-950/50 border-pink-500/50 text-pink-400' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-pink-400 hover:border-pink-500'}`} title="تسجيل إعجاب">
                                    <i className={`${hasLiked ? 'ph-fill text-pink-500' : 'ph'} ph-heart text-2xl ${!hasLiked && 'animate-pulse'}`}></i>
                                </button>
                                <a href="https://www.facebook.com/MrakbyPh" target="_blank" rel="noopener noreferrer" className="w-12 h-12 rounded-full flex items-center justify-center bg-blue-900/20 border border-blue-500/30 text-blue-400 hover:bg-blue-600 hover:text-white transition-all shadow-md" title="فيسبوك">
                                    <i className="ph-fill ph-facebook-logo text-2xl"></i>
                                </a>
                                <a href="https://instagram.com/MrakbyPh" target="_blank" rel="noopener noreferrer" className="w-12 h-12 rounded-full flex items-center justify-center bg-pink-900/20 border border-pink-500/30 text-pink-400 hover:bg-gradient-to-tr hover:from-yellow-400 hover:via-pink-500 hover:to-purple-500 hover:text-white hover:border-transparent transition-all shadow-md" title="إنستجرام">
                                    <i className="ph-fill ph-instagram-logo text-2xl"></i>
                                </a>
                            </div>

                        </div>

                        {!showPhoneInput && (
                            <div className="w-full mb-8 animate-fadeIn" style={{animationDelay: '0.15s'}}>
                                {/* Main Actions Grid */}
                                <div className="flex flex-col gap-3 w-full mb-8">
                                    {settings.appointmentSettings?.enabled !== false && (
                                        <button onClick={() => setShowBookingModal(true)} className="w-full bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-black py-4 rounded-xl shadow-lg shadow-purple-900/20 transition-transform hover:scale-[1.02] text-lg flex items-center justify-center gap-2 border border-purple-500/50">
                                            <i className="ph-fill ph-calendar-plus text-2xl"></i> احجز موعد تصوير الآن
                                        </button>
                                    )}
                                    <div className="grid grid-cols-1 gap-3">
                                        <button onClick={() => setShowPhoneInput(true)} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2 border border-slate-700 text-sm sm:text-base">
                                            <i className="ph-fill ph-folder-open text-xl text-blue-400"></i> الأرشيف وطلباتك
                                        </button>

                                    </div>
                                </div>
                                
                                {/* Miniature Products Grid */}
                                <div id="customer-products" className="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4 mb-6" aria-live="polite">
                                    {!settingsLoaded ? (
                                        <div className="col-span-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-5 text-center text-xs text-slate-400">
                                            <i className="ph ph-spinner animate-spin ml-1"></i> جارٍ تحميل المنتجات والعروض المحفوظة...
                                        </div>
                                    ) : settingsLoadError ? (
                                        <div className="col-span-full rounded-xl border border-amber-500/30 bg-amber-950/20 px-4 py-5 text-center text-xs text-amber-200">
                                            تعذّر تحميل البطاقات الآن. تحقق من الاتصال ثم أعد تحميل الصفحة.
                                        </div>
                                    ) : displayMiniProducts.map((prod, idx) => (
                                        <div key={prod.id || `product-${idx}`} className="col-span-1">
                                            <MiniProductCard prod={prod} onClick={handleOpenCard} spanTwo={false} />
                                        </div>
                                    ))}
                                </div>

                                {/* Promotions Section */}
                                {!settingsLoaded ? null : settingsLoadError ? null : settings.promotions?.length > 0 && (
                                    <>
                                        <h3 className="text-lg font-black text-slate-200 mb-4 flex items-center justify-center gap-2 mt-8">
                                            <i className="ph-fill ph-sparkle text-yellow-400"></i> أحدث عروضنا لك
                                        </h3>
                                        <div className="grid grid-cols-1 gap-4">
                                            {settings.promotions.map(promo => {
                                                const colorSet = promoColors[promo.color || 'yellow'] || promoColors.yellow;
                                                const [bg1, bg2, borderClass, textClass, iconBgClass] = colorSet.split(' ');
                                                return (
                                                    <div key={promo.id} className="relative group">
                                                        <div onClick={() => { setSelectedPromoModal(promo); setPromoImgIndex(0); const newUrl = `${window.location.pathname}?client=true&promo=${promo.id}`; window.history.pushState({}, '', newUrl); }} className={`bg-gradient-to-l ${bg1} ${bg2} p-4 rounded-2xl border ${borderClass} shadow-md flex flex-col transition-transform hover:scale-[1.02] cursor-pointer relative overflow-hidden pb-4`}>
                                                            {promo.images?.length > 0 && (
                                                                <div className="-mx-4 -mt-4 mb-3 h-40 relative border-b border-slate-700/50 shrink-0">
                                                                    <img src={promo.images[0]} className="w-full h-full object-cover rounded-t-2xl opacity-90" alt={promo.title} />
                                                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent"></div>
                                                                </div>
                                                            )}
                                                            <div className={`flex items-start gap-4 z-10 ${promo.images?.length > 0 ? '-mt-8' : ''}`}>
                                                                 <div className={`w-12 h-12 rounded-full ${iconBgClass} ${textClass} flex items-center justify-center shrink-0 shadow-lg border border-white/10 bg-slate-900`}>
                                                                     <i className={`ph-fill ${promo.icon} text-2xl`}></i>
                                                                 </div>
                                                                 <div className="flex-1 pt-1">
                                                                     <h4 className="font-bold text-slate-100">{promo.title}</h4>
                                                                     <p className="text-xs text-slate-300 mt-1 leading-relaxed line-clamp-2 drop-shadow-md">{promo.shortDesc}</p>
                                                                     {promo.discount && <span className={`inline-block mt-2 text-[10px] font-black px-2 py-1 ${iconBgClass} ${textClass} rounded border border-current/20`}>{promo.discount}</span>}
                                                                 </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )
                                            })}
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {showPhoneInput && (
                             <div className="bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-800 shadow-2xl animate-fadeIn w-full relative">
                                  <button onClick={() => {setShowPhoneInput(false); setHasSearched(false); setResults([]);}} className="absolute top-4 left-4 text-slate-500 hover:text-white transition-colors"><i className="ph ph-arrow-right text-xl"></i> رجوع</button>
                                  <div className="text-center mb-6 mt-4">
                                      <div className="bg-blue-950/30 p-4 rounded-2xl border border-blue-900/40 shadow-inner inline-block w-full">
                                          <i className="ph-fill ph-shield-check text-blue-400 text-3xl mb-2"></i>
                                          <p className="text-slate-300 text-sm leading-relaxed font-bold">مرحباً بك مجدداً 👋 أدخل رقم هاتفك لعرض كل زياراتك وإيصالاتك المرتبطة به، أو رقم صورة للبحث عن طلب واحد.</p>
                                      </div>
                                  </div>
                                  <form onSubmit={handleSearch} className="flex flex-col gap-4">
                                      {errorMsg && <div className="text-red-400 text-sm bg-red-950/50 p-3 rounded-xl text-center font-bold border border-red-900/50 animate-fadeIn">{errorMsg}</div>}
                                      <div>
                                          <label className="block text-sm font-bold text-slate-400 mb-2">رقم الهاتف المسجل أو رقم الصورة:</label>
                                          <div className="relative">
                                              <input type="tel" inputMode="tel" autoComplete="tel" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="أدخل رقم الهاتف أو رقم الصورة هنا..." className="w-full p-4 pr-12 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-blue-500 outline-none text-lg font-mono transition-colors shadow-inner" required autoFocus />
                                              <i className="ph-fill ph-magnifying-glass absolute right-4 top-4 text-slate-500 text-xl"></i>
                                          </div>
                                      </div>

                                                        <span className="text-sm font-bold text-slate-200">أرغب في كتابة اسمي على الصورة</span>

                                                        <div className="text-xs text-purple-100">الاسم: {bookingData.name || '—'} • الرقم القومي: {bookingData.nationalId || '—'}</div>

                                                                            <input type="checkbox" className="accent-purple-500 w-4 h-4" checked={!!existing} onChange={() => handleExtraServiceChange(srv, 'toggle')} />

                                                                                <span className={`text-sm font-bold ${existing ? 'text-purple-300' : 'text-slate-300'}`}>{srv.name}</span>
                                                                                {settings.appointmentSettings?.showPrice !== false && <span className="text-[10px] font-black text-slate-400">{srv.price} ج.م</span>}
                                                                            </div>
                                                                        </label>
                                                                        {existing && (
                                                                            <div className="flex items-center bg-slate-900 rounded-lg border border-slate-700 overflow-hidden shrink-0">
                                                                                <button type="button" onClick={()=>handleExtraServiceChange(srv, 'sub')} className="px-2.5 py-1 text-slate-400 hover:text-white hover:bg-slate-800 font-bold">-</button>
                                                                                <span className="w-6 text-center text-xs font-bold text-white">{existing.qty}</span>
                                                                                <button type="button" onClick={()=>handleExtraServiceChange(srv, 'add')} className="px-2.5 py-1 text-slate-400 hover:text-white hover:bg-slate-800 font-bold">+</button>

                                                                        )}

                                                    {bookingData.extraServices.length === 0 && <p className="text-xs text-red-400 mt-1"><i className="ph-fill ph-warning-circle"></i> يرجى اختيار خدمة تصوير واحدة على الأقل.</p>}

                                                            <p className="text-xs text-slate-500">الإجمالي المتوقع</p>
                                                            <p className="text-xl font-black text-yellow-400">{expectedTotalPrice} ج.م</p>
                                                        </div>
                                                    </div>

                                                        </div>
                                                    </label>

                                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                                                    <label className="block text-sm font-bold text-slate-300 mb-2">طريقة الدفع المفضلة:</label>
                                                    <div className="relative">

                                                        <div className="bg-indigo-950/40 border border-indigo-500/50 p-4 rounded-xl mt-3 animate-fadeIn shadow-lg">

                                                                    <i className="ph-fill ph-device-mobile text-indigo-400 text-2xl shrink-0"></i>

        const AppointmentsTab = ({ appointments, db, settings, onDeleteCustomer }) => {
            const [filterStatus, setFilterStatus] = useState('all');

            const [actionError, setActionError] = useState('');
            const [openWaMenuId, setOpenWaMenuId] = useState(null);
            const [deleteModalId, setDeleteModalId] = useState(null); // للتحكم في نافذة الحذف
            const [completionModal, setCompletionModal] = useState(null);

            // للتعرف على المواعيد الجديدة المنشأة مؤخراً
            const [recentIds, setRecentIds] = useState([]);
            useEffect(() => {
                const now = Date.now();
                const newIds = appointments.filter(a => (now - new Date(a.createdAt).getTime()) < 24 * 60 * 60 * 1000 && a.status === 'pending').map(a => a.id);
