                  {onEdit && <button onClick={(e) => { e.stopPropagation(); onEdit(txn); }} className="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all mt-2"><i className="ph ph-pencil-simple text-xl"></i> تعديل البيانات</button>}

                  <div className="mt-3 grid grid-cols-2 gap-2" onClick={e => e.stopPropagation()}>
                        <div className="rounded-xl border border-yellow-500/25 bg-yellow-950/20 px-3 py-2 min-w-0"><p className="text-yellow-300 text-[10px] font-bold flex items-center gap-1"><i className="ph-fill ph-gift"></i> رصيد المكافآت المتاح</p><p className="text-white font-black text-sm mt-1">{rewards.balance} ج.م</p></div>
                        <button onClick={() => onViewHistory && onViewHistory(txn.phone)} className="rounded-xl border border-slate-700 bg-slate-950 px-3 py-2 text-right hover:border-yellow-500/50 transition-colors min-w-0"><span className="text-slate-400 text-[10px] font-bold flex items-center gap-1"><i className="ph-fill ph-clock-counter-clockwise text-yellow-400"></i> سجل الزيارات</span><span className="text-white font-black text-sm mt-1 block">{visitCount} زيارة</span></button>
                        <div className="min-w-0"><button onClick={() => setShowPhotosLinkInput(v => !v)} aria-expanded={showPhotosLinkInput} className="w-full h-full rounded-xl border border-blue-500/30 bg-blue-950/20 px-3 py-2 text-right transition-colors hover:border-blue-400/50 hover:bg-blue-900/30"><span className="flex items-center gap-1 text-xs font-bold text-blue-300"><i className="ph-fill ph-google-drive-logo"></i> رابط الصور للعميل</span><span className="mt-1 block truncate text-sm font-black text-white">{txn.photosLink ? 'تعديل الرابط' : 'إضافة رابط'}</span></button></div>
                        {showPhotosLinkInput && <div className="col-span-2 min-w-0 animate-fadeIn rounded-xl border border-blue-500/40 bg-gradient-to-br from-blue-950/50 to-slate-900 p-3 shadow-lg shadow-blue-950/20"><label className="mb-2 flex items-center gap-2 text-xs font-bold text-blue-200" htmlFor={`photos-link-${txn.id}`}><i className="ph-fill ph-link"></i>رابط تحميل صور العميل</label><input id={`photos-link-${txn.id}`} type="url" value={photosLinkDraft} onChange={e => setPhotosLinkDraft(e.target.value)} placeholder="الصق رابط الصور هنا..." dir="ltr" className="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2.5 text-left text-sm text-white outline-none transition focus:border-blue-400 focus:ring-2 focus:ring-blue-500/20" />{txn.photosLink && <p className="mt-1.5 break-all text-left text-[10px] text-slate-400" dir="ltr">الرابط الحالي: {txn.photosLink}</p>}<div className="mt-3 flex flex-wrap gap-2"><button onClick={async () => { const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby'; const targetCol = isWedding ? 'weddings' : 'transactions'; await setDoc(doc(db, `artifacts/${appId}/public/data/${targetCol}`, txn.id), { photosLink: photosLinkDraft.trim() }, { merge: true }); setShowPhotosLinkInput(false); }} className="flex-1 rounded-lg bg-blue-600 px-4 py-2 text-xs font-bold text-white transition hover:bg-blue-500">حفظ الرابط</button><button onClick={() => setShowPhotosLinkInput(false)} className="rounded-lg bg-slate-800 px-4 py-2 text-xs font-bold text-slate-300 transition hover:bg-slate-700">إلغاء</button></div></div>}
                      </div>

                  
                  {confirmDelete ? (
                      <div className="flex flex-col gap-2 mt-auto pt-2">
                         <span className="text-xs text-red-300 text-center font-bold leading-5">{isValidCustomerPhone(txn.phone) ? 'سيتم حذف كل سجلات هذا العميل المرتبطة برقم هاتفه.' : 'رقم الهاتف غير مكتمل؛ سيتم حذف هذا الإيصال فقط لتجنب حذف سجلات عملاء آخرين بالخطأ.'} لا يمكن التراجع عن الحذف.</span>
                         <div className="flex gap-2">
                            <button onClick={(e) => { e.stopPropagation(); onDelete(txn.phone, txn.id, isWedding ? 'weddings' : 'transactions'); }} className="flex-1 bg-red-600 hover:bg-red-500 text-white px-2 py-2 rounded-xl text-xs font-bold transition-all">{isValidCustomerPhone(txn.phone) ? 'حذف العميل نهائياً' : 'حذف هذا الإيصال'}</button>
                            <button onClick={(e) => { e.stopPropagation(); setConfirmDelete(false); }} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white px-2 py-2 rounded-xl text-xs font-bold transition-all">إلغاء</button>
                         </div>
                      </div>
                  ) : <button onClick={(e) => { e.stopPropagation(); setConfirmDelete(true); }} className="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-900/30 px-3 py-2.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all mt-auto"><i className="ph ph-trash text-xl"></i> {isValidCustomerPhone(txn.phone) ? 'حذف العميل وبياناته' : 'حذف إيصال بلا هاتف مكتمل'}</button>}
                </div>
              </div>

                    </div>
                  </div>
                </div>}
                {showPhotoDetails && <div className="fixed inset-0 z-[180] flex items-center justify-center bg-slate-950/85 p-3 backdrop-blur-sm animate-fadeIn" onClick={() => setShowPhotoDetails(false)}>
                    <div className="max-h-[90vh] w-full max-w-2xl min-w-0 overflow-hidden rounded-2xl border border-blue-400/25 bg-slate-900 shadow-2xl shadow-blue-950/40" dir="rtl" onClick={e => e.stopPropagation()}>
                        <div className="flex items-center justify-between gap-3 border-b border-slate-800 bg-slate-950/60 px-4 py-4">
                            <div className="min-w-0"><h3 className="text-base font-black text-white"><i className="ph-fill ph-images ml-1.5 text-blue-300"></i>تفاصيل الصور المرتبطة بالإيصال</h3><p className="mt-1 text-xs text-slate-400">{displayName || 'العميل'} · إيصال رقم <span className="font-mono text-blue-200">#{txn.receiptNo}</span></p></div>
                            <button type="button" onClick={() => setShowPhotoDetails(false)} className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-slate-700 bg-slate-800 text-slate-300 transition hover:border-red-400/40 hover:bg-red-950/50 hover:text-white" aria-label="إغلاق تفاصيل الصور"><i className="ph-bold ph-x"></i></button>
                        </div>
                        <div className="max-h-[72vh] space-y-3 overflow-y-auto p-4 sm:p-5 custom-scrollbar">
                            {cardPhotoItems.length ? cardPhotoItems.map((photo, idx) => <div key={idx} className="w-full min-w-0 rounded-xl border border-slate-700/80 bg-slate-950/70 p-4">
                                <div className="flex items-center justify-between gap-2"><span className="text-sm font-bold text-slate-200">الصورة {idx + 1}</span><span className="rounded-md border border-blue-500/30 bg-blue-950/40 px-3 py-1.5 font-mono text-sm font-black text-white">{photo.number || 'بدون رقم'}</span></div>
                                <div className="mt-3 grid min-w-0 grid-cols-1 gap-2.5 md:grid-cols-2">
                                    <div className="min-w-0 rounded-lg border border-slate-800 bg-slate-900/70 p-3"><p className="mb-1 text-xs font-bold text-slate-400">الخدمة</p><p className="break-words text-sm font-bold leading-6 text-indigo-100">{photo.serviceType || photo.service || 'غير محددة'}</p></div>
                                    {photo.note && <div className="min-w-0 rounded-lg border border-slate-800 bg-slate-900/70 p-3"><p className="mb-1 text-xs font-bold text-slate-400">التفاصيل / الملاحظات</p><p className="whitespace-pre-wrap break-words text-sm leading-6 text-slate-100">{photo.note}</p></div>}
                                </div>
                                {(photo.important || photo.needsName) && <div className="mt-3 flex flex-wrap gap-2">{photo.important && <span className="rounded-md border border-amber-400/20 bg-amber-950/25 px-2.5 py-1.5 text-xs font-bold text-amber-100">مهم</span>}{photo.needsName && <span className="rounded-md border border-purple-400/20 bg-purple-950/25 px-2.5 py-1.5 text-xs font-bold text-purple-100">يتطلب كتابة الاسم</span>}</div>}
                            </div>) : <p className="w-full rounded-xl border border-slate-700 bg-slate-950 p-4 text-center text-sm text-slate-300">لا توجد أرقام صور مسجلة لهذا الإيصال.</p>}
                            {txn.requirements && <div className="w-full min-w-0 rounded-xl border border-slate-700 bg-slate-950/70 p-4"><p className="text-sm font-black text-slate-200">تفاصيل إضافية للطلب</p><p className="mt-1 whitespace-pre-wrap break-words text-sm leading-6 text-slate-300">{txn.requirements}</p></div>}
                        </div>
                        <div className="border-t border-slate-800 px-4 py-3 text-center text-xs text-slate-400">عدد الصور المرتبطة بالإيصال: {cardPhotoItems.length}</div>
                    </div>
                </div>}
              </>
            )
        };

        const CustomerArchive = ({ allRecords, transactions, inventory, settings, setReceiptImageModal, onCustomerClick }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [showRepeatReceipts, setShowRepeatReceipts] = useState(false);
            const [showMonthlyStarsModal, setShowMonthlyStarsModal] = useState(false);
            const [selectedReceiptRecord, setSelectedReceiptRecord] = useState(null);
            const [query, setQuery] = useState('');
            const [timeRange, setTimeRange] = useState('all');
            const [ratingFilter, setRatingFilter] = useState('all');
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            const currentYear = now.getFullYear();
            const monthlyInstantPrintCount = useMemo(() => (transactions || []).reduce((count, record) => {
                const date = new Date(record.dateTime || record.createdAt || record.date || '');
                if (Number.isNaN(date.getTime()) || date.getMonth() + 1 !== currentMonth || date.getFullYear() !== currentYear || !isInstantStatsRecordIncluded(record, settings)) return count;
                return count + getExplicitInstantPrintItems(record).reduce((sum, item) => sum + item.qty, 0);
            }, 0), [transactions, currentMonth, currentYear, settings.instantStatsStartDate]);

            const completedRecords = useMemo(() => (allRecords || []).filter(record => {
                const wedding = record.type === 'wedding' || !!record.groomName || !!record.brideName;
                return wedding ? Number(record.status) === 6 : Number(record.status) === 3;
            }).sort((a, b) => new Date(b.dateTime || 0) - new Date(a.dateTime || 0)), [allRecords]);

            const topCustomers = useMemo(() => {
                const counts = {};
                (allRecords || []).filter(record => Number(record.month) === currentMonth && Number(record.year) === currentYear).forEach(record => {
                    if (!record.phone) return;
                    if (!counts[record.phone]) counts[record.phone] = { phone: record.phone, name: record.clientName || record.groomName || 'بدون اسم', visits: 0, totalSpent: 0, latestReceiptNo: record.receiptNo, latestDate: record.dateTime || '' };
                    counts[record.phone].visits += 1;
                    counts[record.phone].totalSpent += parseFloat(record.total) || 0;
                    if (String(record.dateTime || '') >= String(counts[record.phone].latestDate || '')) {
                        counts[record.phone].latestDate = record.dateTime || '';
                        counts[record.phone].latestReceiptNo = record.receiptNo;
                    }
                });
                return Object.values(counts).filter(customer => customer.visits > 1).sort((a, b) => b.visits - a.visits || b.totalSpent - a.totalSpent).slice(0, 10);
            }, [allRecords, currentMonth, currentYear]);

            const receiptNumbersFor = (phone) => (allRecords || [])
                .filter(record => record.phone === phone && record.receiptNo !== undefined && record.receiptNo !== null && String(record.receiptNo).trim() !== '')
                .sort((a, b) => String(b.dateTime || '').localeCompare(String(a.dateTime || '')))
                .map(record => record);

            const ratedCount = (allRecords || []).filter(record => Number(record.clientRating) > 0).length;
            const pendingRatingCount = completedRecords.filter(record => !(Number(record.clientRating) > 0)).length;
            const displayedArchive = useMemo(() => completedRecords.filter(record => {
                const date = new Date(record.dateTime || 0);
                if (timeRange === 'month' && (date.getMonth() + 1 !== currentMonth || date.getFullYear() !== currentYear)) return false;
                if (timeRange === '90' && (Number.isNaN(date.getTime()) || now.getTime() - date.getTime() > 90 * 24 * 60 * 60 * 1000)) return false;
                if (ratingFilter === 'pending' && Number(record.clientRating) > 0) return false;
                if (ratingFilter === 'rated' && !(Number(record.clientRating) > 0)) return false;
                const q = query.trim().toLowerCase();
                if (!q) return true;
                const name = `${record.groomName || ''} ${record.brideName || ''} ${record.clientName || ''}`.toLowerCase();
                const phone = String(record.phone || '');
                const receipt = String(record.receiptNo || '').toLowerCase();
                const photos = Array.isArray(record.photoNo) ? record.photoNo.map(photo => typeof photo === 'object' ? photo.number : photo).join(' ').toLowerCase() : String(record.photoNo || '').toLowerCase();
                return name.includes(q) || phone.includes(q) || receipt.includes(q) || photos.includes(q);
            }), [completedRecords, timeRange, ratingFilter, query, currentMonth, currentYear]);

            const sendReviewRequest = (record, name, wedding) => {
                if (!record.phone) return;
                const typeParam = wedding ? 'w' : 't';
                const trackUrl = window.location.href.split('?')[0] + `?phone=${encodeURIComponent(record.phone)}&receipt=${encodeURIComponent(record.receiptNo)}&type=${typeParam}`;
                openWhatsApp(record.phone, `أهلاً بك أ. ${name || ''} 🌟\nبما إنك استلمت شغلك من ${settings.studioName}، يهمنا جداً نعرف رأيك وتقييمك للتجربة عبر هذا الرابط:\n${trackUrl}`);
            };

            const sendRetargetOffer = (record, name) => {
                if (!record.phone) return;
                openWhatsApp(record.phone, `أهلاً أ. ${name || ''}، نتمنى تكون الصور عجبتكم! 🌟\nبمناسبة مرور فترة على تصويركم في ${settings.studioName}، بنقدملك خصم 15% لو حابب تطبع الصور على تابلوه خشب أو تعمل ألبوم ميني لحفظ ذكرياتك. للطلب استفسر مننا هنا! 🎁`);
            };

            return (
                <section className="overflow-hidden rounded-3xl border border-cyan-400/20 bg-gradient-to-br from-slate-900 via-slate-900 to-cyan-950/20 shadow-xl shadow-black/10">
                    <div className="flex w-full flex-col gap-3 bg-slate-950/40 p-4 sm:p-5 xl:flex-row xl:items-center xl:justify-between">
                        <button type="button" aria-expanded={isOpen} onClick={() => setIsOpen(value => !value)} className="flex min-w-0 items-center gap-3 self-start text-right xl:self-auto">
                            <span className="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl border border-cyan-400/25 bg-cyan-500/10 text-cyan-200"><i className="ph-fill ph-archive-box text-xl"></i></span>
                            <span className="min-w-0"><strong className="block truncate text-base font-black text-white sm:text-lg">أرشيف العملاء</strong><span className="mt-0.5 block truncate text-[11px] text-slate-400">إعادة التواصل وطلب التقييم · {completedRecords.length} أعمال مكتملة</span></span>
                            <i className={`ph-bold ${isOpen ? 'ph-caret-up' : 'ph-caret-down'} text-cyan-200`}></i>
                        </button>
                        <div className="grid w-full grid-cols-2 gap-2 sm:grid-cols-3 xl:flex xl:w-auto xl:max-w-full xl:flex-1 xl:flex-wrap xl:justify-end xl:gap-1.5">
                            <button type="button" onClick={() => setShowRepeatReceipts(true)} title="عرض أرقام إيصالات العملاء الأكثر زيارة" className="min-w-0 rounded-xl border border-blue-400/20 bg-blue-950/30 px-3 py-2 text-center transition hover:border-blue-300/50 xl:w-[136px] xl:flex-none"><span className="block truncate text-[10px] text-blue-100/70">إجمالي الإيصالات</span><strong className="mt-0.5 flex items-center justify-center gap-1 text-base font-black text-blue-200"><i className="ph-fill ph-receipt"></i>{(allRecords || []).length}</strong></button>
                            <span className="min-w-0 rounded-xl border border-cyan-400/20 bg-cyan-950/30 px-3 py-2 text-center xl:w-[136px] xl:flex-none"><span className="block truncate text-[10px] text-cyan-100/70">مكتملة</span><strong className="mt-0.5 block text-base font-black text-cyan-200">{completedRecords.length}</strong></span>
                            <div className="min-w-0 rounded-xl border border-yellow-400/25 bg-gradient-to-br from-yellow-950/45 to-amber-950/20 px-3 py-2 text-center shadow-sm shadow-yellow-950/20 xl:w-[160px] xl:flex-none" title="ملخص مخزون الطباعة الفورية وعدد الطباعات خلال الشهر الحالي"><span className="block truncate text-[10px] font-bold text-yellow-100/80"><i className="ph-fill ph-printer ml-1 text-yellow-300"></i>ملخص الطباعة الفورية</span><div className="mt-1.5 grid grid-cols-2 divide-x divide-x-reverse divide-yellow-400/15"><div className="px-1"><span className="block text-[9px] text-slate-400">ورق متاح</span><strong className="mt-0.5 block text-sm font-black text-yellow-200">{Number(inventory?.['ورق طباعة صور'] || 0).toLocaleString('en-US')}</strong></div><div className="px-1"><span className="block text-[9px] text-slate-400">طباعات الشهر</span><strong className="mt-0.5 block text-sm font-black text-amber-200">{monthlyInstantPrintCount.toLocaleString('en-US')}</strong></div></div></div>
                            <span className="min-w-0 rounded-xl border border-amber-400/20 bg-amber-950/20 px-3 py-2 text-center xl:w-[136px] xl:flex-none"><span className="block truncate text-[10px] text-amber-100/70">بانتظار التقييم</span><strong className="mt-0.5 block text-base font-black text-amber-200">{pendingRatingCount}</strong></span>
                            <span title="عدد التقييمات بالنجوم المستلمة من بوابة العملاء" className="min-w-0 rounded-xl border border-yellow-400/20 bg-yellow-950/20 px-3 py-2 text-center xl:w-[136px] xl:flex-none"><span className="block truncate text-[10px] text-yellow-100/70">تقييمات العملاء</span><strong className="mt-0.5 block text-base font-black text-yellow-200">{ratedCount}</strong></span>
                            <button type="button" onClick={() => setShowMonthlyStarsModal(true)} title="عرض عملاء نجوم الشهر وإعادة استهدافهم" className="min-w-0 rounded-xl border border-yellow-400/20 bg-yellow-950/25 px-3 py-2 text-center transition hover:border-yellow-300/50 xl:w-[136px] xl:flex-none"><span className="block truncate text-[10px] text-yellow-100/70">نجوم الشهر</span><strong className="mt-0.5 flex items-center justify-center gap-1 text-base font-black text-yellow-200"><i className="ph-fill ph-star"></i>{topCustomers.length}</strong></button>
                        </div>
                    </div>
                    {isOpen && <div className="border-t border-slate-800 p-4 sm:p-5">
                        <div className="mb-4 grid grid-cols-1 gap-2 sm:grid-cols-[minmax(0,1fr)_160px_170px]">
                            <div className="relative min-w-0"><i className="ph ph-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-slate-500"></i><input type="search" value={query} onChange={event => setQuery(event.target.value)} placeholder="ابحث بالاسم أو الهاتف أو رقم الإيصال..." className="h-11 w-full rounded-xl border border-slate-700 bg-slate-950 pr-9 pl-3 text-sm text-white outline-none transition focus:border-cyan-400" /></div>
                            <select value={timeRange} onChange={event => setTimeRange(event.target.value)} aria-label="تصفية الأرشيف حسب الفترة" className="h-11 rounded-xl border border-slate-700 bg-slate-950 px-3 text-xs font-bold text-slate-200 outline-none focus:border-cyan-400"><option value="all">كل الأرشيف</option><option value="month">هذا الشهر</option><option value="90">آخر 90 يومًا</option></select>
                            <select value={ratingFilter} onChange={event => setRatingFilter(event.target.value)} aria-label="تصفية حسب التقييم" className="h-11 rounded-xl border border-slate-700 bg-slate-950 px-3 text-xs font-bold text-slate-200 outline-none focus:border-cyan-400"><option value="all">كل العملاء</option><option value="pending">بانتظار التقييم</option><option value="rated">تم التقييم</option></select>
                        </div>
                        <div className="mb-3 flex items-center justify-between text-[11px] text-slate-500"><span>النتائج: <b className="text-slate-300">{displayedArchive.length}</b></span><span>مرتبة من الأحدث إلى الأقدم</span></div>
                        <div className="max-h-[560px] space-y-3 overflow-y-auto pr-1 custom-scrollbar">
                            {displayedArchive.length === 0 ? <div className="rounded-2xl border border-dashed border-slate-700 bg-slate-950/60 px-4 py-10 text-center"><i className="ph ph-archive text-3xl text-slate-600"></i><p className="mt-2 text-sm font-bold text-slate-300">لا توجد سجلات مطابقة</p><p className="mt-1 text-xs text-slate-500">جرّب تغيير البحث أو الفلاتر.</p></div> : displayedArchive.map(record => {
                                const wedding = record.type === 'wedding' || !!record.groomName || !!record.brideName;
                                const name = wedding ? `${record.groomName || ''} و ${record.brideName || ''}`.trim() : record.clientName;
                                const hasRating = Number(record.clientRating) > 0;
                                return <article key={`${wedding ? 'w' : 't'}-${record.id}`} className="flex flex-col gap-3 rounded-2xl border border-slate-800 bg-slate-950/70 p-3.5 transition hover:border-cyan-400/25 sm:p-4 lg:flex-row lg:items-center lg:justify-between">
                                    <div className="min-w-0 flex-1">
                                        <div className="flex flex-wrap items-center gap-2"><span className={`flex h-8 w-8 items-center justify-center rounded-xl ${wedding ? 'bg-pink-500/10 text-pink-300' : 'bg-blue-500/10 text-blue-300'}`}><i className={`ph-fill ${wedding ? 'ph-heart' : 'ph-camera'}`}></i></span><strong className="max-w-full truncate text-sm font-black text-slate-100">{name || 'بدون اسم'}</strong><span className="rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 font-mono text-[10px] font-black text-cyan-200">إيصال #{record.receiptNo || '—'}</span><span className={`rounded-lg px-2 py-1 text-[10px] font-bold ${wedding ? 'bg-pink-950/40 text-pink-200' : 'bg-blue-950/40 text-blue-200'}`}>{wedding ? 'زفاف' : 'استوديو'}</span></div>
                                        <div className="mt-2 flex flex-wrap items-center gap-2 text-[11px] text-slate-400"><span><i className="ph ph-phone ml-1"></i>{record.phone || 'لا يوجد هاتف'}</span><span><i className="ph ph-calendar-blank ml-1"></i>{formatDateOnly(record.dateTime)}</span><span><i className="ph ph-currency-circle-dollar ml-1"></i>{formatCurrency(record.total)}</span>{Array.isArray(record.photoNo) && record.photoNo.some(photo => String(typeof photo === 'object' ? photo.number || '' : photo).trim()) && <span className="inline-flex flex-wrap items-center gap-1 rounded-lg border border-blue-500/20 bg-blue-950/25 px-2 py-1 text-blue-100"><i className="ph-fill ph-images text-blue-300"></i>{record.photoNo.filter(photo => String(typeof photo === 'object' ? photo.number || '' : photo).trim()).map((photo, idx) => <b key={idx} className="font-mono">{typeof photo === 'object' ? photo.number : photo}</b>)}</span>}{getExplicitInstantPrintItems(record).length > 0 && <span className="inline-flex flex-wrap items-center gap-1 rounded-lg border border-amber-500/25 bg-amber-950/30 px-2 py-1 font-black text-amber-100"><i className="ph-fill ph-lightning text-amber-300"></i>{getExplicitInstantPrintItems(record).map((item, idx) => <b key={idx}>{item.qty} × {item.unitPrice} ج.م</b>)}</span>}</div>
                                        {record.confirmedReceipts?.length > 0 && <div className="mt-2 flex flex-wrap items-center gap-2"><span className="text-[10px] text-slate-500">إيصالات السداد:</span>{record.confirmedReceipts.map((url, index) => <button type="button" key={`${record.id}-receipt-${index}`} onClick={() => setReceiptImageModal(url)} title="عرض إيصال السداد" className="h-8 w-8 overflow-hidden rounded-lg border border-slate-700 transition hover:border-cyan-300"><img src={url} alt="إيصال سداد" className="h-full w-full object-cover" /></button>)}</div>}
                                    </div>
                                    <div className="flex flex-col gap-2 sm:flex-row sm:items-center lg:shrink-0">{hasRating ? <div className="flex min-h-10 items-center justify-center gap-1 rounded-xl border border-yellow-500/20 bg-yellow-950/20 px-3 text-yellow-200" title={record.clientFeedback || 'تم استلام التقييم'}><b className="text-sm">{record.clientRating}</b><i className="ph-fill ph-star"></i>{record.clientFeedback && <span className="max-w-32 truncate text-[10px] text-yellow-100/70">{record.clientFeedback}</span>}</div> : <button type="button" disabled={!record.phone} onClick={() => sendReviewRequest(record, name, wedding)} className="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl border border-slate-700 bg-slate-800 px-3 text-xs font-bold text-slate-200 transition hover:border-yellow-400/40 hover:text-yellow-100 disabled:cursor-not-allowed disabled:opacity-40"><i className="ph ph-star"></i>طلب تقييم</button>}<button type="button" disabled={!record.phone} onClick={() => sendRetargetOffer(record, name)} className="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl bg-gradient-to-l from-emerald-600 to-teal-500 px-3 text-xs font-black text-white shadow-lg shadow-emerald-950/20 transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-40"><i className="ph-fill ph-whatsapp-logo text-base"></i>إعادة تواصل</button></div>
                                </article>;
                            })}
                        </div>
                    </div>}
                    {showRepeatReceipts && isOpen && <div className="fixed inset-0 z-[130] flex items-center justify-center bg-slate-950/80 p-4 backdrop-blur-sm" onClick={() => setShowRepeatReceipts(false)}>
                        <section role="dialog" aria-modal="true" aria-labelledby="repeat-receipts-title" className="w-full max-w-2xl overflow-hidden rounded-3xl border border-cyan-400/25 bg-slate-900 shadow-2xl shadow-black/50" onClick={event => event.stopPropagation()}>
                            <div className="flex items-center justify-between gap-3 border-b border-slate-700 bg-slate-950/60 px-5 py-4"><div><h3 id="repeat-receipts-title" className="text-base font-black text-white">إيصالات العملاء الأكثر زيارة</h3><p className="mt-1 text-xs text-slate-400">أفضل 10 عملاء لهذا الشهر · إجمالي الإيصالات: {(allRecords || []).length}</p></div><button type="button" onClick={() => setShowRepeatReceipts(false)} aria-label="إغلاق" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 text-slate-300 transition hover:border-red-400/40 hover:text-white"><i className="ph-bold ph-x"></i></button></div>
                            <div className="max-h-[70vh] space-y-3 overflow-y-auto p-4 custom-scrollbar">{topCustomers.length ? topCustomers.map((customer, index) => <div key={customer.phone} className="flex w-full flex-col gap-2 rounded-xl border border-slate-700 bg-slate-950/80 p-3 sm:flex-row sm:items-center sm:justify-between"><button type="button" onClick={() => { setShowRepeatReceipts(false); onCustomerClick && onCustomerClick(customer.phone); }} className="flex min-w-0 items-center gap-2 text-right text-xs font-black text-slate-100"><span className="flex h-6 w-6 shrink-0 items-center justify-center rounded-lg bg-yellow-500/10 text-[10px] text-yellow-200">{index + 1}</span><span className="truncate">{customer.name}</span><span className="shrink-0 text-[10px] font-bold text-yellow-200">{customer.visits} زيارات</span></button><span className="flex flex-wrap gap-1.5 sm:max-w-[62%] sm:justify-end">{receiptNumbersFor(customer.phone).map((record, receiptIndex) => <button type="button" key={`${record.id || record.receiptNo}-${receiptIndex}`} onClick={() => { setShowRepeatReceipts(false); setSelectedReceiptRecord(record); }} title={`فتح الإيصال رقم ${record.receiptNo}`} className="rounded-md border border-cyan-400/20 bg-cyan-950/40 px-2 py-1 font-mono text-[10px] font-black text-cyan-200 transition hover:border-cyan-300 hover:bg-cyan-900/70">#{record.receiptNo}</button>)}</span></div>) : <p className="rounded-xl border border-slate-700 bg-slate-950 p-5 text-center text-sm text-slate-400">لا توجد إيصالات لعملاء متكررين حتى الآن.</p>}</div>
                            <div className="border-t border-slate-800 px-5 py-3 text-center text-[10px] text-slate-500">اضغط على اسم العميل لسجل الزيارات، أو على رقم الإيصال لفتح تفاصيله.</div>
                        </section>
                    </div>}
                    {showMonthlyStarsModal && <div className="fixed inset-0 z-[135] flex items-center justify-center bg-slate-950/85 p-4 backdrop-blur-sm" onClick={() => setShowMonthlyStarsModal(false)}>
                        <section role="dialog" aria-modal="true" aria-labelledby="monthly-stars-title" className="w-full max-w-2xl overflow-hidden rounded-3xl border border-yellow-400/25 bg-slate-900 shadow-2xl shadow-black/50" onClick={event => event.stopPropagation()}>
                            <div className="flex items-center justify-between gap-3 border-b border-yellow-500/15 bg-gradient-to-l from-yellow-950/40 to-slate-950/70 px-5 py-4"><div><h3 id="monthly-stars-title" className="flex items-center gap-2 text-base font-black text-yellow-200"><i className="ph-fill ph-crown text-xl"></i> عملاء نجوم الشهر</h3><p className="mt-1 text-xs text-slate-400">أفضل 10 عملاء متكررين · اضغط على الإيصال لعرض تفاصيله</p></div><button type="button" onClick={() => setShowMonthlyStarsModal(false)} aria-label="إغلاق نافذة نجوم الشهر" className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 text-slate-300 transition hover:border-red-400/40 hover:text-white"><i className="ph-bold ph-x"></i></button></div>
                            <div className="max-h-[68vh] space-y-2 overflow-y-auto p-4 custom-scrollbar">{topCustomers.length ? topCustomers.map((customer,index) => <article key={customer.phone} className="flex flex-col gap-3 rounded-2xl border border-slate-700 bg-slate-950/80 p-3 sm:flex-row sm:items-center sm:justify-between"><div className="min-w-0 flex-1"><button type="button" onClick={() => { setShowMonthlyStarsModal(false); onCustomerClick && onCustomerClick(customer.phone); }} title={`فتح سجل زيارات ${customer.name}`} className="flex min-w-0 items-center gap-2 text-right"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-xl bg-yellow-500/10 text-xs font-black text-yellow-200">{index + 1}</span><span className="truncate text-sm font-black text-white">{customer.name}</span><span className="shrink-0 text-[10px] text-yellow-200">{customer.visits} زيارات</span></button><div className="mt-2 flex flex-wrap gap-1.5">{receiptNumbersFor(customer.phone).map((record, receiptIndex) => <button type="button" key={`${record.id || record.receiptNo}-${receiptIndex}`} onClick={() => { setShowMonthlyStarsModal(false); setSelectedReceiptRecord(record); }} title={`فتح الإيصال رقم ${record.receiptNo}`} className="rounded-lg border border-cyan-400/20 bg-cyan-950/40 px-2.5 py-1 font-mono text-[10px] font-black text-cyan-200 transition hover:border-cyan-300 hover:bg-cyan-900/70"><i className="ph-fill ph-receipt ml-1"></i>#{record.receiptNo}</button>)}</div></div><button type="button" onClick={() => sendRetargetOffer({ phone: customer.phone }, customer.name)} className="inline-flex min-h-10 shrink-0 items-center justify-center gap-2 rounded-xl border border-emerald-400/25 bg-gradient-to-l from-emerald-700 to-teal-600 px-4 text-xs font-black text-white shadow-lg shadow-emerald-950/30 transition hover:-translate-y-0.5 hover:brightness-110"><i className="ph-fill ph-whatsapp-logo text-lg"></i>إعادة استهداف واتساب</button></article>) : <p className="rounded-2xl border border-dashed border-slate-700 bg-slate-950/70 px-4 py-10 text-center text-sm text-slate-400">لا يوجد عملاء متكررون لهذا الشهر حتى الآن.</p>}</div>
                            <div className="border-t border-slate-800 px-5 py-3 text-center text-[10px] text-slate-500">يمكنك فتح سجل العميل من اسمه أو تفاصيل الإيصال من رقمه، وإعادة التواصل عبر واتساب.</div>
                        </section>
                    </div>}
                    {selectedReceiptRecord && <div className="fixed inset-0 z-[145] flex items-center justify-center bg-slate-950/85 p-4 backdrop-blur-sm" onClick={() => setSelectedReceiptRecord(null)}>
                        <section role="dialog" aria-modal="true" className="w-full max-w-lg overflow-hidden rounded-3xl border border-cyan-400/25 bg-slate-900 shadow-2xl" onClick={event => event.stopPropagation()}>
                            <div className="flex items-center justify-between border-b border-slate-700 bg-slate-950/60 px-5 py-4"><div><h3 className="text-base font-black text-white">تفاصيل الإيصال #{selectedReceiptRecord.receiptNo}</h3><p className="mt-1 text-xs text-slate-400">{selectedReceiptRecord.type === 'wedding' || selectedReceiptRecord.groomName || selectedReceiptRecord.brideName ? `${selectedReceiptRecord.groomName || ''} و ${selectedReceiptRecord.brideName || ''}` : selectedReceiptRecord.clientName || 'بدون اسم'}</p></div><button type="button" onClick={() => setSelectedReceiptRecord(null)} aria-label="إغلاق" className="flex h-9 w-9 items-center justify-center rounded-xl border border-slate-700 bg-slate-800 text-slate-300"><i className="ph-bold ph-x"></i></button></div>
                            <div className="space-y-3 p-5 text-sm"><div className="grid grid-cols-2 gap-2"><div className="rounded-xl border border-slate-700 bg-slate-950 p-3"><span className="block text-[10px] text-slate-400">التاريخ</span><strong className="mt-1 block text-slate-100">{formatDateOnly(selectedReceiptRecord.dateTime)}</strong></div><div className="rounded-xl border border-slate-700 bg-slate-950 p-3"><span className="block text-[10px] text-slate-400">الهاتف</span><strong className="mt-1 block text-slate-100" dir="ltr">{selectedReceiptRecord.phone || '—'}</strong></div><div className="rounded-xl border border-slate-700 bg-slate-950 p-3"><span className="block text-[10px] text-slate-400">إجمالي الإيصال</span><strong className="mt-1 block text-cyan-200">{formatCurrency(selectedReceiptRecord.total)}</strong></div><div className="rounded-xl border border-slate-700 bg-slate-950 p-3"><span className="block text-[10px] text-slate-400">المدفوع / المتبقي</span><strong className="mt-1 block text-slate-100">{formatCurrency(selectedReceiptRecord.paid)} / {formatCurrency(selectedReceiptRecord.remaining)}</strong></div></div>
                                {selectedReceiptRecord.confirmedReceipts?.length > 0 && <div><p className="mb-2 text-xs font-bold text-slate-300">صور إيصالات السداد</p><div className="flex flex-wrap gap-2">{selectedReceiptRecord.confirmedReceipts.map((url, index) => <button type="button" key={`${selectedReceiptRecord.id}-pay-${index}`} onClick={() => setReceiptImageModal(url)} className="h-14 w-14 overflow-hidden rounded-lg border border-slate-700"><img src={url} alt="إيصال سداد" className="h-full w-full object-cover" /></button>)}</div></div>}
                            </div>
                        </section>
                    </div>}
                </section>
            );
        };

        const WeddingCalendar = ({ weddings, onDayClick }) => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
            const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();
            const daysInMonth = getDaysInMonth(currentDate.getFullYear(), currentDate.getMonth());
            const firstDay = getFirstDayOfMonth(currentDate.getFullYear(), currentDate.getMonth());
            const weekDays = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const prevMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1));
            const nextMonth = () => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1));
            const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

            const renderDays = () => {
                let days = [];
                for (let i = 0; i < firstDay; i++) days.push(<div key={`empty-${i}`} className="p-2 opacity-10"></div>);
                for (let d = 1; d <= daysInMonth; d++) {
                    const checkDateStr = `${currentDate.getFullYear()}-${String(currentDate.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const dayEvents = weddings.filter(w => w.weddingDate === checkDateStr || w.casualShootDate === checkDateStr);
                    const hasWedding = dayEvents.some(w => w.weddingDate === checkDateStr);
                    const hasCasual = dayEvents.some(w => w.casualShootDate === checkDateStr);
                    const isToday = checkDateStr === new Date().toISOString().split('T')[0];

                    days.push(
                        <div key={d} onClick={() => onDayClick(checkDateStr)} className={`p-1 sm:p-2 border border-slate-800 rounded-lg flex flex-col items-center justify-start h-12 sm:h-16 relative transition-colors cursor-pointer hover:bg-slate-800 ${isToday ? 'bg-slate-800/80 border-slate-600' : 'bg-slate-950'}`}>
                            <span className={`text-xs sm:text-sm font-bold ${isToday ? 'text-white' : 'text-slate-400'}`}>{d}</span>
                            <div className="flex gap-1 mt-1">
                                {hasWedding && <div className="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-pink-500 shadow-[0_0_5px_#ec4899]"></div>}
                                {hasCasual && <div className="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-teal-500 shadow-[0_0_5px_#14b8a6]"></div>}
                            </div>
                        </div>
                    );
                }
                return days;
            };

            return (
                <div className="w-full">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-100"><i className="ph-fill ph-calendar text-xl sm:text-2xl text-indigo-400"></i> جدول المواعيد</h2>
                        <div className="flex items-center gap-3">

              <div className="space-y-6">
                <div className={"grid grid-cols-1 gap-3 bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-800 items-stretch " + (totalDebts > 0 ? "lg:grid-cols-4 sm:grid-cols-2" : "lg:grid-cols-3 sm:grid-cols-3")}>
                  <button onClick={() => { setIsEditing(false); setFormData({ groomName:'', brideName:'', phone:'', groomAddress:'', weddingDate:'', location:'', makeupArtist:'', leaveTime:'', sessionType:'', casualShootDate:'', packages:[], addons:[], selectedPromos:[], photoNo: [{number: '', note: '', needsName: false}], writeNameOnPhoto: false, total:'', paid:'', paymentMethod:'cash', photosLink:'', useReward: false, rewardDiscount: 0, bookedBy: 'studio', employeeName: '' }); setShowAddModal(true); setCustomerRewards({ earned: 0, used: 0, balance: 0 }); }} className="w-full h-12 sm:h-14 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-pink-900/50 text-sm sm:text-base"><i className="ph ph-heart text-xl sm:text-2xl"></i> حجز زفاف جديد</button>
                  {totalDebts > 0 && <button onClick={() => setShowDebtsModal(true)} className="w-full h-12 sm:h-14 bg-red-950/40 hover:bg-red-900/60 border border-red-900/50 text-red-400 font-bold rounded-xl transition-colors flex items-center justify-center gap-2 shadow-sm relative group text-sm sm:text-base"><i className="ph-fill ph-warning-circle text-lg sm:text-xl group-hover:scale-110 transition-transform"></i>ديون ({uniqueDebtorsCount}) عميل<span className="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full shadow-md animate-pulse">هام</span></button>}
                  <div className="relative w-full h-12 sm:h-14"><i className="ph ph-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl"></i><input type="text" placeholder="ابحث باسم العريس، العروسة، الهاتف، رقم الصورة..." className="w-full h-full pr-11 pl-3 border border-slate-700 bg-slate-950 text-white placeholder-slate-500 rounded-xl focus:border-pink-500 focus:ring-1 focus:ring-pink-500 outline-none text-sm transition-colors" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
                  <div className="flex gap-2 w-full h-12 sm:h-14 shrink-0">
                      <input type="date" title="تصفية بيوم محدد" className="flex-1 h-full px-3 border border-slate-700 bg-slate-950 text-slate-300 rounded-xl focus:border-pink-500 outline-none text-sm transition-colors cursor-pointer" value={filterDate} onChange={(e) => setFilterDate(e.target.value)} lang="en" dir="ltr" />
                      {filterDate && <button onClick={() => setFilterDate('')} className="h-full px-4 bg-slate-800 hover:bg-red-900/50 text-slate-400 hover:text-red-400 rounded-xl transition-colors shrink-0"><i className="ph ph-x text-lg"></i></button>}
                  </div>
                  <button type="button" onClick={() => setInvalidPhoneOnly(value => !value)} aria-pressed={invalidPhoneOnly} className={`min-h-11 rounded-xl border px-3 py-2 text-xs font-bold transition-colors ${invalidPhoneOnly ? 'border-red-400 bg-red-950/50 text-red-200' : 'border-slate-700 bg-slate-950 text-slate-300 hover:border-red-400/50'}`}>
                    <i className="ph-fill ph-phone-slash ml-1"></i>{invalidPhoneOnly ? 'عرض كل الحجوزات' : `حجوزات بلا هاتف مكتمل (${weddings.filter(t => !isValidCustomerPhone(t.phone)).length})`}
                  </button>
                </div>

                {!isFiltering && <WeddingScheduleView weddings={weddings} onEventClick={(txn) => setHistoryPhone(txn.phone)} onDayClick={handleDayClick} />}
                
                <div className="bg-slate-900 p-6 rounded-2xl shadow-sm border border-slate-800">
                  <h2 className="text-xl font-bold mb-4 flex items-center justify-between text-slate-100 border-b border-slate-800 pb-4">
                    <div className="flex items-center gap-2"><i className="ph ph-calendar-heart text-pink-400 text-2xl"></i> {isFiltering ? 'نتائج البحث والفلتر' : 'حجوزات الزفاف اليوم'}</div>
                    <div className="flex flex-wrap items-center gap-2 justify-end">
                        <span className="bg-green-500/10 text-green-400 border border-green-500/30 px-3 sm:px-4 py-1.5 rounded-xl text-xs sm:text-sm font-black flex items-center gap-1.5 shadow-sm"><i className="ph-fill ph-money text-base sm:text-lg"></i> {revenueLabel}: {formatCurrency(currentTotalCollected)}</span>
                        <span className="bg-pink-500/10 text-pink-400 border border-pink-500/30 px-4 py-1.5 rounded-xl text-sm font-black flex items-center gap-2 shadow-sm"><i className="ph-fill ph-chart-bar text-lg"></i> {filteredWeds.length} حجز</span>
                    </div>
                  </h2>
                  <div className="space-y-4">
                    {filteredWeds.length === 0 ? <p className="text-center p-10 text-slate-500">لا توجد نتائج هنا.</p> : filteredWeds.map(txn => <TransactionCard key={txn.id} txn={txn} onDelete={handleDelete} onEdit={handleEdit} onPayRemaining={setPayModal} onViewReceipt={setReceiptImageModal} sendInvoice={() => openWhatsApp(txn.phone, generateWA_Message('invoice', txn, settings, true, allRecords))} updateStatus={updateTxnStatus} onViewHistory={(phone) => setHistoryPhone(phone)} db={db} settings={settings} allRecords={allRecords} />)}
                  </div>
                </div>

                {showDebtsModal && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 m-auto" onClick={() => setShowDebtsModal(false)}>
                        <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-2xl relative max-h-[90vh] flex flex-col m-auto" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setShowDebtsModal(false)} className="absolute top-4 left-4 p-2 text-slate-500 hover:text-red-400 transition-colors z-10"><i className="ph ph-x text-2xl"></i></button>
                            <h3 className="text-xl font-black mb-6 border-b border-slate-800 pb-4 text-red-400 flex items-center gap-2 shrink-0"><i className="ph-fill ph-warning-circle text-2xl"></i> إدارة الديون المستحقة (حجوزات الزفاف)</h3>
                            <div className="relative mb-6 shrink-0 group"><div className="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none"><i className="ph ph-magnifying-glass text-slate-400 group-focus-within:text-red-400 text-xl transition-colors"></i></div><input type="text" placeholder="ابحث باسم العريس أو العروسة، رقم الهاتف..." className="w-full p-4 pr-12 border-2 border-slate-800 bg-slate-950/50 text-white placeholder-slate-500 rounded-2xl focus:border-red-500/50 focus:bg-slate-900 outline-none text-sm transition-all shadow-inner" value={debtSearch} onChange={(e) => setDebtSearch(e.target.value)} /></div>
                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                                {filteredDebts.length === 0 ? <p className="text-center text-slate-500 py-6 bg-slate-950 rounded-xl border border-slate-800 border-dashed">لا توجد ديون مطابقة للبحث.</p> : filteredDebts.map(txn => (
                                    <div key={txn.id} onClick={() => setHistoryPhone(txn.phone)} className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-slate-950 rounded-2xl border border-slate-800 gap-4 hover:border-red-500/30 transition-all shadow-sm mb-3 cursor-pointer">
                                        <div>
                                            <span className="font-bold text-sm text-pink-300">{`${txn.groomName || ''} و ${txn.brideName || ''}`}</span>
                                            <div className="text-xs text-slate-500 mt-1 font-mono flex items-center gap-2"><span>📞 {txn.phone}</span><span>|</span><span>#{txn.receiptNo}</span></div>
                                        </div>
                                        <div className="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto mt-3 sm:mt-0 pt-3 sm:pt-0 border-t border-slate-800 sm:border-0">
                                            <span className="text-red-400 font-black text-sm bg-red-950/30 px-3 py-1.5 rounded-lg border border-red-900/30 ml-auto sm:ml-4">{txn.remaining} ج.م</span>
                                            <div className="flex flex-wrap gap-2 justify-end">
                                                <button onClick={(e) => { e.stopPropagation(); setPayModal({...txn, paymentType: 'cash'}); setShowDebtsModal(false); }} className="bg-yellow-600 hover:bg-yellow-500 text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5"><i className="ph ph-money text-base"></i> نقدي</button>
                                                <button onClick={(e) => { e.stopPropagation(); setPayModal({...txn, paymentType: 'electronic'}); setShowDebtsModal(false); }} className="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5"><i className="ph ph-wallet text-base"></i> إلكتروني</button>
                                                <button onClick={(e) => { e.stopPropagation(); openWhatsApp(txn.phone, generateWA_Message('reminder', txn, settings, true, allRecords)); }} className="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-1.5" title="إرسال تذكير عبر واتساب"><i className="ph ph-whatsapp-logo text-base"></i> تذكير</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

                {showAddModal && (
                  <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-[130] p-4">
                    <div className="bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-4xl relative max-h-[90vh] overflow-y-auto custom-scrollbar m-auto">
                      <button onClick={() => { setShowAddModal(false); setLoyaltyAlert(''); }} className="absolute top-4 left-4 p-2 text-slate-500 hover:text-red-400"><i className="ph ph-x text-xl"></i></button>
                      <h2 className="text-xl font-black mb-6 text-slate-100 border-b border-slate-800 pb-3">{isEditing ? 'تعديل الحجز' : 'حجز زفاف جديد'}</h2>
                      <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="bg-pink-900/30 p-3 rounded-xl flex justify-between items-center text-sm font-bold text-pink-300 border border-pink-800/50"><span>رقم الإيصال:</span><span className="text-lg">#{isEditing ? formData.receiptNo : settings.nextReceiptNo}</span></div>
                        
                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
                            <label className="text-sm font-bold text-slate-400 mb-3 block"><i className="ph-fill ph-user-focus text-pink-400 text-lg align-middle"></i> مصدر الحجز (المكافآت والعمولات):</label>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <select value={formData.bookedBy} onChange={e => setFormData({...formData, bookedBy: e.target.value})} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-xl focus:border-pink-500 outline-none text-sm font-bold">
                                    <option value="studio">تم الحجز بواسطة الاستوديو</option>
                                    <option value="employee">تم الحجز بواسطة موظف</option>
                                </select>
                                {formData.bookedBy === 'employee' && (
                                    <input type="text" placeholder="اسم الموظف" required className="w-full p-3 border border-slate-700 bg-slate-900 text-white placeholder-slate-500 rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.employeeName} onChange={e => setFormData({...formData, employeeName: e.target.value})} />
                                )}
                            </div>
                            {formData.bookedBy === 'employee' && !isEditing && (
                                <p className="text-xs text-green-400 mt-2 font-bold"><i className="ph-fill ph-info"></i> سيتم إضافة حافز بقيمة 250 ج.م تلقائياً لـ "{formData.employeeName || 'الموظف'}" في المصروفات بعد الحفظ.</p>
                            )}
                        </div>

                        {loyaltyAlert && <div className="bg-yellow-950/40 border border-yellow-500/50 text-yellow-400 p-3 rounded-xl text-sm font-bold shadow-inner">{loyaltyAlert}</div>}
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">اسم العريس</label><input type="text" placeholder="الاسم" required className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.groomName} onChange={e => setFormData({...formData, groomName: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">اسم العروسة</label><input type="text" placeholder="الاسم" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.brideName} onChange={e => setFormData({...formData, brideName: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">رقم الهاتف</label><input type="tel" inputMode="numeric" maxLength="15" placeholder="01XXXXXXXXX (اختياري)" className={`w-full p-3 border bg-slate-950 text-white rounded-xl outline-none text-sm ${formData.phone && !isValidCustomerPhone(formData.phone) ? 'border-amber-500' : 'border-slate-700 focus:border-pink-500'}`} value={formData.phone} onChange={e => handlePhoneChange(e.target.value)} onBlur={() => { if(formData.phone && !isValidCustomerPhone(formData.phone)) setFormData(prev => ({...prev, phone:''})); }} />{formData.phone && !isValidCustomerPhone(formData.phone) && <small className="text-[10px] text-amber-300">الهاتف غير صالح؛ سيُسجل الحجز بلا هاتف إن لم يتم تصحيحه.</small>}</div>
                          <div className="sm:col-span-2 lg:col-span-3"><label className="block text-xs font-bold text-slate-400 mb-1">عنوان العريس</label><input type="text" placeholder="العنوان بالتفصيل" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.groomAddress} onChange={e => setFormData({...formData, groomAddress: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">تاريخ الزفاف</label><input type="date" required className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.weddingDate} onChange={e => setFormData({...formData, weddingDate: e.target.value})} lang="en" dir="ltr" /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">اللوكيشن / القاعة</label><input type="text" placeholder="المكان" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.location} onChange={e => setFormData({...formData, location: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">الميك أب (Makeup Artist)</label><input type="text" placeholder="اسم الكوافير" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.makeupArtist} onChange={e => setFormData({...formData, makeupArtist: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">وقت الخروج</label><input type="time" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.leaveTime} onChange={e => setFormData({...formData, leaveTime: e.target.value})} lang="en" dir="ltr" /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">نوع السيشن</label><input type="text" placeholder="مثال: داي يوز، سيشن فقط..." className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.sessionType} onChange={e => setFormData({...formData, sessionType: e.target.value})} /></div>
                          <div><label className="block text-xs font-bold text-slate-400 mb-1">تاريخ تصوير الكاجوال</label><input type="date" className="w-full p-3 border border-slate-700 bg-slate-950 text-white rounded-xl focus:border-pink-500 outline-none text-sm" value={formData.casualShootDate} onChange={e => setFormData({...formData, casualShootDate: e.target.value})} lang="en" dir="ltr" /></div>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <label className="text-sm font-bold text-slate-400 mb-3 block"><i className="ph ph-package text-pink-400 text-lg align-middle"></i> باقات الزفاف المتاحة:</label>
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            {settings.weddingPackages && settings.weddingPackages.map((pkg, idx) => {
                               const isSelected = formData.packages.some(p => p.name === pkg.name);
                               const currentPkg = isSelected ? formData.packages.find(p => p.name === pkg.name) : pkg;
                               return (
                                  <div key={idx} className={`p-3 rounded-xl border flex flex-col gap-2 transition-all ${isSelected ? 'bg-pink-900/20 border-pink-500 shadow-inner' : 'bg-slate-900 border-slate-700 hover:border-pink-500/50 cursor-pointer'}`} onClick={() => !isSelected && handleSelectPackage(pkg)}>
                                     <div className="flex justify-between items-start">
                                        <div className="flex items-center gap-2" onClick={(e) => { if(isSelected){ e.stopPropagation(); handleSelectPackage(pkg); } }}>
                                           <div className={`w-5 h-5 rounded flex items-center justify-center border ${isSelected ? 'bg-pink-500 border-pink-500 text-white' : 'border-slate-500'}`}><i className="ph-bold ph-check text-xs"></i></div>
                                           <span className={`font-bold text-sm ${isSelected ? 'text-pink-400' : 'text-slate-300'}`}>{pkg.name}</span>
                                        </div>
                                        {isSelected ? (
                                            <input type="number" onClick={e=>e.stopPropagation()} value={currentPkg.price} onChange={e => handleUpdatePackagePrice(pkg.name, parseFloat(e.target.value)||0)} className="w-20 p-1 bg-slate-950 border border-slate-700 rounded text-white text-center text-xs outline-none" />
                                        ) : <span className="text-pink-400 font-bold text-xs">{pkg.price} ج.م</span>}
                                     </div>
                                     <span className="text-[10px] text-slate-500 pr-7">{pkg.desc}</span>
                                  </div>
                               )
                            })}
                          </div>
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                          <label className="text-sm font-bold text-slate-400 mb-3 block"><i className="ph ph-plus-circle text-pink-400 text-lg align-middle"></i> إضافة (حنة / كتب كتاب / ألبوم ميني):</label>
                          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
                             <select value={newAddon.name} onChange={e => {
                                const tpl = settings.addonTemplates?.find(t => t.name === e.target.value);
                                if(tpl) setNewAddon({...newAddon, name: tpl.name, price: tpl.price, notes: tpl.desc});
                                else setNewAddon({...newAddon, name: e.target.value});
                             }} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg focus:border-pink-500 outline-none text-sm">
                                <option value="">اختر قالب...</option>
                                {settings.addonTemplates && settings.addonTemplates.map((t,i)=><option key={i} value={t.name}>{t.name}</option>)}
                             </select>
                             <input type="text" placeholder="أو اكتب اسم الإضافة" value={newAddon.name} onChange={e => setNewAddon({...newAddon, name: e.target.value})} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg focus:border-pink-500 outline-none text-sm" />
                             <input type="number" placeholder="السعر" value={newAddon.price} onChange={e => setNewAddon({...newAddon, price: e.target.value})} className="p-3 border border-slate-700 bg-slate-900 text-white rounded-lg focus:border-pink-500 outline-none text-sm" />
                             <button type="button" onClick={handleAddAddon} className="bg-pink-600 hover:bg-pink-500 text-white rounded-lg flex items-center justify-center font-bold text-sm"><i className="ph ph-plus mr-1"></i> إضافة</button>
                          </div>
                          {formData.addons.length > 0 && (
                             <div className="flex flex-col gap-2 mt-3 pt-3 border-t border-slate-800">
                                {formData.addons.map((a, i) => (
                                   <div key={i} className="flex justify-between items-center bg-slate-900 p-2 rounded-lg border border-slate-700">
                                      <div><span className="font-bold text-slate-300 text-sm">{a.name}</span> <span className="text-pink-400 text-xs font-bold mr-2">{a.price} ج.م</span></div>
                                      <button type="button" onClick={() => handleRemoveAddon(i)} className="text-red-400 hover:text-red-300 p-1"><i className="ph ph-x"></i></button>
                                   </div>
                                ))}
                             </div>
                          )}
                        </div>

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mb-4">
                            <label className="text-sm font-bold text-slate-400 mb-3 block"><i className="ph-fill ph-images text-blue-400 text-lg align-middle"></i> أرقام الصور للطباعة (اختياري):</label>
                            <div className="flex flex-col gap-3 w-full">
                                {formData.photoNo.map((pObj, idx) => (
                                <div key={idx} className={`flex flex-col sm:flex-row items-stretch sm:items-center bg-slate-900 border rounded-xl overflow-hidden transition-colors shadow-inner w-full ${pObj.needsName ? 'border-red-500/50 focus-within:border-red-400' : 'border-slate-700 focus-within:border-pink-500'}`}>
                                    <div className="flex items-center w-full sm:w-auto">
                                        <span className={`px-3 py-2.5 font-bold text-xs border-l border-slate-700 whitespace-nowrap ${pObj.needsName ? 'bg-red-950/50 text-red-400' : 'bg-slate-800 text-slate-400'}`}>صورة {idx + 1}</span>
                                        <input type="text" placeholder="رقم..." className="w-full sm:w-20 p-2.5 bg-slate-950 text-white text-center outline-none text-sm font-bold border-b sm:border-b-0 sm:border-l border-slate-700" value={pObj.number} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].number = e.target.value; setFormData({...formData, photoNo: newArr}); }} />
                                    </div>
                                    <div className="flex flex-1 flex-col sm:flex-row items-stretch sm:items-center min-w-0">
                                        <select value={pObj.serviceType || ''} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].serviceType = e.target.value; setFormData({...formData, photoNo: newArr}); }} className="w-full sm:w-36 shrink-0 p-2.5 bg-slate-950 text-blue-200 outline-none text-[11px] font-bold border-b sm:border-b-0 sm:border-r border-slate-700"><option value="">نوع الخدمة...</option>{(settings.services || []).map((srv, si) => { const srvName = typeof srv === 'string' ? srv : srv.name; return <option key={si} value={srvName}>{srvName}</option>; })}</select>
                                        <label className="flex items-center gap-1.5 px-2 py-2 bg-amber-950/30 border-b sm:border-b-0 sm:border-r border-amber-500/20 text-[10px] font-black text-amber-200 whitespace-nowrap"><input type="checkbox" checked={Boolean(pObj.instantPrint)} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].instantPrint = e.target.checked; if (e.target.checked && !pObj.instantPrice) { const srv = (settings.services || []).map(x => typeof x === 'string' ? {name:x} : x).find(x => isInstantPrintLabel(x.name)); newArr[idx].instantPrice = srv?.price || ''; } setFormData({...formData, photoNo: newArr}); }} className="accent-amber-400" /> فوري</label>
                                        {pObj.instantPrint && <><input type="number" min="1" value={pObj.instantQty || 1} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].instantQty = Math.max(1, parseInt(e.target.value || 1)); setFormData({...formData, photoNo: newArr}); }} className="w-16 p-2.5 bg-slate-950 text-amber-100 text-center outline-none text-[10px] font-black border-b sm:border-b-0 sm:border-r border-slate-700" title="عدد الطباعات الفورية" placeholder="العدد" /><input type="number" min="0" value={pObj.instantPrice ?? ''} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].instantPrice = e.target.value; setFormData({...formData, photoNo: newArr}); }} className="w-20 p-2.5 bg-slate-950 text-emerald-100 text-center outline-none text-[10px] font-black border-b sm:border-b-0 sm:border-r border-slate-700" title="سعر الطبعة الواحدة" placeholder="السعر" /></>}
                                        <input type="text" placeholder={pObj.needsName ? "اكتب الاسم المطلوب طباعته هنا..." : "ملاحظات للصورة (اختياري)..."} className="flex-1 min-w-0 p-2.5 bg-transparent text-white outline-none text-xs px-3" value={pObj.note || ''} onChange={e => { const newArr = [...formData.photoNo]; newArr[idx].note = e.target.value; setFormData({...formData, photoNo: newArr}); }} />
                                        <button type="button" onClick={() => { const newArr = [...formData.photoNo]; newArr[idx].needsName = !newArr[idx].needsName; setFormData({...formData, photoNo: newArr}); }} className={`px-3 py-2.5 border-r border-slate-700 transition-colors flex items-center justify-center gap-1 shrink-0 ${pObj.needsName ? 'bg-red-600 text-white hover:bg-red-500' : 'bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700'}`}><i className={`${pObj.needsName ? 'ph-fill' : 'ph'} ph-text-t text-sm`}></i><span className="text-[10px] font-bold hidden sm:inline">{pObj.needsName ? 'إلغاء الاسم' : 'كتابة اسم'}</span></button>
                                        {formData.photoNo.length > 1 && <button type="button" onClick={() => { const newArr = formData.photoNo.filter((_, i) => i !== idx); setFormData({...formData, photoNo: newArr}); }} className="bg-slate-800 hover:bg-red-600 hover:text-white text-slate-400 px-4 py-2.5 transition-colors border-r border-slate-700 shrink-0"><i className="ph ph-x font-bold text-sm"></i></button>}
                                    </div>
                                </div>
                                ))}
                                <button type="button" onClick={() => setFormData({...formData, photoNo: [...formData.photoNo, {number: '', note: '', serviceType: '', needsName: false}]})} className="self-start bg-pink-900/30 hover:bg-pink-800/50 text-pink-400 px-4 py-2 rounded-xl border border-pink-500/30 transition-colors text-sm font-bold flex items-center gap-2 mt-1"><i className="ph ph-plus-circle text-lg"></i> إضافة صورة أخرى</button>
                            </div>
                        </div>

                        <PromoSelector settings={settings} selectedPromos={formData.selectedPromos} onChange={(selected) => setFormData({...formData, selectedPromos: selected})} />

                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 mt-4">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h4 className="text-sm font-bold text-yellow-400 flex items-center gap-1"><i className="ph-fill ph-gift text-lg"></i> رصيد المكافآت للعميل</h4>
                                    <p className="text-xs text-slate-500">رصيد متاح: {customerRewards.balance} ج.م</p>
                                </div>
                                {!isEditing && customerRewards.balance > 0 && (
                                    <label className="flex items-center gap-2 cursor-pointer bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-lg hover:border-yellow-500 transition-colors">
                                        <input type="checkbox" checked={formData.useReward} onChange={(e) => setFormData({...formData, useReward: e.target.checked})} className="w-4 h-4 accent-yellow-500" />
                                        <span className="text-sm font-bold text-slate-300">استخدام الرصيد كخصم</span>
                                    </label>
                                )}
                            </div>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4 border-t border-slate-800 pt-4">
                          <input type="number" placeholder="الإجمالي" className="p-3 border border-slate-700 bg-slate-950 text-white rounded-xl outline-none focus:border-pink-500 text-sm font-bold" value={formData.total} onChange={e => setFormData({...formData, total: e.target.value})} />
                          <input type="number" placeholder="المدفوع كعربون" className="p-3 border border-slate-700 bg-slate-950 text-white rounded-xl outline-none focus:border-green-500 text-sm font-bold" value={formData.paid} onChange={e => setFormData({...formData, paid: e.target.value})} />
                          {!isEditing && <select className="p-3 border border-slate-700 bg-slate-950 text-white rounded-xl outline-none focus:border-indigo-500 col-span-2 md:col-span-1 text-sm font-bold" value={formData.paymentMethod} onChange={e => setFormData({...formData, paymentMethod: e.target.value})}><option value="cash">دفع نقدي</option><option value="electronic">دفع إلكتروني (محافظ/إنستاباي)</option></select>}
                        </div>
                        <div className={`p-3 rounded-xl text-center font-black text-lg border mt-4 ${(displayFinalTotal - (parseFloat(formData.paid)||0)) > 0 ? 'bg-red-950/40 text-red-400 border-red-900/50' : 'bg-green-950/40 text-green-400 border-green-900/50'}`}>
                            الباقي المستحق: {formatCurrency(displayFinalTotal - (parseFloat(formData.paid) || 0))}
                            {formData.useReward && !isEditing && <span className="block text-xs font-normal text-yellow-400 mt-1">(بعد خصم {Math.min(parseFloat(formData.total)||0, customerRewards.balance)} ج.م من رصيد المكافآت)</span>}
                        </div>
                        <button type="submit" className="w-full bg-pink-600 text-white hover:bg-pink-500 font-black py-3 rounded-xl shadow-lg text-sm mt-4"><i className="ph ph-floppy-disk text-lg ml-2 align-middle"></i> حفظ بيانات الزفاف</button>
                      </form>
                    </div>
                  </div>
                )}
                
                <PaymentModal payModal={payModal} setPayModal={setPayModal} db={db} />
                <VisitHistoryModal phone={historyPhone} allRecords={allRecords} onClose={() => setHistoryPhone(null)} />
            </div>
            );
        };

        const ExpensesTab = ({ settings, setSettings, expenses, inventory, db }) => {
            const currentMonth = new Date().getMonth() + 1;
            const currentYear = new Date().getFullYear();
            const [expData, setExpData] = useState({ amount: '', category: settings.expenseCategories[0], notes: '', type: 'studio', date: new Date().toISOString().split('T')[0] });
            const [showMonthModal, setShowMonthModal] = useState(false);
            const [printShopName, setPrintShopName] = useState('');
            const [printDate, setPrintDate] = useState(() => getLocalDateKey());
            const [printProductQuantities, setPrintProductQuantities] = useState({});
            const [printDraftItems, setPrintDraftItems] = useState([]);
            const [printPaidDraft, setPrintPaidDraft] = useState('0');
            const [printRecords, setPrintRecords] = useState([]);
            const [isLoadingPrintRecords, setIsLoadingPrintRecords] = useState(true);
            const [printRecordsError, setPrintRecordsError] = useState('');
            const [isSavingPrintRecord, setIsSavingPrintRecord] = useState(false);
            const [editingPrintRecordId, setEditingPrintRecordId] = useState(null);
            
            const [filterMonth, setFilterMonth] = useState(currentMonth);
            const [filterYear, setFilterYear] = useState(currentYear);
            const [instantSheetPrice, setInstantSheetPrice] = useState(settings.instantPrintSheetPrice || '');
            const [inventoryDrafts, setInventoryDrafts] = useState({});
            useEffect(() => {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                return onSnapshot(collection(db, `artifacts/${appId}/public/data/printingLedger`), snapshot => {
                    const records = snapshot.docs.map(item => ({ ...item.data(), id: item.id }));
                    records.sort((a, b) => String(b.printDate || '').localeCompare(String(a.printDate || '')) || new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                    setPrintRecords(records);
                    setPrintRecordsError('');
                    setIsLoadingPrintRecords(false);
                }, error => {
                    console.error('تعذر تحميل سجل المطبعة:', error);
                    setPrintRecordsError('تعذر تحميل سجل المطبعة. تحقق من الاتصال ثم أعد المحاولة.');
                    setIsLoadingPrintRecords(false);
                });
            }, [db]);
            useEffect(() => {
                if (!inventory) return;
                setInventoryDrafts(prev => {
                    const next = { ...prev };
                    let changed = false;
                    Object.entries(prev).forEach(([itemName, value]) => {
                        if (inventory[itemName] !== undefined && Number(inventory[itemName]) === Number(value)) {
                            delete next[itemName];
                            changed = true;
                        }
                    });
                    return changed ? next : prev;
                });
            }, [inventory]);
            const saveInstantSheetPrice = async () => { const value = Math.max(0, Number(instantSheetPrice) || 0); const nextSettings = { ...settings, instantPrintSheetPrice: value }; setSettings(nextSettings); const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby'; await setDoc(doc(db, `artifacts/${appId}/public/data/settings`, 'main'), nextSettings, { merge: true }); };

            const handleAddExpense = async (e) => {
              e.preventDefault();
              const selectedDate = new Date(expData.date);
              const newExp = { 
                  id: Date.now().toString(), 
                  date: selectedDate.toISOString(), 
                  amount: parseFloat(expData.amount), 
                  category: expData.category, 
                  notes: expData.notes, 
                  month: selectedDate.getMonth() + 1, 
                  year: selectedDate.getFullYear(), 
                  type: expData.type 
              };
              const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
              await setDoc(doc(db, `artifacts/${appId}/public/data/expenses`, newExp.id), newExp);
              setExpData({ amount: '', category: settings.expenseCategories[0], notes: '', type: 'studio', date: new Date().toISOString().split('T')[0] });
            };

            const todaysExpenses = expenses.filter(e => new Date(e.date).toDateString() === new Date().toDateString());
            const todayTotalExp = todaysExpenses.reduce((sum, e) => sum + e.amount, 0);
            
            const filteredMonthExpenses = expenses.filter(e => e.month === parseInt(filterMonth) && e.year === parseInt(filterYear));
            const filteredMonthTotalExp = filteredMonthExpenses.reduce((sum, e) => sum + e.amount, 0);

            const printTotalAmount = Math.round(printDraftItems.reduce((sum, item) => sum + ((Number(item.quantity) || 0) * (Number(item.unitPrice) || 0)), 0) * 100) / 100;
            const printHasSalePrices = printDraftItems.every(item => item.salePrice !== undefined && item.salePrice !== null && item.salePrice !== '');
            const printSalesTotalAmount = printHasSalePrices ? Math.round(printDraftItems.reduce((sum, item) => sum + ((Number(item.quantity) || 0) * (Number(item.salePrice) || 0)), 0) * 100) / 100 : null;
            const printProfitAmount = printSalesTotalAmount === null ? null : Math.round((printSalesTotalAmount - printTotalAmount) * 100) / 100;
            const printTotalServiceCount = printDraftItems.reduce((sum, item) => sum + (Number(item.quantity) || 0), 0);
            const printRemainingAmount = Math.max(0, Math.round((printTotalAmount - (Number(printPaidDraft) || 0)) * 100) / 100);
            const printShopOutstanding = Math.round(printRecords.reduce((sum, record) => sum + (Number(record.remainingAmount) || 0), 0) * 100) / 100;
            const printProductTemplates = (settings.products || []).map((product, index) => {
                const template = typeof product === 'string' ? { name: product, price: 0, wholesalePrice: 0, desc: '' } : product;
                return { ...template, templateKey: `${index}-${template.name}`, purchasePrice: Number(template.wholesalePrice ?? 0), salePrice: Number(template.price ?? 0) };
            });
            const addPrintTemplate = (template) => {
                const quantity = Number(printProductQuantities[template.templateKey]);
                if (!Number.isSafeInteger(quantity) || quantity < 1) { alert('حدد عددًا صحيحًا أكبر من صفر للمنتج.'); return; }
