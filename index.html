                if (!Number.isFinite(template.purchasePrice) || template.purchasePrice < 0 || !Number.isFinite(template.salePrice) || template.salePrice < 0) { alert('تحقق من سعر البيع وسعر الجملة في قالب المنتج داخل الإعدادات.'); return; }
                setPrintDraftItems(prev => {
                    const existing = prev.find(item => item.templateKey === template.templateKey && Number(item.unitPrice) === template.purchasePrice && Number(item.salePrice) === template.salePrice);
                    if (existing) return prev.map(item => item.id === existing.id ? { ...item, quantity: Number(item.quantity) + quantity } : item);
                    return [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`, templateKey: template.templateKey, name: template.name, quantity, unitPrice: template.purchasePrice, salePrice: template.salePrice }];
                });
                setPrintProductQuantities(prev => ({ ...prev, [template.templateKey]: '' }));
            };
            const adjustPrintProductQuantity = (templateKey, delta) => {
                setPrintProductQuantities(prev => {
                    const current = Number(prev[templateKey]);
                    const safeCurrent = Number.isFinite(current) ? Math.max(0, Math.trunc(current)) : 0;
                    return { ...prev, [templateKey]: String(Math.max(0, safeCurrent + delta)) };
                });
            };
            const updatePrintDraftItem = (lineId, field, value) => setPrintDraftItems(prev => prev.map(item => item.id === lineId ? { ...item, [field]: value } : item));
            const removePrintDraftItem = (lineId) => setPrintDraftItems(prev => prev.filter(item => item.id !== lineId));
            const savePrintRecord = async (event) => {
                event.preventDefault();
                if (!printShopName.trim()) { alert('اكتب اسم المطبعة أولًا.'); return; }
                if (!printDate) { alert('اختر تاريخ الطباعة.'); return; }
                if (!printDraftItems.length) { alert('أضف المنتجات المطلوبة إلى الفاتورة أولًا.'); return; }
                const linesAreValid = printDraftItems.every(item => {
                    const salePriceIsKnown = item.salePrice !== undefined && item.salePrice !== null && item.salePrice !== '';
                    return item.name && Number.isSafeInteger(Number(item.quantity)) && Number(item.quantity) > 0 && Number.isFinite(Number(item.unitPrice)) && Number(item.unitPrice) >= 0 && (!salePriceIsKnown || (Number.isFinite(Number(item.salePrice)) && Number(item.salePrice) >= 0));
                });
                if (!linesAreValid) { alert('تحقق من عدد كل منتج وأسعاره في قوالب الإعدادات.'); return; }
                const items = printDraftItems.map(item => {
                    const purchaseSubtotal = Math.round(Number(item.quantity) * Number(item.unitPrice) * 100) / 100;
                    const line = { name: item.name, quantity: Number(item.quantity), purchasePrice: Number(item.unitPrice), unitPrice: Number(item.unitPrice), purchaseSubtotal, subtotal: purchaseSubtotal };
                    if (item.salePrice !== undefined && item.salePrice !== null && item.salePrice !== '') {
                        line.salePrice = Number(item.salePrice);
                        line.saleSubtotal = Math.round(Number(item.quantity) * Number(item.salePrice) * 100) / 100;
                    }
                    return line;
                });
                const totalAmount = Math.round(items.reduce((sum, item) => sum + item.subtotal, 0) * 100) / 100;
                const saleTotalAmount = items.every(item => Number.isFinite(item.saleSubtotal)) ? Math.round(items.reduce((sum, item) => sum + item.saleSubtotal, 0) * 100) / 100 : undefined;
                const paidAmount = Number(printPaidDraft || 0);
                if (!Number.isFinite(paidAmount) || paidAmount < 0 || paidAmount > totalAmount) { alert('تحقق من قيمة المدفوع؛ يجب أن تكون بين صفر وإجمالي الحساب.'); return; }
                const existingRecord = editingPrintRecordId ? printRecords.find(item => item.id === editingPrintRecordId) : null;
                const id = editingPrintRecordId || `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                const record = { ...(existingRecord || {}), id, printerName: printShopName.trim(), printDate, items, serviceCount: items.reduce((sum, item) => sum + item.quantity, 0), totalAmount, purchaseTotalAmount: totalAmount, paidAmount: Math.round(paidAmount * 100) / 100, remainingAmount: Math.max(0, Math.round((totalAmount - paidAmount) * 100) / 100), createdAt: existingRecord?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
                if (saleTotalAmount === undefined) { delete record.saleTotalAmount; delete record.profitAmount; }
                else { record.saleTotalAmount = saleTotalAmount; record.profitAmount = Math.round((saleTotalAmount - totalAmount) * 100) / 100; }
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                setIsSavingPrintRecord(true);
                try {
                    await setDoc(doc(db, `artifacts/${appId}/public/data/printingLedger`, id), record);
                    setPrintDate(getLocalDateKey());
                    setPrintProductQuantities({});
                    setPrintDraftItems([]);
                    setPrintPaidDraft('0');
                    setEditingPrintRecordId(null);
                } catch (error) {
                    console.error('تعذر حفظ حساب المطبعة:', error);
                    alert('تعذر حفظ حساب المطبعة. حاول مرة أخرى.');
                } finally {
                    setIsSavingPrintRecord(false);
                }
            };
            const deletePrintRecord = async (record) => {
                if (!window.confirm(`حذف حساب الطباعة بتاريخ ${formatDateOnly(record.printDate)} للمطبعة ${record.printerName}؟`)) return;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
                try {
                    await deleteDoc(doc(db, `artifacts/${appId}/public/data/printingLedger`, record.id));
                } catch (error) {
                    console.error('تعذر حذف سجل المطبعة:', error);
                    alert('تعذر حذف السجل. حاول مرة أخرى.');
                }
            };
            const startEditingPrintRecord = (record) => {
                setEditingPrintRecordId(record.id);
                setPrintShopName(record.printerName || '');
                setPrintDate(record.printDate || getLocalDateKey());
                setPrintPaidDraft(String(record.paidAmount ?? 0));
                setPrintDraftItems((record.items || []).map((item, index) => ({
                    id: `edit-${record.id}-${index}`,
                    templateKey: item.templateKey || `saved-${record.id}-${index}`,
                    name: item.name || 'منتج',
                    quantity: String(item.quantity ?? 1),
                    unitPrice: Number(item.purchasePrice ?? item.unitPrice ?? 0),
                    salePrice: item.salePrice !== undefined && item.salePrice !== null ? Number(item.salePrice) : item.saleSubtotal !== undefined && Number(item.quantity) > 0 ? Number(item.saleSubtotal) / Number(item.quantity) : undefined
                })));
                document.getElementById('print-invoice-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            const cancelPrintRecordEdit = () => {
                setEditingPrintRecordId(null);
                setPrintShopName('');
                setPrintDate(getLocalDateKey());
                setPrintPaidDraft('0');
                setPrintDraftItems([]);
            };

            const inventoryItemsList = useMemo(() => {
               return [{name: "ورق طباعة صور"}];
            }, []);

            const writeInventoryValue = async (itemName, quantity) => {
               const newInv = { [itemName]: quantity };
               const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby';
               setInventoryDrafts(prev => ({ ...prev, [itemName]: String(quantity) }));
               await setDoc(doc(db, `artifacts/${appId}/public/data/inventory`, 'main'), newInv, { merge: true });
            };

            const updateInventory = async (itemName, change, fallbackStock = 0) => {
               const baseStock = Number(inventoryDrafts[itemName] ?? (inventory[itemName] !== undefined ? inventory[itemName] : fallbackStock));
               if (!Number.isSafeInteger(baseStock) || baseStock < 0) { alert('أدخل كمية صحيحة قبل استخدام أزرار الزيادة أو النقصان.'); return; }
               await writeInventoryValue(itemName, Math.max(0, baseStock + change));
            };

            const saveInventoryQuantity = async (itemName, rawValue) => {
               const raw = String(rawValue ?? '').trim();
               const quantity = Number(raw);
               if (!raw || !Number.isSafeInteger(quantity) || quantity < 0) { alert('أدخل كمية صحيحة أكبر من أو تساوي صفرًا.'); return; }
               try {
                   await writeInventoryValue(itemName, quantity);
               } catch (error) {
                   console.error('تعذر حفظ كمية المخزون:', error);
                   alert('تعذر حفظ الكمية. حاول مرة أخرى.');
               }
            };

            return (
              <div className="grid min-w-0 grid-cols-1 gap-4 sm:gap-5 xl:grid-cols-3 xl:gap-6">
                <div className="grid min-w-0 grid-cols-1 gap-4 sm:gap-5 xl:col-span-2 xl:gap-6 lg:grid-cols-2 lg:gap-6">
                   <div className="grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4 lg:col-span-2">
                       <div className="flex min-w-0 items-center justify-between rounded-2xl border border-red-900/50 bg-gradient-to-l from-red-950/40 to-slate-900 p-4 shadow-inner sm:p-5">
                           <div className="min-w-0"><p className="text-slate-400 text-sm font-bold">مصروفات اليوم</p><p className="mt-1 break-words text-xl font-black text-red-400 sm:text-2xl">{formatCurrency(todayTotalExp)}</p></div>
                           <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-red-500/30 bg-red-500/20 text-red-400"><i className="ph-fill ph-calendar-blank text-2xl"></i></div>
                       </div>
                       <div onClick={() => setShowMonthModal(true)} className="group flex min-w-0 cursor-pointer items-center justify-between rounded-2xl border border-red-900/50 bg-gradient-to-l from-red-950/40 to-slate-900 p-4 shadow-inner transition-all hover:border-red-500/30 hover:bg-red-950/20 sm:p-5">
                           <div className="min-w-0"><p className="text-slate-400 text-sm font-bold group-hover:text-slate-300">سجل المصروفات (شهري)</p><p className="mt-1 break-words text-xl font-black text-red-400 sm:text-2xl">{formatCurrency(filteredMonthTotalExp)}</p></div>
                           <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-red-500/30 bg-red-500/20 text-red-400 transition-transform group-hover:scale-110"><i className="ph-fill ph-folders text-2xl"></i></div>
                       </div>
                   </div>

                   <div className="min-w-0 rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-sm sm:p-5 lg:col-start-1 lg:row-start-2 lg:p-6">
                     <h2 className="mb-4 flex items-center gap-2 border-b border-slate-800 pb-4 text-lg font-bold text-slate-100 sm:text-xl"><i className="ph ph-money text-2xl text-red-400"></i> تسجيل مصروفات</h2>
                     <form onSubmit={handleAddExpense} className="grid min-w-0 grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4">
                       <div className="min-w-0"><label className="mb-1 block text-xs font-bold text-slate-400">المبلغ</label><input type="number" required placeholder="ج.م" value={expData.amount} onChange={e => setExpData({...expData, amount: e.target.value})} className="w-full min-w-0 rounded-lg border border-slate-700 bg-slate-950 p-2.5 font-bold text-white outline-none focus:border-red-500" /></div>
                       <div className="min-w-0"><label className="mb-1 block text-xs font-bold text-slate-400">التاريخ</label><input type="date" required value={expData.date} onChange={e => setExpData({...expData, date: e.target.value})} lang="en" dir="ltr" className="w-full min-w-0 rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm text-white outline-none focus:border-red-500" /></div>
                       <div className="min-w-0"><label className="mb-1 block text-xs font-bold text-slate-400">البند</label><select value={expData.category} onChange={e => setExpData({...expData, category: e.target.value})} className="w-full min-w-0 rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm text-white outline-none focus:border-red-500">{settings.expenseCategories.map((cat, idx) => <option key={idx} value={cat}>{cat}</option>)}</select></div>
                       <div className="min-w-0"><label className="mb-1 block text-xs font-bold text-slate-400">النوع</label><select value={expData.type} onChange={e => setExpData({...expData, type: e.target.value})} className="w-full min-w-0 rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm font-bold text-white outline-none focus:border-red-500"><option value="studio">استوديو</option><option value="wedding">زفاف</option></select></div>
                       <div className="min-w-0 sm:col-span-2"><label className="mb-1 block text-xs font-bold text-slate-400">ملاحظات</label><input type="text" placeholder="ملاحظات..." value={expData.notes} onChange={e => setExpData({...expData, notes: e.target.value})} className="w-full min-w-0 rounded-lg border border-slate-700 bg-slate-950 p-2.5 text-sm text-white outline-none focus:border-red-500" /></div>
                       <button type="submit" className="mt-1 flex w-full items-center justify-center gap-2 rounded-lg bg-red-600 py-3 font-bold text-white shadow-md transition-all hover:bg-red-500 sm:col-span-2"><i className="ph ph-plus-circle text-xl"></i> إضافة المصروف</button>
                     </form>
                   </div>
                   
                   <div className="min-w-0 rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-sm sm:p-5 lg:col-start-1 lg:row-start-3 lg:p-6">
                      <h2 className="mb-4 flex items-center justify-between border-b border-slate-800 pb-4 text-lg font-bold text-slate-100 sm:text-xl"><span>سجل مصروفات اليوم</span></h2>
                      <div className="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-1">
                        {todaysExpenses.length === 0 ? <p className="text-slate-500 text-center p-6 bg-slate-950 rounded-xl border border-slate-800 border-dashed">لم يتم تسجيل مصروفات اليوم.</p> : todaysExpenses.map(exp => (
                          <div key={exp.id} className="flex min-w-0 flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-950 p-3 sm:p-4">
                            <div className="min-w-0 flex-1">
                                <div className="flex min-w-0 flex-wrap items-center gap-2">
                                    <p className="font-bold text-slate-200">{exp.category} <span className="text-red-400 mr-2">{exp.amount} ج.م</span></p>
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${exp.type === 'wedding' ? 'bg-pink-900/40 text-pink-400' : 'bg-blue-900/40 text-blue-400'}`}>{exp.type === 'wedding' ? 'زفاف' : 'استوديو'}</span>
                                </div>
                                {exp.notes && <p className="text-xs text-slate-500 mt-1">{exp.notes}</p>}
                            </div>
                            <button onClick={async () => { const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby'; await deleteDoc(doc(db, `artifacts/${appId}/public/data/expenses`, exp.id)); }} className="text-slate-500 hover:text-red-400 p-2"><i className="ph ph-trash text-xl"></i></button>
                          </div>
                        ))}
                      </div>
                   </div>
                   <section className="min-w-0 overflow-hidden rounded-2xl border border-indigo-400/25 bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950/25 shadow-lg lg:col-start-2 lg:row-span-2 lg:row-start-2">
                     <div className="flex flex-col gap-3 border-b border-slate-800 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
                       <div className="flex min-w-0 items-center gap-3"><span className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-indigo-400/25 bg-indigo-500/10 text-indigo-200"><i className="ph-fill ph-printer text-2xl"></i></span><div className="min-w-0"><h2 className="text-lg font-black text-white">فاتورة المطبعة</h2><p className="mt-1 text-[10px] text-slate-400">اختر قالب المنتج والكمية فقط؛ سعر البيع وسعر الشراء مرتبطان بقوالب الإعدادات.</p></div></div>
                       <div className="shrink-0 rounded-xl border border-red-400/20 bg-red-950/20 px-4 py-2 text-center"><span className="block text-[10px] text-red-200/70">إجمالي المتبقي للمطابع</span><strong className="mt-0.5 block text-base font-black text-red-200">{formatCurrency(printShopOutstanding)}</strong></div>
                     </div>
                     <form id="print-invoice-form" onSubmit={savePrintRecord} className="space-y-4 p-4 sm:p-5">
                       <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
                         <label className="text-xs font-bold text-slate-300">اسم المطبعة<input type="text" required value={printShopName} onChange={event => setPrintShopName(event.target.value)} placeholder="مثال: مطبعة النور" className="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-indigo-400" /></label>
                         <label className="text-xs font-bold text-slate-300">تاريخ الطباعة<input type="date" required lang="en" dir="ltr" value={printDate} onChange={event => setPrintDate(event.target.value)} className="mt-1.5 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 py-2.5 text-sm text-white outline-none focus:border-indigo-400" /></label>
                       </div>
                       <div className="rounded-xl border border-indigo-400/20 bg-indigo-950/10 p-3 sm:p-4">
                         <div className="mb-3 flex items-center justify-between gap-2"><div><h3 className="text-sm font-black text-slate-100">مسودة فاتورة الطباعة</h3><p className="mt-1 text-[10px] text-slate-500">أضف كل الأصناف المطلوبة، ثم احفظ الفاتورة كاملة في السجل.</p></div><span className="rounded-full border border-indigo-400/20 bg-indigo-950/30 px-2.5 py-1 text-[10px] font-bold text-indigo-100">{printTotalServiceCount} خدمة</span></div>
                         {printDraftItems.length === 0 ? <p className="rounded-xl border border-dashed border-slate-700 bg-slate-950/70 p-5 text-center text-xs text-slate-500">لم تضف منتجات إلى الفاتورة بعد.</p> : <div className="space-y-2">
                           {printDraftItems.map(item => {
                             const purchaseSubtotal = Math.round((Number(item.quantity) || 0) * (Number(item.unitPrice) || 0) * 100) / 100;
                             const saleSubtotal = item.salePrice !== undefined && item.salePrice !== null && item.salePrice !== '' ? Math.round((Number(item.quantity) || 0) * Number(item.salePrice) * 100) / 100 : null;
                             return <div key={item.id} className="grid grid-cols-1 items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/80 p-2.5 sm:grid-cols-[minmax(0,1fr)_65px_100px_90px_32px]">
                               <div className="min-w-0"><strong className="block truncate text-[11px] text-slate-200">{item.name}</strong><span className="mt-1 block text-[9px] text-slate-500">شراء {formatCurrency(item.unitPrice)} / بيع {item.salePrice !== undefined && item.salePrice !== null && item.salePrice !== '' ? formatCurrency(item.salePrice) : 'غير مسجل'} للوحدة</span></div>
                               <label className="text-center text-[9px] text-slate-500">العدد<input type="number" min="1" step="1" inputMode="numeric" lang="en" dir="ltr" value={item.quantity} onChange={event => updatePrintDraftItem(item.id, 'quantity', event.target.value)} className="mt-1 w-full rounded-md border border-slate-700 bg-slate-900 px-1 py-1.5 text-center text-xs text-white outline-none focus:border-indigo-400" /></label>
                               <div className="text-center"><span className="block text-[9px] text-slate-500">إجمالي الشراء</span><strong className="mt-1 block text-[10px] font-black text-indigo-100">{formatCurrency(purchaseSubtotal)}</strong></div>
                               <div className="text-center"><span className="block text-[9px] text-slate-500">إجمالي البيع</span><strong className="mt-1 block text-[10px] font-black text-emerald-100">{saleSubtotal === null ? 'غير مسجل' : formatCurrency(saleSubtotal)}</strong></div>
                               <button type="button" onClick={() => removePrintDraftItem(item.id)} aria-label={`حذف ${item.name} من الفاتورة`} title="حذف من الفاتورة" className="flex h-8 w-8 items-center justify-center rounded-lg text-red-300 transition hover:bg-red-950/40"><i className="ph ph-trash"></i></button>
                             </div>;
                           })}
                         </div>}
                       </div>
                       <div className="grid grid-cols-2 gap-2 sm:grid-cols-3 2xl:grid-cols-5">
                         <div className="rounded-xl border border-indigo-400/20 bg-indigo-950/20 p-3 text-center"><span className="block text-[10px] text-indigo-100/70">إجمالي الشراء</span><strong className="mt-1 block text-base font-black text-indigo-100">{formatCurrency(printTotalAmount)}</strong></div>
                         <div className="rounded-xl border border-emerald-400/20 bg-emerald-950/20 p-3 text-center"><span className="block text-[10px] text-emerald-100/70">إجمالي البيع</span><strong className="mt-1 block text-base font-black text-emerald-100">{printSalesTotalAmount === null ? 'غير مسجل' : formatCurrency(printSalesTotalAmount)}</strong></div>
                         <div className={`rounded-xl border p-3 text-center ${printProfitAmount === null ? 'border-slate-700 bg-slate-900' : printProfitAmount >= 0 ? 'border-teal-400/20 bg-teal-950/20' : 'border-red-400/20 bg-red-950/20'}`}><span className="block text-[10px] text-slate-300/70">الربح المتوقع</span><strong className={`mt-1 block text-base font-black ${printProfitAmount === null ? 'text-slate-400' : printProfitAmount >= 0 ? 'text-teal-200' : 'text-red-200'}`}>{printProfitAmount === null ? 'غير مسجل' : formatCurrency(printProfitAmount)}</strong></div>
                         <label className="rounded-xl border border-emerald-400/20 bg-emerald-950/20 p-3 text-center text-[10px] font-bold text-emerald-100/70">المدفوع للمطبعة<input type="number" min="0" max={printTotalAmount} step="0.01" inputMode="decimal" lang="en" dir="ltr" value={printPaidDraft} onChange={event => setPrintPaidDraft(event.target.value)} className="mt-1 w-full rounded-lg border border-emerald-400/20 bg-slate-950 px-2 py-1.5 text-center text-base font-black text-emerald-100 outline-none focus:border-emerald-300" /></label>
                         <div className={`rounded-xl border p-3 text-center ${printRemainingAmount > 0 ? 'border-red-400/20 bg-red-950/20' : 'border-emerald-400/20 bg-emerald-950/20'}`}><span className="block text-[10px] text-slate-300/70">باقي عليك للمطبعة</span><strong className={`mt-1 block text-lg font-black ${printRemainingAmount > 0 ? 'text-red-200' : 'text-emerald-200'}`}>{formatCurrency(printRemainingAmount)}</strong></div>
                       </div>
                       <div className="flex flex-col gap-2 sm:flex-row"><button type="submit" disabled={isSavingPrintRecord || printDraftItems.length === 0} className="flex min-h-11 flex-1 items-center justify-center gap-2 rounded-xl bg-indigo-600 py-3 text-sm font-black text-white shadow-lg shadow-indigo-950/30 transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"><i className={`ph ${isSavingPrintRecord ? 'ph-spinner animate-spin' : editingPrintRecordId ? 'ph-check-circle' : 'ph-floppy-disk'} text-lg`}></i>{isSavingPrintRecord ? 'جارٍ الحفظ...' : editingPrintRecordId ? 'تحديث حساب المطبعة' : 'حفظ في سجل المطبعة'}</button>{editingPrintRecordId && <button type="button" onClick={cancelPrintRecordEdit} className="min-h-11 rounded-xl border border-slate-700 bg-slate-800 px-5 text-sm font-bold text-slate-200 transition hover:bg-slate-700">إلغاء التعديل</button>}</div>
                     </form>
                     <div className="border-t border-slate-800 p-4 sm:p-5">
                       <div className="mb-3 flex flex-wrap items-center justify-between gap-2"><h3 className="font-black text-white">سجل حسابات المطبعة</h3><span className="rounded-full border border-slate-700 bg-slate-950 px-2.5 py-1 text-[10px] font-bold text-slate-300">{printRecords.length} عملية طباعة</span></div>
                       {printRecordsError && <p className="mb-3 rounded-lg border border-red-400/20 bg-red-950/20 p-3 text-xs text-red-200">{printRecordsError}</p>}
                       <div className="max-h-[420px] space-y-3 overflow-y-auto pr-1 custom-scrollbar">
                         {isLoadingPrintRecords ? <p className="rounded-xl border border-slate-800 bg-slate-950 p-6 text-center text-xs text-slate-400"><i className="ph ph-spinner animate-spin ml-1"></i> جارٍ تحميل سجل المطبعة...</p> : printRecords.length === 0 ? <p className="rounded-xl border border-dashed border-slate-700 bg-slate-950 p-6 text-center text-xs text-slate-500">لا توجد حسابات مطبعة مسجلة بعد.</p> : printRecords.map(record => <article key={record.id} className="rounded-xl border border-slate-800 bg-slate-950 p-3 sm:p-4">
                           <div className="flex items-start justify-between gap-3"><div className="min-w-0"><h4 className="truncate text-sm font-black text-white">{record.printerName || 'مطبعة بدون اسم'}</h4><p className="mt-1 text-[10px] text-slate-400">تاريخ الطباعة: <span dir="ltr" className="font-mono">{formatDateOnly(record.printDate)}</span></p></div><div className="flex shrink-0 items-center gap-1"><button type="button" onClick={() => startEditingPrintRecord(record)} title="تعديل حساب المطبعة" aria-label={`تعديل حساب ${record.printerName || 'المطبعة'}`} className="flex h-8 w-8 items-center justify-center rounded-lg text-indigo-300 transition hover:bg-indigo-950/40 hover:text-indigo-100"><i className="ph ph-pencil-simple"></i></button><button type="button" onClick={() => deletePrintRecord(record)} title="حذف السجل" aria-label="حذف سجل المطبعة" className="flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 transition hover:bg-red-950/40 hover:text-red-300"><i className="ph ph-trash"></i></button></div></div>
                           <div className="mt-3 space-y-1.5">{(record.items || []).map((item, index) => <div key={`${record.id}-item-${index}`} className="flex items-start justify-between gap-3 text-[11px]"><span className="min-w-0 truncate text-slate-300">{item.name} <span className="text-slate-500">({Number(item.quantity || 0).toLocaleString('en-US')} × شراء {formatCurrency(item.purchasePrice ?? item.unitPrice ?? 0)}{item.salePrice !== undefined ? ` / بيع ${formatCurrency(item.salePrice)}` : ''})</span></span><strong className="shrink-0 text-slate-200">{formatCurrency(item.purchaseSubtotal ?? item.subtotal ?? 0)}</strong></div>)}</div>
                           <div className="mt-3 grid grid-cols-2 gap-1.5 border-t border-slate-800 pt-3 text-center sm:grid-cols-3 2xl:grid-cols-5"><div><span className="block text-[9px] text-slate-500">عدد الخدمات</span><strong className="mt-0.5 block text-[11px] font-black text-slate-200">{Number(record.serviceCount ?? (record.items || []).reduce((sum, item) => sum + (Number(item.quantity) || 0), 0)).toLocaleString('en-US')}</strong></div><div><span className="block text-[9px] text-slate-500">إجمالي الشراء</span><strong className="mt-0.5 block text-[11px] font-black text-indigo-200">{formatCurrency(record.purchaseTotalAmount ?? record.totalAmount ?? 0)}</strong></div><div><span className="block text-[9px] text-slate-500">إجمالي البيع</span><strong className="mt-0.5 block text-[11px] font-black text-emerald-200">{record.saleTotalAmount !== undefined ? formatCurrency(record.saleTotalAmount) : '—'}</strong></div><div><span className="block text-[9px] text-slate-500">مدفوع للمطبعة</span><strong className="mt-0.5 block text-[11px] font-black text-emerald-200">{formatCurrency(record.paidAmount || 0)}</strong></div><div><span className="block text-[9px] text-slate-500">المتبقي</span><strong className={`mt-0.5 block text-[11px] font-black ${(Number(record.remainingAmount) || 0) > 0 ? 'text-red-200' : 'text-emerald-200'}`}>{formatCurrency(record.remainingAmount || 0)}</strong></div><div className="col-span-2 sm:col-span-3 2xl:col-span-5"><span className="text-[9px] text-slate-500">الربح المتوقع: </span><strong className="text-[11px] font-black text-teal-200">{record.profitAmount !== undefined ? formatCurrency(record.profitAmount) : '—'}</strong></div></div>
                         </article>)}
                       </div>
                     </div>
                   </section>
                </div>

                <div className="min-w-0 space-y-4 sm:space-y-5 xl:col-span-1 xl:space-y-6">
                   <div className="min-w-0 rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-sm sm:p-5 lg:p-6">
                      <h2 className="mb-2 flex items-center gap-2 border-b border-slate-800 pb-4 text-lg font-bold text-slate-100 sm:text-xl"><i className="ph ph-stack text-2xl text-purple-400"></i> إدارة وإحصائيات المخزون</h2>
                      <p className="mb-3 text-[10px] text-slate-400">أدخل الكمية مباشرةً ثم اضغط «حفظ»، أو استخدم زري الزيادة والنقصان.</p>
                      <div className="mb-4 min-w-0 rounded-2xl border border-yellow-500/30 bg-yellow-950/20 p-3 sm:p-4"><div className="mb-3 flex min-w-0 items-start gap-2"><i className="ph-fill ph-lightning mt-0.5 shrink-0 text-xl text-yellow-300"></i><div className="min-w-0"><h3 className="text-sm font-black text-yellow-100">مخزون الطباعة الفورية</h3><p className="mt-1 text-[10px] text-yellow-100/60">يُخصم تلقائيًا عند اختيار «فوري» في نموذج العملية.</p></div></div><div className="mb-3 grid grid-cols-2 gap-2 text-center"><div className="min-w-0 rounded-xl border border-slate-700 bg-slate-950/70 p-2"><span className="block text-[10px] text-slate-400">الأوراق المتاحة</span><strong className="break-all text-xl font-black text-yellow-200">{inventory['ورق طباعة صور'] || 0}</strong></div><div className="min-w-0 rounded-xl border border-slate-700 bg-slate-950/70 p-2"><span className="block text-[10px] text-slate-400">سعر الورقة</span><strong className="break-all text-xl font-black text-emerald-200">{formatCurrency(settings.instantPrintSheetPrice || 0)}</strong></div></div><div className="flex min-w-0 gap-2"><input type="number" min="0" value={instantSheetPrice} onChange={e => setInstantSheetPrice(e.target.value)} placeholder="سعر الورقة للعميل" className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 p-2 text-xs text-white outline-none focus:border-yellow-400" /><button type="button" onClick={saveInstantSheetPrice} className="shrink-0 rounded-lg bg-yellow-500 px-3 py-2 text-xs font-black text-slate-950 hover:bg-yellow-400">حفظ السعر</button></div><p className="mt-2 text-[10px] text-slate-500">استخدم أزرار مخزون «ورق طباعة صور» أسفل البطاقة لإضافة أو خصم الأوراق يدويًا.</p></div>
                      <div className="grid min-w-0 grid-cols-1 gap-3 overflow-y-auto pb-2 pr-1 custom-scrollbar xl:max-h-[65vh] xl:pr-2">
                         {inventoryItemsList.map((item, idx) => {
                            const itemName = item.name;
                            const currentStock = inventory[itemName] !== undefined ? inventory[itemName] : (item.totalQty || 0);
                            const stockInputValue = inventoryDrafts[itemName] ?? String(currentStock);
                            const parsedStockInput = Number(stockInputValue);
                            const canSaveStock = stockInputValue.trim() !== '' && Number.isSafeInteger(parsedStockInput) && parsedStockInput >= 0 && parsedStockInput !== Number(currentStock);
                            return (
                            <div key={idx} className="flex min-w-0 flex-col rounded-2xl border border-slate-800 bg-slate-950 p-3 shadow-md transition-all hover:border-purple-500/50 sm:p-4">
                               <div className="text-center mb-4"><span className="font-bold text-slate-200 text-sm block truncate">{itemName}</span></div>
                               <div className="flex items-center gap-1.5 bg-slate-900 p-1.5 rounded-xl border border-slate-700 shadow-inner mb-4">
                                  <button type="button" onClick={()=>updateInventory(itemName, -1, currentStock)} aria-label={`إنقاص كمية ${itemName}`} className="shrink-0 text-red-400 hover:bg-slate-800 w-8 h-8 rounded-lg flex items-center justify-center"><i className="ph ph-minus text-base font-bold"></i></button>
                                  <input type="number" min="0" step="1" lang="en" dir="ltr" inputMode="numeric" value={stockInputValue} onChange={event => setInventoryDrafts(prev => ({ ...prev, [itemName]: event.target.value }))} onKeyDown={event => { if (event.key === 'Enter' && canSaveStock) { event.preventDefault(); saveInventoryQuantity(itemName, stockInputValue); } }} aria-label={`كمية ${itemName}`} className="min-w-0 h-9 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-1 text-center text-lg font-black text-white outline-none focus:border-purple-400" />
                                  <button type="button" onClick={()=>updateInventory(itemName, 1, currentStock)} aria-label={`زيادة كمية ${itemName}`} className="shrink-0 text-green-400 hover:bg-slate-800 w-8 h-8 rounded-lg flex items-center justify-center"><i className="ph ph-plus text-base font-bold"></i></button>
                                  <button type="button" onClick={()=>saveInventoryQuantity(itemName, stockInputValue)} disabled={!canSaveStock} className="shrink-0 rounded-lg bg-purple-600 px-2.5 py-2 text-[10px] font-black text-white transition hover:bg-purple-500 disabled:cursor-not-allowed disabled:opacity-40">حفظ</button>
                               </div>
                            </div>
                         )})}
                      </div>
                   </div>
                   <section className="min-w-0 rounded-2xl border border-indigo-400/25 bg-slate-900 p-4 shadow-sm sm:p-5">
                     <div className="flex min-w-0 flex-wrap items-start justify-between gap-2"><div className="min-w-0"><h2 className="flex items-center gap-2 text-base font-black text-white"><i className="ph ph-printer shrink-0 text-xl text-indigo-300"></i> قوالب منتجات المطبعة</h2><p className="mt-1 text-[10px] text-slate-400">تُدار من الإعدادات &gt; قوالب البضاعة والمنتجات؛ أسعار الشراء والبيع هنا للعرض فقط.</p></div><span className="shrink-0 rounded-full border border-indigo-400/20 bg-indigo-950/30 px-2 py-1 text-[10px] text-indigo-100">{(settings.products || []).length} قالب</span></div>
                   </section>
                   <section className="min-w-0 rounded-2xl border border-slate-800 bg-slate-900 p-4 shadow-sm sm:p-5">
                     <div className="mb-3"><h3 className="text-sm font-black text-slate-100">اختيار قوالب البضاعة والمنتجات</h3><p className="mt-1 text-[10px] text-slate-500">سعر الجملة هو تكلفة الشراء، وسعر البيع مأخوذ تلقائيًا من القالب. اختر العدد فقط.</p></div>
                     {printProductTemplates.length === 0 ? <p className="rounded-xl border border-dashed border-slate-700 p-5 text-center text-xs text-slate-500">لا توجد قوالب منتجات في الإعدادات.</p> : <div className="grid min-w-0 grid-cols-1 gap-2.5 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-2 2xl:grid-cols-3">
                       {printProductTemplates.map(template => {
                         const hasPurchasePrice = Number.isFinite(template.purchasePrice) && template.purchasePrice >= 0;
                         const hasSalePrice = Number.isFinite(template.salePrice) && template.salePrice >= 0;
                         return <div key={template.templateKey} className="flex flex-col rounded-xl border border-slate-800 bg-slate-950/70 p-3">
                           <div className="min-w-0"><h4 className="truncate text-xs font-black text-white">{template.name}</h4></div>
                           <div className="mt-2 space-y-1 rounded-lg border border-slate-800 bg-slate-950/60 p-2 text-[9px]"><div className="flex justify-between gap-2"><span className="text-slate-500">سعر الشراء (جملة)</span><strong className={hasPurchasePrice ? 'text-indigo-200' : 'text-red-300'}>{hasPurchasePrice ? formatCurrency(template.purchasePrice) : 'غير محدد'}</strong></div><div className="flex justify-between gap-2"><span className="text-slate-500">سعر البيع</span><strong className={hasSalePrice ? 'text-emerald-200' : 'text-red-300'}>{hasSalePrice ? formatCurrency(template.salePrice) : 'غير محدد'}</strong></div></div>
                           <label className="mt-2 text-[9px] font-bold text-slate-500">العدد<div className="mt-1 flex items-center gap-1"><button type="button" onClick={() => adjustPrintProductQuantity(template.templateKey, -1)} aria-label={`تقليل عدد ${template.name}`} className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-slate-700 bg-slate-900 text-red-300 transition hover:border-red-400/50 hover:bg-red-950/30"><i className="ph-bold ph-minus"></i></button><input type="number" min="0" step="1" inputMode="numeric" lang="en" dir="ltr" value={printProductQuantities[template.templateKey] ?? ''} onChange={event => setPrintProductQuantities(prev => ({ ...prev, [template.templateKey]: event.target.value }))} placeholder="0" aria-label={`عدد ${template.name}`} className="min-w-0 w-full flex-1 rounded-lg border border-slate-700 bg-slate-950 px-1 py-2 text-center text-xs text-white outline-none focus:border-indigo-400" /><button type="button" onClick={() => adjustPrintProductQuantity(template.templateKey, 1)} aria-label={`زيادة عدد ${template.name}`} className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border border-slate-700 bg-slate-900 text-emerald-300 transition hover:border-emerald-400/50 hover:bg-emerald-950/30"><i className="ph-bold ph-plus"></i></button></div></label>
                           <button type="button" disabled={!hasPurchasePrice || !hasSalePrice} onClick={() => addPrintTemplate(template)} className="mt-2 inline-flex min-h-9 items-center justify-center gap-1 rounded-lg bg-indigo-600 px-2.5 py-2 text-[10px] font-black text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-40"><i className="ph ph-plus-circle"></i> أضف للفاتورة</button>
                         </div>;
                       })}
                     </div>}
                   </section>
                </div>

                {showMonthModal && (
                    <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 m-auto" onClick={() => setShowMonthModal(false)}>
                        <div className="relative m-auto flex max-h-[90vh] w-full max-w-2xl flex-col rounded-3xl border border-slate-800 bg-slate-900 p-4 shadow-xl sm:p-6" onClick={e => e.stopPropagation()}>
                            <button onClick={() => setShowMonthModal(false)} className="absolute top-4 left-4 p-2 text-slate-500 hover:text-red-400 z-10"><i className="ph ph-x text-2xl"></i></button>
                            <div className="mb-6 border-b border-slate-800 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                <h3 className="text-xl font-black text-red-400 flex items-center gap-2">
                                    <i className="ph-fill ph-calendar-check text-2xl"></i> سجل المصروفات
                                </h3>
                                <div className="flex min-w-0 flex-wrap gap-2">
                                    <select value={filterMonth} onChange={e => setFilterMonth(e.target.value)} className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-bold text-white outline-none">
                                        {Array.from({length: 12}, (_, i) => i + 1).map(m => <option key={m} value={m}>شهر {m}</option>)}
                                    </select>
                                    <select value={filterYear} onChange={e => setFilterYear(e.target.value)} className="min-w-0 flex-1 rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm font-bold text-white outline-none">
                                        {[currentYear-1, currentYear, currentYear+1].map(y => <option key={y} value={y}>{y}</option>)}
                                    </select>
                                </div>
                            </div>
                            
                            <div className="mb-4 flex shrink-0 flex-wrap items-center justify-between gap-2 rounded-xl border border-red-900/50 bg-red-950/30 p-3 text-red-400 sm:p-4">
                                <span className="font-bold">إجمالي مصروفات الفترة المحددة:</span>
                                <span className="text-xl font-black">{formatCurrency(filteredMonthTotalExp)}</span>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-3">
                                {filteredMonthExpenses.length === 0 ? <p className="text-slate-500 text-center py-6 bg-slate-950 rounded-xl border border-slate-800 border-dashed">لا توجد مصروفات مسجلة في هذا الشهر.</p> : filteredMonthExpenses.map(exp => (
                                    <div key={exp.id} className="flex min-w-0 flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-800 bg-slate-950 p-3 transition-colors hover:border-red-500/30 sm:p-4">
                                        <div className="min-w-0 flex-1">
                                            <p className="font-bold text-slate-200">{exp.category} <span className="text-red-400 mx-2">{exp.amount} ج.م</span> <span className={`text-[10px] px-2 py-0.5 rounded ${exp.type === 'wedding' ? 'bg-pink-900/40 text-pink-400' : 'bg-blue-900/40 text-blue-400'}`}>{exp.type === 'wedding' ? 'زفاف' : 'استوديو'}</span></p>
                                            {exp.notes && <p className="text-xs text-slate-500 mt-1">{exp.notes}</p>}
                                            <p className="text-xs text-slate-600 mt-1 font-mono">{formatDate(exp.date)}</p>
                                        </div>
                                        <button onClick={async () => { const appId = typeof __app_id !== 'undefined' ? __app_id : 'studio-marakby'; await deleteDoc(doc(db, `artifacts/${appId}/public/data/expenses`, exp.id)); }} className="text-slate-500 hover:text-red-400 p-2"><i className="ph ph-trash text-xl"></i></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                )}

              </div>
            );
        };

        const ReportsTab = ({ settings, inventory, transactions, weddings, expenses, setReceiptImageModal }) => {
            const currentMonth = new Date().getMonth() + 1; const currentYear = new Date().getFullYear();
            const [filter, setFilter] = useState({ month: currentMonth, year: currentYear });
            const [electronicDetails, setElectronicDetails] = useState(null); const [showAmounts, setShowAmounts] = useState(false);
            const [selectedMonthDetails, setSelectedMonthDetails] = useState(null);
            
            const filteredTxns = transactions.filter(t => t.month == filter.month && t.year == filter.year);
            const filteredWeds = weddings.filter(t => t.month == filter.month && t.year == filter.year);
            const filteredExp = expenses.filter(e => e.month == filter.month && e.year == filter.year);
            
            const targetDateObj = new Date(filter.year, filter.month - 1, 1);
            const studioCollectedStats = useMemo(() => calculatePeriodRevenue(transactions, targetDateObj, 'month'), [transactions, filter]);
            const wedCollectedStats = useMemo(() => calculatePeriodRevenue(weddings, targetDateObj, 'month'), [weddings, filter]);
            const summarizeInstant = (year, month) => {
                const summary = { photos: 0, total: 0, unpriced: 0, receipts: 0, services: {} };
                const monthKey = `${year}-${String(month).padStart(2, '0')}`;
                (transactions || []).forEach(record => {
                    const date = new Date(record.dateTime || record.createdAt || record.date || '');
                    if (Number.isNaN(date.getTime()) || `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}` !== monthKey || !isInstantStatsRecordIncluded(record, settings)) return;
                    const items = getExplicitInstantPrintItems(record); if (!items.length) return;
                    summary.receipts += 1;
                    items.forEach(item => { const value = item.qty * item.unitPrice; summary.photos += item.qty; summary.total += value; if (!item.unitPrice) summary.unpriced += item.qty; const name = item.name || 'طباعة فورية'; if (!summary.services[name]) summary.services[name] = { photos: 0, total: 0 }; summary.services[name].photos += item.qty; summary.services[name].total += value; });
                });
                summary.average = summary.photos ? summary.total / summary.photos : 0; return summary;
            };
            const monthlyInstantSummary = useMemo(() => summarizeInstant(filter.year, filter.month), [transactions, filter, settings.instantStatsStartDate]);
            const previousInstantMonth = useMemo(() => { const d = new Date(Number(filter.year), Number(filter.month) - 2, 1); return summarizeInstant(d.getFullYear(), d.getMonth() + 1); }, [transactions, filter, settings.instantStatsStartDate]);
            const instantRevenueShare = (studioCollectedStats.total + wedCollectedStats.total) > 0 ? (monthlyInstantSummary.total / (studioCollectedStats.total + wedCollectedStats.total)) * 100 : 0;
            const topInstantServices = Object.entries(monthlyInstantSummary.services).sort((a, b) => b[1].total - a[1].total).slice(0, 5);
            const instantSheetsAvailable = Math.max(0, Number(inventory?.['ورق طباعة صور'] || 0));
            const instantSheetPrice = Math.max(0, Number(settings.instantPrintSheetPrice || 0));

            const studioExpTotal = useMemo(() => filteredExp.filter(e => e.type !== 'wedding').reduce((sum, e) => sum + e.amount, 0), [filteredExp]);
            const weddingExpTotal = useMemo(() => filteredExp.filter(e => e.type === 'wedding').reduce((sum, e) => sum + e.amount, 0), [filteredExp]);

            const studioStats = useMemo(() => {
              const expected = filteredTxns.reduce((sum, t) => sum + (parseFloat(t.total)||0), 0);
              return { expected, collected: studioCollectedStats.total, cash: studioCollectedStats.cash, electronic: studioCollectedStats.electronic, debts: filteredTxns.reduce((sum, t) => sum + (parseFloat(t.remaining)||0), 0), expenses: studioExpTotal, netProfit: studioCollectedStats.total - studioExpTotal };
            }, [filteredTxns, studioCollectedStats, studioExpTotal]);

            const wedStats = useMemo(() => {
              const expected = filteredWeds.reduce((sum, t) => sum + (parseFloat(t.total)||0), 0);
              return { expected, collected: wedCollectedStats.total, cash: wedCollectedStats.cash, electronic: wedCollectedStats.electronic, debts: filteredWeds.reduce((sum, t) => sum + (parseFloat(t.remaining)||0), 0), expenses: weddingExpTotal, netProfit: wedCollectedStats.total - weddingExpTotal };
            }, [filteredWeds, wedCollectedStats, weddingExpTotal]);

            const MonthlyStatsTable = () => {
                const activeMonthsSet = new Set();
                transactions.forEach(t => { if(t.year == filter.year) activeMonthsSet.add(t.month); });
                weddings.forEach(t => { if(t.year == filter.year) activeMonthsSet.add(t.month); });
                expenses.forEach(e => { if(e.year == filter.year) activeMonthsSet.add(e.month); });
                
                const stats = Array.from(activeMonthsSet).sort((a,b) => a - b).map(month => {
                    const tDate = new Date(filter.year, month - 1, 1);
                    const txns = transactions.filter(t => t.month === month && t.year === parseInt(filter.year));
                    const weds = weddings.filter(t => t.month === month && t.year === parseInt(filter.year));
                    const exps = expenses.filter(e => e.month === month && e.year === parseInt(filter.year));
                    
                    const studioRev = calculatePeriodRevenue(txns, tDate, 'month').total;
                    const wedRev = calculatePeriodRevenue(weds, tDate, 'month').total;
                    const collected = studioRev + wedRev;
                    
                    const expsByCategory = {};
                    exps.forEach(e => {
                        expsByCategory[e.category] = (expsByCategory[e.category] || 0) + e.amount;
                    });

                    const totalExpenses = exps.reduce((sum, e) => sum + e.amount, 0);
                    const netProfit = collected - totalExpenses;
                    
                    return { month, collected, studioRev, wedRev, expenses: totalExpenses, expsByCategory, netProfit };
                });

                if (stats.length === 0) return (
                    <div className="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 mt-6">
                        <p className="text-center text-slate-500 py-6">لا توجد داتا وحجوزات مسجلة في هذا العام لعرض الإحصائيات.</p>
                    </div>
                );

                return (
                    <div className="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 mt-6 overflow-hidden">
                        <h3 className="text-lg font-bold text-slate-100 mb-4 border-b border-slate-800 pb-3 flex items-center gap-2">
                            <i className="ph-fill ph-chart-line-up text-yellow-500 text-xl"></i> ملخص إحصائيات الشهور لعام {filter.year} <span className="text-xs text-slate-400 font-normal mr-2">(اضغط على الشهر للتفاصيل)</span>
                        </h3>
                        <div className="overflow-x-auto custom-scrollbar">
                            <table className="w-full text-sm text-right text-slate-400 min-w-[600px]">
                                <thead className="text-xs text-slate-300 uppercase bg-slate-950 border-b border-slate-800">
                                    <tr>
                                        <th scope="col" className="px-4 py-3 font-bold">الشهر</th>
                                        <th scope="col" className="px-4 py-3 font-bold text-green-400">الإيرادات المحصلة</th>
                                        <th scope="col" className="px-4 py-3 font-bold text-red-400">المصروفات</th>
                                        <th scope="col" className="px-4 py-3 font-bold text-yellow-400">صافي الربح</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {stats.map(s => (
                                        <tr key={s.month} onClick={() => setSelectedMonthDetails(s)} className="border-b border-slate-800 hover:bg-slate-800/50 transition-colors cursor-pointer group">
                                            <th scope="row" className="px-4 py-3 font-bold text-slate-200 whitespace-nowrap group-hover:text-blue-400">
                                                شهر {s.month} <i className="ph ph-arrow-square-out text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                                            </th>
                                            <td className="px-4 py-3 font-bold">{showAmounts ? `${s.collected} ج.م` : '••••••'}</td>
                                            <td className="px-4 py-3 font-bold">{showAmounts ? `${s.expenses} ج.م` : '••••••'}</td>
                                            <td className={`px-4 py-3 font-black ${s.netProfit >= 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                {showAmounts ? `${s.netProfit} ج.م` : '••••••'}
                                            </td>
                                        </tr>
                                    ))}
                                    <tr className="bg-slate-950 border-t-2 border-slate-700">
                                        <th scope="row" className="px-4 py-4 font-black text-slate-100">الإجمالي السنوي</th>
                                        <td className="px-4 py-4 font-black text-green-400">{showAmounts ? `${stats.reduce((sum, s) => sum + s.collected, 0)} ج.م` : '••••••'}</td>
                                        <td className="px-4 py-4 font-black text-red-400">{showAmounts ? `${stats.reduce((sum, s) => sum + s.expenses, 0)} ج.م` : '••••••'}</td>
                                        <td className={`px-4 py-4 font-black ${stats.reduce((sum, s) => sum + s.netProfit, 0) >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                                            {showAmounts ? `${stats.reduce((sum, s) => sum + s.netProfit, 0)} ج.م` : '••••••'}
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
              <div className="space-y-4">
                <div className="bg-slate-900 p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-wrap gap-3 items-center justify-between">
                  <h2 className="text-lg sm:text-xl font-bold flex items-center gap-2 text-slate-100"><i className="ph ph-calendar-blank text-blue-400 text-xl sm:text-2xl"></i> تقارير شهرية شاملة ومفصلة</h2>
                  <div className="flex gap-2">
                    <button onClick={() => setShowAmounts(!showAmounts)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 transition-colors" title={showAmounts ? "إخفاء المبالغ" : "إظهار المبالغ"}>
                        <i className={`ph ${showAmounts ? 'ph-eye-slash' : 'ph-eye'} text-lg`}></i>
                    </button>
                    <select value={filter.month} onChange={e => setFilter({...filter, month: e.target.value})} className="py-1.5 px-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none text-sm font-bold">{Array.from({length: 12}, (_, i) => i + 1).map(m => <option key={m} value={m}>شهر {m}</option>)}</select>
                    <select value={filter.year} onChange={e => setFilter({...filter, year: e.target.value})} className="py-1.5 px-3 border border-slate-700 bg-slate-950 text-white rounded-lg outline-none text-sm font-bold">{[currentYear-1, currentYear, currentYear+1].map(y => <option key={y} value={y}>{y}</option>)}</select>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-6">
                  
                  {/* قسم تقرير الاستوديو */}
                  <div className="bg-slate-900 p-5 rounded-2xl shadow-sm border border-slate-800 flex flex-col relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-2 h-full bg-blue-500"></div>
                    <h3 className="text-lg font-bold text-blue-400 mb-4 border-b border-slate-800 pb-3 flex items-center justify-between">
                        <span className="flex items-center gap-2"><i className="ph-fill ph-camera"></i> تقرير الاستوديو (تفصيلي)</span>
                    </h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-3">
                      <StatCard hideValue={!showAmounts} title="إجمالي الشغل المطلوب (هذا الشهر)" value={studioStats.expected} color="blue" />
                      <StatCard hideValue={!showAmounts} title="إجمالي المحصل الفعلي (هذا الشهر)" value={studioStats.collected} color="green" />
                      <StatCard hideValue={!showAmounts} title="إجمالي مصروفات الاستوديو (هذا الشهر)" value={studioStats.expenses} color="red" />
                      <StatCard hideValue={!showAmounts} title="ديون متبقية لشغل (هذا الشهر)" value={studioStats.debts} color="rose" />
                      <StatCard hideValue={!showAmounts} title="صافي ربح الاستوديو الفعلي" value={studioStats.netProfit} color="yellow" highlight />
                    </div>
                    <div className="mt-3 pt-3 border-t border-slate-800 grid grid-cols-2 gap-3 max-w-lg">
                        <StatCard hideValue={!showAmounts} title="محصل نقدي (كاش)" value={studioStats.cash} color="emerald" />
                        <StatCard hideValue={!showAmounts} title="محصل إلكتروني (محافظ/انستاباي)" value={studioStats.electronic} color="indigo" onClick={() => setElectronicDetails({ title: 'الدفع الإلكتروني (استوديو)', data: transactions.filter(t => t.payments && t.payments.some(p => p.method === 'electronic' && new Date(p.date).getMonth() + 1 == filter.month && new Date(p.date).getFullYear() == filter.year)) })} />
                    </div>
                  </div>

                  <div className="bg-slate-900 p-5 rounded-2xl shadow-sm border border-amber-500/20 flex flex-col relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-2 h-full bg-amber-400"></div>
                    <h3 className="text-lg font-bold text-amber-300 mb-4 border-b border-slate-800 pb-3 flex items-center justify-between"><span className="flex items-center gap-2"><i className="ph-fill ph-lightning"></i> التقرير المالي للطباعة الفورية</span><span className="text-[10px] font-bold text-slate-500">{filter.month}/{filter.year}</span></h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3"><StatCard hideValue={!showAmounts} title="إجمالي أسعار الفوري" value={monthlyInstantSummary.total} color="amber" highlight /><StatCard hideValue={!showAmounts} title="عدد الطباعات" value={monthlyInstantSummary.photos} color="yellow" valueType="number" /><StatCard hideValue={!showAmounts} title="عدد الإيصالات" value={monthlyInstantSummary.receipts} color="blue" valueType="number" /><StatCard hideValue={!showAmounts} title="متوسط سعر الطبعة" value={monthlyInstantSummary.average} color="green" /><StatCard hideValue={!showAmounts} title="مساهمة الفوري من الإيراد" value={instantRevenueShare} color="indigo" valueType="percent" /><StatCard hideValue={!showAmounts} title="إجمالي الشهر السابق" value={previousInstantMonth.total} color="slate" /><StatCard hideValue={!showAmounts} title="الأوراق المتاحة بالمخزون" value={instantSheetsAvailable} color="amber" valueType="number" /><StatCard hideValue={!showAmounts} title="سعر الورقة من المخزون" value={instantSheetPrice} color="green" /></div>
                    <div className="mb-3 flex flex-wrap items-center gap-2 rounded-xl border border-yellow-500/20 bg-yellow-950/15 px-3 py-2 text-[10px]"><span className="font-black text-yellow-200"><i className="ph-fill ph-stack ml-1"></i>مرتبط ببطاقة مخزون الطباعة الفورية</span><span className="text-slate-400">المتاح الآن: <b className="text-yellow-200">{instantSheetsAvailable} ورقة</b></span><span className="text-slate-400">المستخدم في الشهر: <b className="text-amber-200">{monthlyInstantSummary.photos} ورقة</b></span><span className="text-emerald-200">الرصيد يتحدث تلقائيًا بعد حفظ أو تعديل أي عملية فورية</span></div>

            const handleRemoveList = (key, idx) => { const newList = [...settings[key]]; newList.splice(idx, 1); setSettings({...settings, [key]: newList}); };
            const handleUpdateList = (key, newList) => { setSettings({...settings, [key]: newList}); };
            
            const handleSaveClick = async () => {
                setIsSaving(true);

                              <div className="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-500"></div>

        const FloatingPortalMessage = ({ navigateTo }) => {
            const [visible, setVisible] = useState(() => {
                try { return sessionStorage.getItem('portalReturnMessageDismissed') !== '1'; }
                catch (_) { return true; }
            });
            const getInitialPosition = () => {
                try {
                    const saved = JSON.parse(sessionStorage.getItem('portalReturnMessagePosition') || 'null');
                    if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) return saved;
                } catch (_) {}
                const width = Math.min(390, Math.max(260, window.innerWidth - 24));
                return { x: Math.max(12, window.innerWidth - width - 16), y: Math.max(12, window.innerHeight - 245) };
            };
            const [position, setPosition] = useState(getInitialPosition);
            const [isDragging, setIsDragging] = useState(false);
            const cardRef = useRef(null);
            const dragOffset = useRef({ x: 0, y: 0 });
            const latestPosition = useRef(position);

            useEffect(() => {
                const keepInsideViewport = () => {
                    if (!cardRef.current) return;
                    const rect = cardRef.current.getBoundingClientRect();
                    const viewport = window.visualViewport;
                    const viewportWidth = viewport?.width || window.innerWidth;
                    const viewportHeight = viewport?.height || window.innerHeight;
                    const current = latestPosition.current;
                    const next = {
                        x: Math.max(12, Math.min(current.x, viewportWidth - rect.width - 12)),
                        y: Math.max(12, Math.min(current.y, viewportHeight - rect.height - 12))
                    };
                    latestPosition.current = next;
                    setPosition(next);
                };
                window.addEventListener('resize', keepInsideViewport);
                window.addEventListener('orientationchange', keepInsideViewport);
                window.visualViewport?.addEventListener('resize', keepInsideViewport);
                const timer = setTimeout(keepInsideViewport, 0);
                return () => {
                    clearTimeout(timer);
                    window.removeEventListener('resize', keepInsideViewport);
                    window.removeEventListener('orientationchange', keepInsideViewport);
                    window.visualViewport?.removeEventListener('resize', keepInsideViewport);
                };
            }, []);

            const handleDragStart = (event) => {
                if (event.button !== undefined && event.button !== 0) return;
                event.preventDefault();
                const rect = cardRef.current.getBoundingClientRect();
                dragOffset.current = { x: event.clientX - rect.left, y: event.clientY - rect.top };
                event.currentTarget.setPointerCapture?.(event.pointerId);
                setIsDragging(true);
            };
            const handleDragMove = (event) => {
                if (!isDragging) return;
                const rect = cardRef.current?.getBoundingClientRect();
                const viewport = window.visualViewport;
                const viewportWidth = viewport?.width || window.innerWidth;
                const viewportHeight = viewport?.height || window.innerHeight;
                const width = rect?.width || Math.min(390, viewportWidth - 24);
                const height = rect?.height || 220;
                const x = Math.min(Math.max(12, event.clientX - dragOffset.current.x), Math.max(12, viewportWidth - width - 12));
                const y = Math.min(Math.max(12, event.clientY - dragOffset.current.y), Math.max(12, viewportHeight - height - 12));
                const next = { x, y };
                latestPosition.current = next;
                setPosition(next);
            };
            const handleDragEnd = () => {
                if (!isDragging) return;
                setIsDragging(false);
                try { sessionStorage.setItem('portalReturnMessagePosition', JSON.stringify(latestPosition.current)); } catch (_) {}
            };
            const dismiss = () => {
                setVisible(false);
                try { sessionStorage.setItem('portalReturnMessageDismissed', '1'); } catch (_) {}
            };

            if (!visible) return null;
            return (
                <aside
                    ref={cardRef}
                    dir="rtl"
                    aria-label="دعوة لزيارة بوابة العملاء"
                    onPointerMove={handleDragMove}
                    onPointerUp={handleDragEnd}
                    onPointerCancel={handleDragEnd}
                    className={`fixed z-[180] w-[min(92vw,390px)] overflow-x-hidden overflow-y-auto rounded-2xl border border-cyan-300/30 bg-slate-900/95 text-right shadow-[0_18px_60px_rgba(0,0,0,0.55)] backdrop-blur-xl ${isDragging ? 'cursor-grabbing select-none' : ''}`}
                    style={{ left: `${position.x}px`, top: `${position.y}px`, maxHeight: 'calc(100vh - 24px)', touchAction: 'auto' }}
                >
                    <div className="h-1 bg-gradient-to-l from-cyan-300 via-blue-500 to-indigo-500"></div>
                    <div
                        onPointerDown={handleDragStart}
                        className="flex cursor-grab items-center justify-between gap-3 px-4 pt-3 pb-1 text-slate-400 touch-none"
                        title="اسحب من هنا لتحريك الرسالة"
                    >
                        <span className="flex items-center gap-1.5 text-[11px] font-bold"><i className="ph ph-arrows-out-cardinal"></i> اسحب لنقل الرسالة</span>
                        <button type="button" onPointerDown={(e) => e.stopPropagation()} onClick={dismiss} aria-label="إغلاق الرسالة" title="إغلاق" className="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-slate-400 transition hover:bg-slate-700 hover:text-white">
                            <i className="ph ph-x text-lg"></i>
                        </button>
                    </div>
                    <div className="px-4 pb-4 pt-1">
                        <div className="mb-1 flex items-center gap-2 text-cyan-200">
                            <i className="ph-fill ph-sparkle text-lg"></i>
                            <h2 className="text-sm font-black">نورتنا! بوابتك دايمًا مفتوحة</h2>
                        </div>
                        <p className="mb-3 text-xs leading-6 text-slate-300">احجز زيارتك القادمة بسهولة، وتابع أحدث عروضنا ومنتجاتنا من خلال بوابة العملاء.</p>
                        <div className="grid grid-cols-2 gap-2">
                            <button type="button" onClick={() => navigateTo('?client=true&view=booking')} className="rounded-xl bg-cyan-500 px-3 py-2.5 text-xs font-black text-slate-950 shadow-lg shadow-cyan-950/30 transition hover:bg-cyan-400">
                                <i className="ph ph-calendar-check ml-1"></i> احجز مرة قادمة
                            </button>
                            <button type="button" onClick={() => navigateTo('?client=true&view=products')} className="rounded-xl border border-slate-600 bg-slate-800 px-3 py-2.5 text-xs font-bold text-white transition hover:border-cyan-300/50 hover:bg-slate-700">
                                <i className="ph ph-gift ml-1"></i> العروض والمنتجات
                            </button>
                        </div>
                        <button type="button" onClick={() => navigateTo('?client=true')} className="mt-2 w-full rounded-xl py-2 text-xs font-bold text-cyan-200 transition hover:bg-cyan-950/50">
                            دخول بوابة العملاء <i className="ph ph-arrow-left mr-1"></i>
                        </button>
                    </div>
                </aside>
            );
        };
